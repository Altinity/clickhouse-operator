# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# Backups of the "backup-demo" ClickHouseInstallation (01-chi-with-backup.yaml) every hour, every day
# and every week. Each period keeps its own number of backups.
#
# Runs:
# - The operator runs the schedule on each backup-enabled cluster, through SQL on the sidecars.
#   No ClickHouseBackup resource is necessary.
# - Runs start at the scheduled times of all entries, here every hour at :30.
# - A running run is in status.active. A finished run is in status.recentRuns.
# - A run counts for each entry that its scheduled time matches. The run of Sunday 02:30 is the weekly,
#   the daily and the hourly run.
# - Each cluster names the backup of a run <prefix>-YYYYMMDDHHMMSS, from the scheduled time of the run.
#   The default prefix is <namespace>-<installation>-<schedule>, here default-backup-demo-nightly
#   (see the namespace note in 01-chi-with-backup.yaml).
#
# Retention, per cluster, after each successful run:
# - It keeps the newest "keep" backups of each entry, and always the newest backup. It deletes the
#   other backups of the series, newest first.
# - It looks only at the names <prefix>-YYYYMMDDHHMMSS and <prefix>-YYYYMMDDTHHMMSS. It never
#   deletes a one-off backup or a backup of another schedule.
# - A ClickHouseBackup with spec.scheduleRef to this schedule makes one backup now, with the
#   settings of this schedule (05-backup-from-schedule.yaml). Its name is <prefix>-YYYYMMDDTHHMMSS.
#   Retention keeps it while it is not older than the oldest scheduled backup that an entry keeps.
# - A backup that is not complete on all hosts does not count. Retention deletes it when a newer
#   complete backup exists and no create_remote or upload of it runs in system.backup_actions.
# - A backup listed with size 0 does not count, and is not deleted.
# - If another backup is incremental to a backup, retention rebases the other backup and then
#   deletes the backup.
# - Retention does not run while a restore of the cluster runs.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackupSchedule"
metadata:
  name: nightly
spec:
  clickHouseInstallation: backup-demo

  # Only this cluster (cannot be changed later); left out, every backup-enabled cluster of the
  # installation.
  # cluster: main

  # The periods of the backups. At most one entry per period:
  # minute (every minute, no time, for tests), hour, 6hours, daily, weekly, monthly.
  # - day: required for weekly (0..6, 0 is Sunday) and monthly (1..31). In a shorter month, a day
  #   after the end means the last day.
  # - keep: how many of the newest backups of the runs that match the entry to keep. The newest
  #   backup is never deleted. A backup that another backup is based on is rebased first.
  schedules:
    - period: hour
      keep: 24
    - period: daily
      keep: 7
    - period: weekly
      day: 0
      keep: 4
      # At most one entry can make incremental backups, on the newest backup of the series. When the
      # chain of incremental backups is as long as keep, the next run makes a full backup.
      # incremental: true

  # The time, HH:MM in timeZone, for all entries. Required with a daily, weekly or monthly entry. An hour
  # entry uses only its minute, a 6hours entry its hour modulo 6 and its minute. Entries with
  # the same scheduled time make one backup.
  time: "02:30"

  # The IANA time zone of the entries. Default: UTC
  # timeZone: Europe/Berlin

  # How long the operator waits for the sidecar commands of each run. A ClickHouseBackup that runs
  # this schedule also uses these values for the fields it does not set. A field that is not set
  # here comes from backup.timeouts of the operator configuration, or else the built-in default.
  # See docs/backup.md#timeouts.
  # timeouts:
  #   actionTimeout: 24h        # one command on one host, a Go duration, 12h by default
  #   unreachableTimeout: 30m   # a host whose ClickHouse does not answer, 10m by default
  #   errorResponsesMax: 5      # reads in a row that find no row of a command, then it is lost; 5 by default
  #   httpReceiveTimeout: 6h    # http_receive_timeout of the inserts, 4h by default

  # If true, the schedule starts no new runs on any cluster. A running run finishes. Ready becomes
  # False with the reason Suspended. Retention runs only in the runs, so no backup is deleted.
  # A backup that runs the schedule once (05-backup-from-schedule.yaml) still runs.
  # When you set false again, the schedule starts its latest missed run at once, if
  # spec.startingDeadlineSeconds did not pass. It skips the other missed runs.
  suspend: false

  # The maximum delay, in seconds, from the scheduled time of a run to its start. A run waits while the
  # operator is down, while a run of the cluster is in progress (runs never overlap), or while a
  # restore holds the cluster. After the deadline, the run is skipped, and the next run starts at its
  # own time. If unset, the latest missed run starts when it can. Earlier missed runs are always
  # skipped. The run time limit is spec.activeDeadlineSeconds, below.
  # startingDeadlineSeconds: 3600

  # How many successful runs status.recentRuns keeps. Default 3, minimum 1.
  successfulRunsHistoryLimit: 3

  # How many failed runs status.recentRuns keeps. Default 1, minimum 1. The Events of the schedule
  # tell what each run did.
  failedRunsHistoryLimit: 1

  # Table and database definitions only, no data
  # schemaOnly: false

  # Which replicas of each shard upload the backup. FirstPerShard, the default, backs up only the
  # first replica of each shard. That is complete for Replicated* tables, as every replica holds
  # their data, and the storage path must then not hold {replica}. AllReplicas makes every replica
  # upload a copy of its own, for tables that are not replicated, whose data differs between the
  # replicas. It takes that much more storage, and the path must hold {replica}, e.g.
  # backup/{namespace}/{installation}/{cluster}/{shard}/{replica}. Either way, a restore loads the
  # data on the first replica of each shard only, and replication brings it to the others: the data
  # the other replicas hold in tables that are not replicated is backed up, but not restored.
  replicaSelection: FirstPerShard

  # Only the matching tables. One clickhouse-backup pattern per item, such as db.table or db.*
  # tables: ["mydb.*"]

  # Leave out the matching tables, and the tables of these engines. System databases are always left out.
  # skipTables: ["mydb.tmp_*"]
  # skipTableEngines: ["Kafka"]

  # The maximum time, in seconds from its start, for the run of each cluster. Default: 24 hours.
  # Then the operator stops the run, and the backup of that cluster fails with the reason
  # DeadlineExceeded. There is no retry. Increase it for a backup that needs more than a day to upload.
  # activeDeadlineSeconds: 14400

  # The prefix of the backup names. A run names its backup <prefix>-YYYYMMDDHHMMSS, from its scheduled
  # time. A backup that runs the schedule once (05-backup-from-schedule.yaml) is named
  # <prefix>-YYYYMMDDTHHMMSS.
  # - Default: <namespace>-<installation>-<schedule>, here default-backup-demo-nightly. A prefix
  #   longer than 112 characters is shortened with a hash.
  # - The prefix identifies the series that retention deletes from. Thus you can set it once, and
  #   then the API server refuses to change or remove it. If it changed, nothing would delete the
  #   backups with the old prefix.
  # - Set it when you create the schedule. If you set it later, the runs so far used another prefix.
  #   This is correct only for a schedule that did not run yet, for example the schedule of a
  #   recovered installation that is held until it sets a prefix (SharesSourcePrefix, see
  #   07-recover-from-backup.yaml).
  # - Do not use the prefix of another schedule on the same storage path.
  # backupNamePrefix: nightly

  # Backups that retention keeps in addition to the entries (docs/backup.md#schedule-changes).
  # - onScheduleChange: Hold (the default). When the entries or the time zone change, each backup
  #   that the old schedule kept stays until the old schedule would delete it. For example, a backup
  #   kept by a weekly entry with keep 4 stays for 4 weeks after it was made.
  #   status.clusters[].heldBackups lists the backups that the new schedule would delete, and when
  #   each one expires.
  # - keepBackups: keeps a backup until an RFC 3339 time ("until"). Without "until", a held backup
  #   stays while it is held, and another backup stays while it is in the list.
  # - releaseHeld: releases the holds of a change, and of all earlier changes, at once.
  # retention:
  #   onScheduleChange: Hold
  #   keepBackups:
  #     - name: default-backup-demo-nightly-20261001020000
  #       until: "2027-01-01T00:00:00Z"
  #     - name: default-backup-demo-nightly-20261020T153000
  #   releaseHeld: "2026-11-12T12:00:00Z"
