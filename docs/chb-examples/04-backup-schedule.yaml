# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# Backups of the "backup-demo" ClickHouseInstallation (docs/chb-examples/01-chi-with-backup.yaml) every hour, every
# day and every week, each period keeping its own number of backups. A schedule makes its backups by itself, with no
# ClickHouseBackup resource: each backup-enabled cluster gets a CronJob of its own, all on the cron schedule of the
# finest entry, here every hour at :30, whose runs report in the status of this schedule. A run matches the time it
# was due at against the entries, and counts for every entry it matches: the run of Sunday 02:30 is the weekly, the
# daily and the hourly one. Every cluster names a run's backup <namespace>-backup-demo-nightly-YYYYMMDDHHMMSS, the
# time the run was due, as the default spec.backupNamePrefix starts with the schedule's namespace; the examples take
# "default", see docs/chb-examples/01-chi-with-backup.yaml. After every successful run, retention, per cluster, keeps
# the newest keep backups of every entry, the newest backup always, and deletes the rest of the series, newest first.
# It looks only at the names <prefix>-YYYYMMDDHHMMSS and <prefix>-YYYYMMDDTHHMMSS, never at a one-off backup or
# another schedule's. A ClickHouseBackup that names this schedule in its spec.scheduleRef makes a backup now, once,
# with the settings of this schedule (docs/chb-examples/05-backup-from-schedule.yaml), named <prefix>-YYYYMMDDTHHMMSS:
# retention keeps it while it is no older than the oldest scheduled backup an entry keeps, then deletes it. A backup
# not complete on every host, or listed of size 0, is neither counted nor deleted; a backup another one is
# incremental to is rebased before it is deleted, not kept for it. Retention is skipped while a restore of the cluster
# runs.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackupSchedule"
metadata:
  name: nightly
spec:
  clickHouseInstallation: backup-demo

  # Only this cluster (cannot be changed later); left out, every backup-enabled cluster of the
  # installation.
  # cluster: main

  # The periods the schedule backs up at, at most one entry per period: minute, hour, 6hours, daily, weekly, monthly
  # (minute, every minute and without a time, suits tests).
  # time is HH:MM in spec.timeZone, required for daily, weekly and monthly; every entry that sets a time sets the
  # same, and an hour or 6hours entry that sets none takes it: for hour only its minute counts, for 6hours its hour
  # modulo 6 and its minute. So every slot of a coarser entry is a slot of the finest one, whose cron schedule the
  # CronJobs run on. day is required for weekly, 0..6 with 0 being Sunday, and for monthly, 1..31, a day past the end
  # of a shorter month meaning its last day. A weekly and a monthly entry need a daily or finer one beside them, as
  # the CronJobs fire on the weekday of a finest weekly entry only. keep is how many of the newest backups made by
  # runs matching the entry are kept. The newest backup is never deleted, and a backup another one is based on is
  # rebased before it is.
  schedules:
    - period: hour
      keep: 24
    - period: daily
      time: "02:30"
      keep: 7
    - period: weekly
      time: "02:30"
      day: 0
      keep: 4
      # The runs of at most one entry make incremental backups on the newest backup of the series, as long as the
      # chain of incremental backups is shorter than its keep; the run after makes a full backup again.
      # incremental: true

  # The IANA time zone of the schedules, as the spec.timeZone of the CronJobs; by default the controller manager's,
  # usually UTC
  # timeZone: Europe/Berlin

  # True stops the CronJob of every cluster from starting runs: a run already in progress
  # finishes, and Ready turns False with the reason Suspended. Retention prunes in the runs only,
  # so no backup is deleted meanwhile, and a backup that runs the schedule once
  # (05-backup-from-schedule.yaml) runs all the same. Back to false, each CronJob starts the latest
  # run it missed at once, unless that is past spec.startingDeadlineSeconds, and skips the others.
  suspend: false

  # What a run due while the previous run of the same cluster is still running does. Forbid, the
  # default, starts it once the previous run has finished, late, and only the latest of the runs
  # missed meanwhile; not at all past spec.startingDeadlineSeconds. Allow starts it at once, and on
  # each host its backup waits until the sidecar has finished the previous one, as a sidecar runs
  # one operation at a time. Replace deletes the running Job, whose run then goes unreported, and
  # starts the new one; the backup that Job started keeps running on the sidecars, and the new run
  # waits for it there.
  concurrencyPolicy: Forbid

  # How many seconds after it was due a run that could not start then may still start, as the
  # spec.startingDeadlineSeconds of a Kubernetes CronJob: a run waits while the controller manager
  # is down, for instance, or, with Forbid, while the previous run is still running. Past it, the
  # run is skipped, and the next one starts at its own time. Unset, the latest run missed starts
  # whenever it can; of several missed runs, the earlier ones are skipped either way. How long a Job
  # may run once started is spec.activeDeadlineSeconds, below.
  # startingDeadlineSeconds: 3600

  # How many Jobs of successful runs the CronJob of each cluster keeps, with their Pods and logs,
  # deleting older ones: 3 by default, and at least 1, as the operator learns from the Job of a run
  # the backup it made, whether that backup holds data and the hosts it backed up.
  successfulJobsHistoryLimit: 3

  # How many Jobs of failed runs the CronJob of each cluster keeps, with their Pods and logs: 1 by
  # default, and at least 1, as the operator learns from the Job of a run why it failed and the
  # hosts it backed up. Raise it to keep the logs of more failed runs to look into.
  failedJobsHistoryLimit: 1

  # Table and database definitions only, no data
  # schemaOnly: false

  # Which replicas of each shard upload the backup. FirstPerShard, the default, backs up only the
  # first replica of each shard. That is complete for Replicated* tables, as every replica holds
  # their data, and the storage path must then not hold {replica}. AllReplicas makes every replica
  # upload a copy of its own, for tables that are not replicated, whose data differs between the
  # replicas. It takes that much more storage, and the path must hold {replica}, e.g.
  # backup/{namespace}/{installation}/{cluster}/{shard}/{replica}. Either way, a restore loads the
  # data on the first replica of each shard only, and replication brings it to the others: the data
  # the other replicas hold in tables that are not replicated is backed up, but not restored.
  replicaSelection: FirstPerShard

  # Only the matching tables: a clickhouse-backup pattern such as db.table or db.*, comma-separated
  # tables: "mydb.*"

  # How long each Job may run, in seconds counted from its start, before Kubernetes stops it, as the
  # spec.activeDeadlineSeconds of a Kubernetes Job: 24 hours by default. Each Job gets this long:
  # the backup Job of each cluster, and its verification Job, if any. A Job stopped at the deadline
  # fails the backup, or the verification, of its cluster with the reason DeadlineExceeded, as each
  # Job makes a single attempt. Raise it for a backup too large to upload in a day.
  # activeDeadlineSeconds: 14400

  # The prefix of the backup names: each run names its backup <prefix>-YYYYMMDDHHMMSS, the time it was due, and a backup that runs the schedule once (05-backup-from-schedule.yaml) is named
  # <prefix>-YYYYMMDDTHHMMSS. By default <namespace>-<installation>-<schedule>, shortened with a hash past 112
  # characters, here default-backup-demo-nightly. It names the series the retention deletes from, so it can be set
  # once and is immutable after: the API server refuses to change or remove it, as the backups of the former prefix
  # would be left unpruned. Set it when the schedule is created: set later to anything but the default, it changes
  # the prefix the runs so far used, which suits only a schedule that has not run yet, such as one of a recovered
  # installation held until it sets one (SharesSourcePrefix, see 07-recover-from-backup.yaml). So a prefix set by
  # hand must not be another schedule's on the same storage path.
  # backupNamePrefix: nightly

  # A ConfigMap of this namespace whose key backup-orchestrator.sh the runs of the CronJobs run instead of the operator's
  # orchestrator script, the one of the operator configuration (see docs/backup.md, The orchestrator script);
  # a backup that runs this schedule once takes it too, unless it names its own
  # orchestratorConfigMapRef:
  #   name: my-backup-orchestrator
