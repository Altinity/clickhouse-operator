# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# Restore a backup into "backup-demo-restored", a fresh ClickHouseInstallation with backup
# enabled, the same storage Secret and the same cluster names and shard layout as the source
# (e.g. a copy of docs/chb-examples/01-chi-with-backup.yaml under another name).
#
# Before it changes anything, the restore run of each cluster checks the storage paths. It also
# checks that each target host has the backup (spec.validateTopology).
# Then it restores as the Altinity usual backup workflow does:
# 1. Each host downloads the backup.
# 2. Each replica restores the schema. The first replica of the first shard uses ON CLUSTER.
# 3. The other replicas of each shard copy the data into the detached directories of their
#    Replicated* tables.
# 4. The first replica of each shard restores the data. Replication attaches it from the detached
#    directories on the other replicas.
# The operator does not check existing tables. clickhouse-backup drops and creates again the tables
# of the backup that exist. With spec.overwrite and no spec.tables, it drops the whole databases of
# the backup (restore --rm), also their tables that are not in the backup. ClickHouse refuses to
# drop a table larger than max_table_size_to_drop (50 GB by default) unless that limit is lifted.
# While the source keeps running on the same ZooKeeper or Keeper, give the copy its own
# spec.configuration.zookeeper.root, or its Replicated* tables join the source's replication (see
# docs/backup.md).
# Until it completes, the restore holds the backup schedules of the clusters it restores and, as it
# reads the backup of "backup-demo" of the same namespace, those of the clusters of "backup-demo" it
# reads, each until it finishes there, as their retention could delete that backup; it also waits
# for a scheduled run there to finish. Of the runs missed there meanwhile, at most the latest starts
# once the schedule is released, so restore outside the backup window of "backup-demo". A restore of
# a backup of another namespace (spec.sourceNamespace) holds nothing there.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseRestore"
metadata:
  name: backup-demo-restore
spec:
  clickHouseInstallation: backup-demo-restored

  # Only this cluster (cannot be changed later); left out, every backup-enabled cluster of the
  # installation.
  # cluster: main

  # The backup to restore, e.g. LAST-BACKUP of kubectl get chbs -o wide; check that it still exists
  # on every cluster.
  backupName: default-backup-demo-nightly-20261003023000

  # The installation that made the backup: the default storage paths hold {namespace} and
  # {installation}, so the backup lies under those of "backup-demo", not of this one (cannot be
  # changed later).
  sourceInstallation: backup-demo

  # The namespace of that installation, when another (cannot be changed later)
  # sourceNamespace: team-a

  # Table and database definitions only, no data
  # schemaOnly: true

  # Only the matching tables. One clickhouse-backup pattern per item, such as db.table or db.*
  # tables: ["mydb.*"]

  # Leave out the matching tables, and the tables of these engines. System databases are always left out.
  # skipTables: ["mydb.tmp_*"]
  # skipTableEngines: ["Kafka"]

  # Also users, roles, grants...; only without spec.cluster
  # rbac: true

  # true, with no spec.tables: drops the whole databases of the backup and creates them again
  overwrite: false

  validateTopology: true

  # true (default): the other replicas of a shard copy the data to detached before the first replica
  # restores it. false: they download only the schema, and get the data through replication.
  # replicatedCopyToDetached: true

  # true (default): a rerun by spec.taskID continues the downloads of the earlier runs. false: it
  # deletes them and downloads the backup again.
  # resumeDownload: true

