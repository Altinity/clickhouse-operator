# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# A one-off backup of all backup-enabled clusters of the "backup-demo" ClickHouseInstallation
# (01-chi-with-backup.yaml). It makes one run per cluster, all with one backup name.
# It runs once, as soon as the installation is ready.
# - To run it later, see 03-backup-later.yaml.
# - To make the backup that a schedule makes, see 05-backup-from-schedule.yaml.
# Schedule retention never deletes this backup. Delete it by hand when you do not need it.
# Progress: kubectl describe chb backup-demo-once, and status.clusters for each cluster.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackup"
metadata:
  name: backup-demo-once
spec:
  clickHouseInstallation: backup-demo

  # Only this cluster (cannot be changed later); left out, every backup-enabled cluster of the
  # installation.
  # cluster: main

  # The name of the backup in the storage, the same on every cluster. A restore, or the
  # spec.diffFromRemote of an incremental backup, uses this name.
  # If empty, the operator makes the name from metadata.name and the scheduled Unix time of the backup
  # (its creation, or spec.scheduledTime), here backup-demo-once-<Unix time>.
  # It shows the name in status.backupName.
  # If you create this resource again later, it makes a new backup only without spec.backupName and
  # spec.scheduledTime. If not, the run fails before it changes anything, because a backup with that
  # name is in the storage already.
  # Rules for a name you set:
  # - letters, digits, "_", "-" and "."; it starts with a letter or digit; no ".."; 128 characters max
  # - it must not end like the backups of a schedule, -YYYYMMDDHHMMSS. If it also has the prefix of a
  #   schedule, the retention of that schedule takes it as its own backup and deletes it.
  # backupName: demo-before-upgrade

  # Run the backup at this later time rather than when it is created, for instance before a
  # maintenance window: an RFC 3339 time with its offset, or Z for UTC. Until then the backup stays
  # Pending, its Validated condition False with the reason WaitingForScheduledTime, and the time can
  # still be changed, or the backup deleted. At that time it is validated against the installation
  # as it is then, and runs as any backup does. A time already past starts the backup at once,
  # unless spec.startingDeadlineSeconds has passed too: keep one on a backup kept in git, which may
  # be created again later. See 03-backup-later.yaml.
  # scheduledTime: "2026-10-20T02:00:00+02:00"

  # The maximum delay, in seconds, from the scheduled time (creation, or spec.scheduledTime) to the start.
  # The run of a cluster can wait, for example until the installation completes its reconcile and no
  # other backup or restore runs on the cluster.
  # After the deadline, these fail with the reason StartingDeadlineExceeded, which tells what they
  # waited for:
  # - a backup that is not validated yet (for example, with an invalid spec)
  # - each cluster whose run did not start yet
  # Runs that started continue. If unset, the backup waits with no limit. The operator checks one
  # second after the scheduled time, so set 60 or more. The run time limit is spec.activeDeadlineSeconds:
  # of the backup, or of the schedule with spec.scheduleRef.
  # startingDeadlineSeconds: 3600

  # Make an incremental backup on top of the existing backup with this name (the base). Only the
  # data parts that are not in the base are uploaded. This uses less storage and less time.
  # - The base must be in the storage of each host of the backup. If not, the run fails before it
  #   changes anything.
  # - A restore of this backup needs all bases of its chain in the storage.
  # - Schedule retention never deletes a base that a kept backup needs. Other deletes
  #   (BACKUPS_TO_KEEP_REMOTE, a bucket lifecycle rule, by hand) break all backups on that base.
  # diffFromRemote: demo-base

  # Table and database definitions only, no data
  # schemaOnly: true

  # Which replicas of each shard upload the backup. FirstPerShard, the default, backs up only the
  # first replica of each shard. That is complete for Replicated* tables, as every replica holds
  # their data, and the storage path must then not hold {replica}. AllReplicas makes every replica
  # upload a copy of its own, for tables that are not replicated, whose data differs between the
  # replicas. It takes that much more storage, and the path must hold {replica}, e.g.
  # backup/{namespace}/{installation}/{cluster}/{shard}/{replica}. Either way, a restore loads the
  # data on the first replica of each shard only, and replication brings it to the others: the data
  # the other replicas hold in tables that are not replicated is backed up, but not restored.
  # replicaSelection: FirstPerShard

  # Only the matching tables. One clickhouse-backup pattern per item, such as db.table or db.*
  # tables: ["mydb.*"]

  # Leave out the matching tables, and the tables of these engines. System databases are always left out.
  # skipTables: ["mydb.tmp_*"]
  # skipTableEngines: ["Kafka"]

  # Back up only the data of these partitions, in each table of the backup.
  # - Use the partition_id from system.parts: for example 202610 for PARTITION BY toYYYYMM(date),
  #   or all for a table without PARTITION BY.
  # - The schema of each table is always in the backup. A table without these partitions has only
  #   its schema.
  # - A backup with no data completes with the reason CompletedWithoutData.
  # - A ClickHouseRestore with the same spec.partitions replaces only these partitions in the existing
  #   tables, as the Altinity usual backup workflow does.
  # partitions: ["202610"]

  # The maximum time, in seconds from its start, for the run of each cluster. Default: 24 hours.
  # Then the operator stops the run, and the backup of that cluster fails with the reason
  # DeadlineExceeded. There is no retry. Increase it for a backup that needs more than a day to upload.
  # activeDeadlineSeconds: 7200
