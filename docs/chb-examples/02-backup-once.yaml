# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# One-off backup of every backup-enabled cluster of the "backup-demo" ClickHouseInstallation
# (docs/chb-examples/01-chi-with-backup.yaml), one Job per cluster, all under one backup name. It
# runs once, as soon as the installation can run it; to run it once at a later time, see
# docs/chb-examples/03-backup-later.yaml, and to make the backup a schedule makes, 05. No schedule's
# retention ever deletes it: delete it by hand when no longer needed.
# Progress: kubectl describe chb backup-demo-once; per cluster in status.clusters.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackup"
metadata:
  name: backup-demo-once
spec:
  clickHouseInstallation: backup-demo

  # Only this cluster (cannot be changed later); left out, every backup-enabled cluster of the
  # installation.
  # cluster: main

  # The name of the backup in the storage, the same on every cluster: a restore, or an incremental
  # backup through diffFromRemote, refers to the backup by this name.
  # Left empty, the operator generates it from this resource's name and the Unix time the backup is
  # due (its creation, or scheduledTime), here backup-demo-once-<Unix time>, and shows it in
  # status.backupName. Creating this resource again later makes another backup only with neither
  # backupName nor scheduledTime specified; otherwise that run fails before changing anything, 
  # as a backup of that name is in the storage already.
  # An explicit name holds letters, digits, "_", "-" and "." (starting with a letter or digit, no
  # "..", at most 128 characters) and must not end like the backups of a schedule, -YYYYMMDD-HHMMSS:
  # the retention of a schedule whose prefix it carries would take it for one of its own and delete
  # it.
  # backupName: demo-before-upgrade

  # Run the backup at this later time rather than when it is created, for instance before a
  # maintenance window: an RFC 3339 time with its offset, or Z for UTC. Until then the backup stays
  # Pending, its Validated condition False with the reason WaitingForScheduledTime, and the time can
  # still be changed, or the backup deleted. At that time it is validated against the installation
  # as it is then, and runs as any backup does. A time already past starts the backup at once,
  # unless startingDeadlineSeconds has passed too: keep one on a backup kept in git, which may be
  # created again later. See 03-backup-later.yaml.
  # scheduledTime: "2026-10-20T02:00:00+02:00"

  # How many seconds after it is due (its creation, or scheduledTime) the backup may still start. It
  # starts on a cluster when the operator creates the cluster's Job, which waits, for instance,
  # until the installation has completed its reconcile and no other backup or restore runs on the
  # cluster. Past the deadline, a backup still not validated (an invalid spec, say) fails, as does
  # each cluster whose Job is not created yet, with the reason StartingDeadlineExceeded and what it
  # waited for; clusters already running finish. Unset, the backup waits as long as it takes. The
  # operator checks a second after the backup is due, so keep it a minute or more. How long a Job
  # may run once started is activeDeadlineSeconds: the backup's own, or with scheduleRef the
  # schedule's.
  # startingDeadlineSeconds: 3600

  # Make this an incremental backup on top of the existing backup of this name: only the data parts
  # not in that base yet are uploaded, which takes less storage and less time. The base must be in
  # the storage of every host the backup runs on, or the Job fails before changing anything. A
  # restore of this backup needs its whole chain of bases in the storage. The retention of a
  # schedule never deletes a base that a backup it keeps still needs, but deleting a base any other
  # way (BACKUPS_TO_KEEP_REMOTE, a bucket lifecycle rule, by hand) breaks every backup built on it.
  # The runs of a schedule always make full backups, which can serve as bases.
  # diffFromRemote: demo-base

  # Check that the backup can be read back. Once it has completed on every cluster, a second Job
  # per cluster downloads it from the storage on the first replica of each shard, checks that
  # clickhouse-backup lists the download as complete, and deletes it again, touching no table.
  # The data disk needs room for one copy of the backup meanwhile, and with AllReplicas the copies
  # of the other replicas are not downloaded. The outcome is the Verified condition, Verified or
  # VerificationFailed; a backup that failed on any cluster is not verified. Off by default.
  verify: true

  # Table and database definitions only, no data
  # schemaOnly: true

  # Which replicas of each shard upload the backup. FirstPerShard, the default, backs up only the
  # first replica of each shard. That is complete for Replicated* tables, as every replica holds
  # their data, and the storage path must then not hold {replica}. AllReplicas makes every replica
  # upload a copy of its own, for tables that are not replicated, whose data differs between the
  # replicas. It takes that much more storage, and the path must hold {replica}, e.g.
  # backup/{namespace}/{installation}/{cluster}/{shard}/{replica}. Either way, a restore loads the
  # data on the first replica of each shard only, and replication brings it to the others: the data
  # the other replicas hold in tables that are not replicated is backed up, but not restored.
  # replicaSelection: FirstPerShard

  # Only the matching tables: a clickhouse-backup pattern such as db.table or db.*, comma-separated
  # tables: "mydb.*"

  # Back up the data of these partitions only, in every table the backup takes (all of them, or
  # those the tables pattern matches). A partition is named by its partition_id in system.parts:
  # 202610 for PARTITION BY toYYYYMM(date), say, or all for a table without PARTITION BY. Every
  # table keeps its schema in the backup; one without any of these partitions keeps only that. A
  # backup left without any data succeeds with the reason CompletedWithoutData. Restoring it over
  # the tables it holds (overwrite) drops them whole and brings back only these partitions.
  # partitions: ["202610"]

  # How long each Job may run, in seconds counted from its start, before Kubernetes stops it, as the
  # activeDeadlineSeconds of a Kubernetes Job: 24 hours by default. Each Job gets this long: the
  # backup Job of each cluster, and its verification Job, if any. A Job stopped at the deadline
  # fails the backup, or the verification, of its cluster with the reason DeadlineExceeded, as each
  # Job makes a single attempt. Raise it for a backup too large to upload in a day.
  # activeDeadlineSeconds: 7200
