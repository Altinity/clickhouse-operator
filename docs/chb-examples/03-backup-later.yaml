# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# A one-off backup of the "backup-demo" ClickHouseInstallation (docs/chb-examples/01-chi-with-backup.yaml) due once at
# a later time: before a maintenance window, say. Until then it stays Pending, its Validated condition False with the
# reason WaitingForScheduledTime and the time in UTC; scheduledTime can still be changed, or the backup deleted. At that
# time it is validated against the installation as it is then, runs as any one-off backup does, and is named after
# that time: backup-demo-at-<Unix time>, here backup-demo-at-1792454400.
#
# A backup that cannot start then - the operator is down, the installation reconciles, another backup or restore of
# a cluster runs - starts as soon as it can, unless startingDeadlineSeconds has passed: the backup, or the cluster
# whose Job is not created by then, fails with StartingDeadlineExceeded, telling what it waited for. Keep a deadline
# of a minute or more: the operator checks a second after the backup is due. A backup kept in git and applied after
# its scheduledTime runs at once unless its deadline has passed.
#
# For backups again and again, use a schedule (04); for the backup a schedule makes, at a later time, add scheduleRef
# in place of clickHouseInstallation and the backup options (05).
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackup"
metadata:
  name: backup-demo-at
spec:
  clickHouseInstallation: backup-demo
  scheduledTime: "2026-10-20T02:00:00+02:00"  # RFC 3339 with its offset, or Z for UTC
  startingDeadlineSeconds: 3600               # fail where it has not started an hour after it was due
  # cluster: main                             # optional: only this cluster (cannot be changed later)
  # backupName: before-maintenance            # optional: generated when empty, not ending -YYYYMMDD-HHMMSS
  verify: true                                # download the backup again and check it after the upload
