# EXPERIMENTAL: operator-managed backup, see docs/backup.md
#
# A ClickHouseInstallation with backup enabled, plus the Secret describing the backup storage.
# The operator injects a clickhouse-backup sidecar into every Pod of the cluster and generates
# the Secret "backup-demo-auto-backup-secret" with the sidecar's credentials.
#
# ClickHouse has to keep its data on a real PersistentVolume, as data-volume-template below does.
#
# Replicated tables need ZooKeeper or ClickHouse Keeper; this example references the
# ClickHouseKeeperInstallation from docs/chk-examples/01-simple-1.yaml.
#
# No example sets a namespace. kubectl uses the namespace of -n, or else of the current context
# ("default" if the context sets none). Apply all examples and the ClickHouseKeeperInstallation to
# one namespace: each reference in the examples is to a resource in the same namespace.
# The backup names in the examples, such as default-backup-demo-nightly-20261003023000, start with
# "default", because the default spec.backupNamePrefix of a schedule starts with its namespace.
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-demo-storage
type: Opaque
stringData:
  # The clickhouse-backup configuration of the storage, as YAML sections of its configuration file.
  # The operator makes the configuration file of the sidecars from it, and adds the sidecar
  # credentials and the default paths. The sidecars read a change within minutes, without a restart.
  # Keep all settings here, or in the env of the sidecar container in its pod template. With several
  # backup-enabled clusters, backups and restores must check the storage paths. They refuse to run
  # if the sidecar gets settings from envFrom, or from a configuration file named in its command.
  config.yml: |
    general:
      remote_storage: s3
    s3:
      # MinIO installed with deploy/minio
      endpoint: http://minio-hl.minio:9000
      bucket: clickhouse-backup
      # Left unset, the path is the default of the operator configuration (backup.storagePath, and
      # backup.storageObjectDiskPath for object_disk_path), by default this one: {namespace},
      # {installation}, {cluster} and {shard} are ClickHouse macros expanded on every host, so each
      # shard of each cluster of each installation keeps its part of a backup in its own location.
      # Every backup and restore refuses paths two shards would share.
      # path: backup/{namespace}/{installation}/{cluster}/{shard}
      force_path_style: true
      access_key: minio-access-key
      secret_key: minio-secret-key
      # compression_format: zstd
      # sse: AES256
---
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: backup-demo
spec:
  # Installation-wide backup settings, inherited by every cluster.
  backup:
    enabled: "yes"
    # The sidecar is customized through the clickhouse-backup container of the pod template named:
    # podTemplate: backup-sidecar
    # The clickhouse-backup configuration of the sidecar, kept in the Secret above
    storageConfig:
      valueFrom:
        secretKeyRef:
          name: backup-demo-storage
          key: config.yml
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume-template
  configuration:
    zookeeper:
      keeper:
        name: simple-1
    clusters:
      - name: main
        layout:
          shardsCount: 2
          replicasCount: 2
      # A cluster can override each field of spec.backup in spec.configuration.clusters[].backup,
      # for example to disable backup. A backup, schedule or restore makes one run for each
      # backup-enabled cluster it targets. All runs use one backup name.
      # - name: scratch
      #   backup:
      #     enabled: "no"
      #   layout:
      #     shardsCount: 1
  templates:
    # podTemplates:
    #   - name: backup-sidecar
    #     spec:
    #       containers:
    #         # The operator keeps the values of this container and adds the missing ones. It uses
    #         # only this container, not the volumes or Pod settings of the template.
    #         - name: clickhouse-backup
    #           env:
    #             - name: LOG_LEVEL
    #               value: debug
    #           resources:
    #             requests:
    #               cpu: 100m
    #               memory: 256Mi
    volumeClaimTemplates:
      - name: data-volume-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # Room for the data plus one downloaded copy of a backup, which a restore needs
              storage: 10Gi
