apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: test-011-1-removed-secret-ref
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    users:
      # Deliberately NOT "default": the fallback this scenario guards against assigns
      # ClickHouse.Config.User.Default.Password, which ships as the literal "default".
      # Giving the default user a distinct password keeps sha256("default") an unambiguous
      # signal that a password-less user was silently handed the operator default.
      default/password: default_user_own_password

      # Syntax removed in 0.27.4 - it accepted a namespace/secret/key triple and could read a
      # secret from any namespace. The operator must reject this CHI rather than reconcile it.
      user1/k8s_secret_password: test-011-secret/pwduser1
    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1
