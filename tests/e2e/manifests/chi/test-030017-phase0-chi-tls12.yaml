apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: test-030017-phase0
spec:
  # "%s" → namespace; FQDN is service.<ns>.127.0.0.1.nip.io (resolves to 127.0.0.1 for
  # host-run + kubectl port-forward; avoids *.localhost → ::1 on Linux).
  namespaceDomainPattern: "%s.127.0.0.1.nip.io"
  defaults:
    templates:
      podTemplate: test-030017-phase0
  templates:
    podTemplates:
      - name: test-030017-phase0
        spec:
          containers:
            - name: clickhouse
              image: altinity/clickhouse-server:25.3.8.30001.altinityfips
              env:
                - name: CLICKHOUSE_USER
                  value: clickhouse_operator
                - name: CLICKHOUSE_PASSWORD
                  value: clickhouse_operator_password
  security:
    clickhouse:
      tls:
        rootCASecretRef:
          name: clickhouse-certs
          key: ca.crt
  configuration:
    clusters:
      - name: default
        secure: "yes"
        insecure: "no"
        layout:
          shardsCount: 1
          replicasCount: 1
    settings:
      http_port: _removed_
      tcp_port: _removed_
      interserver_http_port: _removed_
      mysql_port: _removed_
      postgresql_port: _removed_
      https_port: 8443
      tcp_port_secure: 9440
      interserver_https_port: 9010
    files:
      openssl.xml: |
        <yandex>
          <openSSL>
            <server>
              <certificateFile>/etc/clickhouse-server/secrets.d/server.crt/clickhouse-certs/server.crt</certificateFile>
              <privateKeyFile>/etc/clickhouse-server/secrets.d/server.key/clickhouse-certs/server.key</privateKeyFile>
              <dhParamsFile>/etc/clickhouse-server/secrets.d/dhparam.pem/clickhouse-certs/dhparam.pem</dhParamsFile>
              <verificationMode>none</verificationMode>
              <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_3</disableProtocols>
              <cipherSuites>TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384</cipherSuites>
            </server>
            <client>
              <caConfig>/etc/clickhouse-server/secrets.d/ca.crt/clickhouse-certs/ca.crt</caConfig>
              <loadDefaultCAFile>false</loadDefaultCAFile>
              <verificationMode>strict</verificationMode>
              <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
              <cipherSuites>TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384</cipherSuites>
            </client>
          </openSSL>
        </yandex>
      server.crt:
        valueFrom:
          secretKeyRef:
            name: clickhouse-certs
            key: server.crt
      server.key:
        valueFrom:
          secretKeyRef:
            name: clickhouse-certs
            key: server.key
      dhparam.pem:
        valueFrom:
          secretKeyRef:
            name: clickhouse-certs
            key: dhparam.pem
      ca.crt:
        valueFrom:
          secretKeyRef:
            name: clickhouse-certs
            key: ca.crt
