# test_010089
# Backup enabled with a configSecretRef to a Secret that does not exist: the reconcile is aborted.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "test-089-missing-secret"
spec:
  useTemplates:
    - name: clickhouse-version
  backup:
    enabled: "yes"
    configSecretRef:
      name: test-089-no-such-secret
  configuration:
    clusters:
      - name: main
