apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: test-030008-permissive-non-fips
spec:
  configuration:
    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: non-fips
        spec:
          containers:
            - name: clickhouse-pod
              image: altinity/clickhouse-server:25.8.16.10002.altinitystable
  defaults:
    templates:
      podTemplate: non-fips