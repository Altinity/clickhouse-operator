apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: test-011-secrets
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    users:
      default/password: default

      # reference the secret with plain password
      user1/password:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: pwduser1

      # reference to the secret with sha256 password
      user2/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: pwduser2

      # reference to the secret with double sha1 password
      user3/password_double_sha1_hex:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: pwduser3

      # reference the secret with plain password passed via env variable
      user4/password:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: pwduser4

      # reference the secret using k8s standard syntax
      user5/allow_databases/database:
        - foo
      user5/password:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: pwduser5
    settings:
      custom_settings_prefixes: custom_
      profiles/default/custom_1234567890_1234567890_1234567890_1234567890_0:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: custom0
      profiles/default/custom_1234567890_1234567890_1234567890_1234567890_1:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: custom1
      kafka/sasl_username:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: KAFKA_SASL_USERNAME
      kafka/debug: all
      kafka/sasl_password:
        valueFrom:
          secretKeyRef:
            name: test-011-secret
            key: KAFKA_SASL_PASSWORD

    clusters:
    - name: default
      layout:
        shardsCount: 1
        replicasCount: 1
