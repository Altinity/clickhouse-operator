apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "test-036-1-on-lost-volume-no"
spec:
  useTemplates:
    - name: clickhouse-version
    - name: test-036-1-on-lost-volume-no
  configuration:
    zookeeper:
      nodes:
        - host: zookeeper
          port: 2181
    clusters:
    - name: simple
      layout:
        shardsCount: 1
        replicasCount: 2
    profiles:
      clickhouse_operator/log_queries: 1
  defaults:
    storageManagement:
      provisioner: Operator
    templates:
      volumeClaimTemplate: default
  templates:
    volumeClaimTemplates:
      - name: default
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
