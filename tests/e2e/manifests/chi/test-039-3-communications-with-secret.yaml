apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "test-039-secret-communications"
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    users:
      default/password: qkrq
    clusters:
      - name: "default"
        secret:
          valueFrom:
            secretKeyRef:
              name: "secure-inter-cluster-communications"
              key: "secret"
        layout:
          shardsCount: 2
          replicasCount: 1