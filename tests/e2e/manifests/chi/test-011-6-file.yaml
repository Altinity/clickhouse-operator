apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: test-011-6
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    users:
      default/password: default
      # valueFrom.mappingType=file projects user1.xml into users.d. ClickHouse reloads
      # that file when the Secret changes, without recreating the pod.
      user1/password:
        valueFrom:
          secretKeyRef:
            name: test-011-6-secret
            key: user1.xml
          mappingType: file
    clusters:
      - name: default
        layout:
          shardsCount: 1
          replicasCount: 1
