apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: test-011-hot-reload
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    users:
      default/password: default
      alice/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-passwords
            key: alice_password
          hotReload: true
      bob/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-passwords
            key: bob_password
          hotReload: true
      # hotReload omitted: this password stays an environment variable.
      carol/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-passwords
            key: carol_password
    clusters:
      - name: default
        layout:
          shardsCount: 2
          replicasCount: 1
