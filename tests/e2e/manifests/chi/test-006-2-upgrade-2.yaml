apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: test-006-2
spec:
  templates:
    podTemplates:
    - name: default
      spec:
        containers:
        - name: clickhouse-pod
          image: altinity/clickhouse-server:26.3.33.10001.altinitystable
  defaults:
    templates:
      podTemplate: default
  configuration:
    settings:
      # This MergeTree setting is only valid in ClickHouse 26.3+
      merge_tree/vertical_merge_optimize_ttl_delete: "0"
    clusters:
    - name: default
      layout:
        replicasCount: 1
