apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "test-085-volume-add"
spec:
  useTemplates:
    - name: clickhouse-version
  configuration:
    zookeeper:
      nodes:
        - host: zookeeper
          port: 2181
    clusters:
    - name: simple
      layout:
        shardsCount: 1
        replicasCount: 2
    profiles:
      clickhouse_operator/log_queries: 1
  defaults:
    # storageManagement.provisioner is deliberately NOT set here, so this CHI runs on the
    # default PVCProvisionerStatefulSet. test-036 pins provisioner: Operator, and that is the
    # only add-a-volume coverage the suite had - which is why the default-provisioner path
    # stayed broken while test-036 passed.
    templates:
      volumeClaimTemplate: default
  templates:
    volumeClaimTemplates:
      - name: default
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
