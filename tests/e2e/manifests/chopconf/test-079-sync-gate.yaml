apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseOperatorConfiguration"
metadata:
  name: "sync-gate"
spec:
  reconcile:
    host:
      wait:
        replicas:
          catchUp:
            enabled: "true"
            # Matches the shipped default. The scenario holds the gate open across its own setup -
            # table poll, a 30s settle, then three negative probes - which is minutes, so a 120s
            # budget would expire mid-test and abort the reconcile before the test resumes
            # replicated sends, leaving the gate's release half unreachable.
            timeout: 900
            onTimeout: "abort"
            health:
              pollInterval: 5
              successThreshold: 3
