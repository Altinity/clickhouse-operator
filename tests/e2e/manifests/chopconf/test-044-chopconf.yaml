apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseOperatorConfiguration"
metadata:
  name: "test-044-chopconf"
spec:
  reconcile:
    # The slow replica becomes Kubernetes Ready while its Service-ready label is still no.
    # Automatic recovery would then reconcile before the test checks that the schema is absent.
    recovery:
      onStatus:
        aborted:
          onPodReady: none
    host:
      wait:
        exclude: "false"
        replicas:
          new: "no"
    statefulSet:
      create:
        onFailure: abort
      update:
        timeout: 60