# test_010088
# A backup name prefix of its own, which no schedule of the installation the backup came from
# defaults to: held on the cluster to be recovered while it waits to be, on the cluster that recovers
# nothing only while the recovery restore, which restores access objects, is validated and running,
# and released once the installation is recovered. Due once a month, so it does not run during
# the scenario.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackupSchedule"
metadata:
  name: archive
spec:
  clickHouseInstallation: test-088-dr
  # Due once a month, on the 1st at 00:00, so it does not run during the scenario.
  schedules:
    - period: monthly
      time: "00:00"
      day: 1
      keep: 1
  concurrencyPolicy: Forbid
  backupNamePrefix: e2e-088-archive
