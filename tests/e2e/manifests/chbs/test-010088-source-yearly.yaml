# test_010088
# A schedule of the source, due once a month, so it does not run during the scenario. The scenario creates it
# with its backupNamePrefix, which cannot change once set, replaced by the default prefix of schedule nightly
# of test-088-dr, <namespace>-test-088-dr-nightly, and runs it once, now, for the backup the new
# installation is recovered from: the recovery reads that backup from the storage paths of test-088-src, so
# it holds this schedule while it reads, as it holds every schedule of that installation, whatever its
# retention.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackupSchedule"
metadata:
  name: source-yearly
spec:
  clickHouseInstallation: test-088-src
  # Due once a month, on the 1st at 00:00, so it does not run during the scenario.
  schedules:
    - period: monthly
      time: "00:00"
      day: 1
      keep: 1
  concurrencyPolicy: Forbid
  backupNamePrefix: set-by-the-scenario
