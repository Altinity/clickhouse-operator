# test_010089
# Makes the backup of schedule keep-backups once, now: named with the schedule's prefix and its scheduled time as
# YYYYMMDDTHHMMSS, a run-now backup, which retention keeps while it is pinned without until.
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseBackup"
metadata:
  name: keep-backups-run-now
spec:
  scheduleRef:
    name: keep-backups
