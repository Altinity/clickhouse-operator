apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: test-020003-4-chk
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          replicas:
            - name: "0"
              templates:
                podTemplate: good
            - name: "1"
              templates:
                podTemplate: broken
            - name: "2"
              templates:
                podTemplate: broken
  templates:
    podTemplates:
      - name: good
        spec:
          containers:
            - name: clickhouse-keeper
              image: "clickhouse/clickhouse-keeper:25.8"
      - name: broken
        spec:
          containers:
            - name: clickhouse-keeper
              image: "clickhouse/clickhouse-keeper:25.8-broken"
