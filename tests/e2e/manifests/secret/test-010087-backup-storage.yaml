# test_010087, test_010088
# Backup storage for the operator-managed clickhouse-backup sidecar: config.yml holds the clickhouse-backup
# configuration of the storage, which the operator generates the configuration file of the sidecars from. The MinIO
# started by the scenario reads its credentials and bucket from the other keys, which the operator does not read:
# keep both in step.
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage
type: Opaque
stringData:
  S3_BUCKET: clickhouse-backup
  S3_ACCESS_KEY: minio-access-key
  S3_SECRET_KEY: minio-secret-key
  config.yml: |
    general:
      remote_storage: s3
      # What a common recipe for clickhouse-backup sets: a schema restore ON CLUSTER, which would rewrite the
      # Distributed tables of a restored cluster that name another cluster. The operator pins it, with the settings
      # below, as an env var of every sidecar, which takes precedence over the file: the backups fail should any of
      # them come through.
      restore_schema_on_cluster: "{cluster}"
    api:
      # Parallel operations, and a REST API over TLS on another address: the Jobs call the API over plain HTTP on
      # port 7171.
      allow_parallel: true
      secure: true
      listen: "127.0.0.1:7171"
    s3:
      endpoint: http://minio:9000
      bucket: clickhouse-backup
      # Each shard of each cluster of each installation writes to its own storage path, the operator's default.
      # clickhouse-backup expands the macros from system.macros of the host it runs on. A new installation recovered
      # from a backup reads it where it was written by naming the installation that made it, as long as its cluster
      # has the name and the shards of the cluster backed up.
      path: "backup/{namespace}/{installation}/{cluster}/{shard}"
      access_key: minio-access-key
      secret_key: minio-secret-key
      force_path_style: true
