# test_010087, test_010088
# Backup storage for the operator-managed clickhouse-backup sidecar: every key becomes an
# environment variable of the sidecar. The MinIO started by the scenario reads its credentials
# and bucket from here as well, so both sides always agree.
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage
type: Opaque
stringData:
  REMOTE_STORAGE: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: clickhouse-backup
  # Each shard of each cluster of each installation writes to its own storage path, the operator's
  # default. clickhouse-backup expands the macros from system.macros of the host it runs on. A new
  # installation recovered from a backup reads it where it was written by naming the installation
  # that made it, as long as its cluster has the name and the shards of the cluster backed up.
  S3_PATH: "backup/{namespace}/{installation}/{cluster}/{shard}"
  S3_ACCESS_KEY: minio-access-key
  S3_SECRET_KEY: minio-secret-key
  S3_FORCE_PATH_STYLE: "true"
  # What a common recipe for clickhouse-backup sets: a schema restore ON CLUSTER, which would rewrite
  # the Distributed tables of a restored cluster that name another cluster, parallel operations, and
  # a REST API over TLS on another address. The operator pins all of them in every sidecar, as the
  # Jobs call the API over plain HTTP on port 7171: the backups fail should any of them come through.
  RESTORE_SCHEMA_ON_CLUSTER: "{cluster}"
  API_ALLOW_PARALLEL: "true"
  API_SECURE: "true"
  API_LISTEN: "127.0.0.1:7171"
