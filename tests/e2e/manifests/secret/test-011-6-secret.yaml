apiVersion: v1
kind: Secret
metadata:
  name: test-011-6-secret
type: Opaque
stringData:
  # Plain password consumed by valueFrom.mappingType=variable (from_env).
  password: varpass1
  # ClickHouse users XML fragment consumed after mappingType is switched to file.
  user1.xml: |
    <clickhouse>
      <users>
        <user1>
          <password>filepass1</password>
        </user1>
      </users>
    </clickhouse>
