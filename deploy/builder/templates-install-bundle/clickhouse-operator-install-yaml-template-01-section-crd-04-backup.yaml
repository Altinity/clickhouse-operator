# Template Parameters:
#
# OPERATOR_VERSION=${OPERATOR_VERSION}
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackups.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackup
    singular: clickhousebackup
    plural: clickhousebackups
    shortNames:
      - chb
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: schedule
          type: string
          description: "Schedule that this backup runs once"
          jsonPath: .spec.scheduleRef.name
        - name: cluster
          type: string
          description: "Target cluster. Empty means all backup-enabled clusters."
          jsonPath: .spec.cluster
          priority: 1
        - name: scheduled
          type: string
          description: "Time when the backup starts. Empty means at creation."
          jsonPath: .spec.scheduledTime
          priority: 1
        - name: backup
          type: string
          description: Backup name
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Backup phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Backup duration (seconds)
          jsonPath: .status.durationSeconds
        - name: taskID
          type: string
          description: "Current task ID"
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackup makes one backup of a ClickHouseInstallation.
            The operator runs clickhouse-backup through SQL on each backup-enabled cluster (see ClickHouseInstallation spec.backup).
            The API can change in a future release. See docs/backup.md.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.clickHouseInstallation) != has(self.scheduleRef)"
                  message: "exactly one of clickHouseInstallation and scheduleRef is required"
                - rule: "(has(self.clickHouseInstallation) ? self.clickHouseInstallation : '') == (has(oldSelf.clickHouseInstallation) ? oldSelf.clickHouseInstallation : '') && (has(self.scheduleRef) ? self.scheduleRef.name : '') == (has(oldSelf.scheduleRef) ? oldSelf.scheduleRef.name : '') && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation, scheduleRef and cluster are immutable; create a new resource"
                # CEL cannot type schemaOnly (a StringBool). The operator itself refuses schemaOnly with scheduleRef.
                - rule: "!has(self.scheduleRef) || !(has(self.replicaSelection) || has(self.tables) || has(self.partitions) || has(self.activeDeadlineSeconds))"
                  message: "a backup that runs a schedule takes its options from it: replicaSelection, tables, partitions and activeDeadlineSeconds are not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || (has(self.backupName) ? self.backupName : '') == ''"
                  message: "a backup that runs a schedule is named with the schedule's backupNamePrefix: backupName is not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || !has(self.configOverrides)"
                  message: "a backup that runs a schedule takes no configOverrides: they are not set with scheduleRef"
                - rule: "!has(self.backupName) || !self.backupName.matches('-[0-9]{14}$')"
                  message: "backupName must not end like the backups of a schedule, -YYYYMMDDHHMMSS, which the retention of a schedule of that prefix would prune"
              properties:
                configOverrides:
                  type: array
                  nullable: true
                  maxItems: 16
                  x-kubernetes-list-type: set
                  description: |
                    clickhouse-backup settings for this backup that replace the sidecar settings.
                    Each item is KEY=VALUE, where KEY is the env var of the setting, e.g. S3_STORAGE_CLASS=STANDARD_IA. A leading --env= is removed.
                    You cannot override the settings that the operator sets: storage location, API and secrets. Not allowed with scheduleRef.
                  items:
                    type: string
                    pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Set this or scheduleRef, not both. Immutable."
                scheduleRef:
                  type: object
                  description: |
                    ClickHouseBackupSchedule in the same namespace to run once, now or at scheduledTime.
                    The backup copies the installation, clusters, options and backupNamePrefix from the schedule when it is validated.
                    Schedule retention deletes this backup once it is older than the oldest backup the schedule keeps. Set this or clickHouseInstallation, not both. Immutable.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "Name of the ClickHouseBackupSchedule"
                cluster:
                  type: string
                  description: "Cluster to back up. Empty backs up all backup-enabled clusters under one backup name. With scheduleRef, empty means all clusters of the schedule. Immutable."
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName: &TypeBackupName
                  type: string
                  description: |
                    Backup name. Empty generates a name from the resource name and the due time.
                    The name must not end like a schedule backup name (-YYYYMMDDHHMMSS). Not allowed with scheduleRef.
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                scheduledTime:
                  type: string
                  description: |
                    Time when the backup starts, RFC 3339 with offset, e.g. 2026-10-20T02:00:00+02:00.
                    Empty starts the backup at creation. You can change it until the backup is validated.
                  pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: |
                    Maximum delay in seconds after the due time to start the backup.
                    A cluster that does not start by then fails. The backup fails if it is not validated by then. Unset means no limit.
                diffFromRemote:
                  <<: *TypeBackupName
                  description: "Existing backup to use as the base of an incremental backup (clickhouse-backup --diff-from-remote). Keep the base backup in storage while you keep this backup."
                schemaOnly: &TypeStringBool
                  description: "Back up only table and database definitions, no data."
                  # StringBool accepts a YAML bool, 0/1, or a known string (see pkg/apis/common/types/string_bool.go).
                  # A structural schema cannot express this union, so the field uses x-kubernetes-preserve-unknown-fields.
                  x-kubernetes-preserve-unknown-fields: true
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up:
                    - FirstPerShard (default): one replica per shard. This is enough for Replicated* tables.
                    - AllReplicas: every replica. Use it for non-replicated tables.
                    A shard is backed up when one of its replicas completes the backup.
                    With AllReplicas, each replica needs its own storage path and object disk path, e.g. with {replica}.
                    The operator aborts a backup or schedule whose replicas share a path (StoragePathConflict).
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: array
                  description: "clickhouse-backup --tables patterns, one per item, e.g. db.table or db.*. Joined with commas, at most 1024 characters. Empty backs up all tables."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                skipTables:
                  type: array
                  description: "Patterns of tables to skip, one per item, e.g. db.tmp* or logs.* (CLICKHOUSE_SKIP_TABLES). System databases are always skipped. Joined with commas, at most 1024 characters."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                skipTableEngines:
                  type: array
                  description: "Table engines to skip, e.g. Kafka (CLICKHOUSE_SKIP_TABLE_ENGINES)."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    pattern: "^[A-Za-z][A-Za-z0-9_]{0,127}$"
                partitions:
                  type: array
                  description: "Partition IDs to back up (clickhouse-backup --partitions)."
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "Maximum run time in seconds on a cluster. After it, the backup fails. Default 24 hours."
                timeouts:
                  type: object
                  description: |
                    Wait limits for the clickhouse-backup commands of this backup. All fields are optional.
                    An unset field comes from the schedule (scheduleRef), then from backup.timeouts of the operator configuration, then from the built-in default.
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "Maximum wait for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. Maximum 720h."
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long the operator retries a host after its first error before the host fails. An error is: ClickHouse does not answer, or the sidecar returns an error. Go duration. Default 10m. Maximum 168h."
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "Number of polls in a row that can find no status row for a command before the operator treats the command as lost, e.g. after a sidecar restart. Default 5."
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of the inserts into system.backup_actions, a Go duration. It must cover a synchronous delete local or delete remote. Default 4h. Maximum 168h."
                taskID:
                  type: string
                  description: |
                    Set a new value to rerun a finished backup. A new value is one that is not in status.taskID, taskIDsStarted or taskIDsCompleted.
                    - Completed backup: makes a new backup with a new name and keeps the old one (status.previousBackupNames). If backupName is set, change it too.
                    - Failed or aborted backup: runs again with the same name on the clusters where it did not complete.
                    A new value during a run does nothing.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the backup."
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Backup name, the same on all clusters."
                schedule:
                  type: object
                  description: |
                    Settings copied from the schedule (scheduleRef). The operator updates them on each reconcile until the backup is validated.
                    After that they stay fixed, and schedule changes do not affect the backup.
                  properties:
                    name:
                      type: string
                      description: "Name of the ClickHouseBackupSchedule"
                    generation:
                      type: integer
                      format: int64
                      description: "Generation of the schedule when the settings were copied."
                    clickHouseInstallation:
                      type: string
                      description: "ClickHouseInstallation of the schedule."
                    cluster:
                      type: string
                      description: "Target cluster. Empty means all clusters of the schedule."
                    backupNamePrefix:
                      type: string
                      description: "backupNamePrefix of the schedule. It names the backup."
                    schedules:
                      type: array
                      description: "Entries of the schedule. They control incremental backups and the retention after the backup."
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    time:
                      type: string
                    timeZone:
                      type: string
                      description: "timeZone of the schedule."
                    keepBackups:
                      type: array
                      nullable: true
                      description: "retention.keepBackups of the schedule. The retention after the backup keeps these backups in addition to the entries."
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: "Name of the pinned backup."
                          until:
                            type: string
                            format: date-time
                            description: "End of the pin, RFC 3339."
                    previousSchedules:
                      type: array
                      nullable: true
                      description: "status.retention.previous of the schedule. The retention after the backup keeps the backups that these changes hold."
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "Time of the change, RFC 3339 in UTC. It identifies the change."
                          schedules:
                            type: array
                            nullable: true
                            description: "Entries before the change."
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          time:
                            type: string
                          timeZone:
                            type: string
                            description: "Time zone before the change."
                          keepAll:
                            type: boolean
                            description: "If true, hold all backups made before the change until expires, whatever the entries. Set when the oldest changes are merged into one."
                          expires:
                            type: string
                            description: |
                              Time when all backups held by the change expire, RFC 3339. See docs/backup.md for how it is computed.
                    schemaOnly:
                      type: string
                      description: "schemaOnly of the schedule."
                    replicaSelection:
                      type: string
                      description: "replicaSelection of the schedule."
                    tables:
                      type: array
                      nullable: true
                      description: "tables of the schedule."
                      items:
                        type: string
                    skipTables:
                      type: array
                      nullable: true
                      description: "skipTables of the schedule."
                      items:
                        type: string
                    skipTableEngines:
                      type: array
                      nullable: true
                      description: "skipTableEngines of the schedule."
                      items:
                        type: string
                    partitions:
                      type: array
                      nullable: true
                      description: "partitions of the schedule."
                      items:
                        type: string
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      description: "activeDeadlineSeconds of the schedule."
                    timeouts:
                      type: object
                      description: |
                        timeouts of the schedule. The timeouts of the backup override them field by field.
                      properties:
                        actionTimeout:
                          type: string
                          format: duration
                          description: "Maximum wait for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. Maximum 720h."
                        unreachableTimeout:
                          type: string
                          format: duration
                          description: "How long the operator retries a host after its first error before the host fails. An error is: ClickHouse does not answer, or the sidecar returns an error. Go duration. Default 10m. Maximum 168h."
                        errorResponsesMax:
                          type: integer
                          format: int32
                          description: "Number of polls in a row that can find no status row for a command before the operator treats the command as lost, e.g. after a sidecar restart. Default 5."
                        httpReceiveTimeout:
                          type: string
                          format: duration
                          description: "http_receive_timeout and http_send_timeout of the inserts into system.backup_actions, a Go duration. It must cover a synchronous delete local or delete remote. Default 4h. Maximum 168h."
                clusters:
                  type: array
                  description: |
                    Target clusters, resolved at validation, with the backup state on each. Each cluster has its own run.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Phase of the backup on the cluster."
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster that the run works on."
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret with the clickhouse-backup configuration that the run uses. It identifies the storage that holds the backup."
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "One-word reason why the cluster waits, or the result of the backup on it."
                      message:
                        type: string
                        description: "Why the cluster waits, or the result of the backup on it."
                      run:
                        type: object
                        nullable: true
                        description: "Run state on the cluster. The operator resumes the run from it after a restart."
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            properties:
                              backupName:
                                type: string
                              key:
                                type: string
                              namingPrefix:
                                type: string
                              sourceEnv:
                                type: string
                              actionEnv:
                                type: string
                              hadLocal:
                                type: array
                                items:
                                  type: string
                              resumed:
                                type: array
                                items:
                                  type: string
                              replaced:
                                type: array
                                items:
                                  type: string
                              schemaCopies:
                                type: array
                                items:
                                  type: string
                              dataHosts:
                                type: array
                                items:
                                  type: string
                              copyHosts:
                                type: array
                                items:
                                  type: string
                              copyToDetached:
                                type: boolean
                              listed:
                                type: boolean
                              holdsRBAC:
                                type: boolean
                              giveUp:
                                type: boolean
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                rerunTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Time when spec.taskID last reran the backup. The new backup name and the starting deadline count from this time."
                previousBackupNames:
                  type: array
                  nullable: true
                  description: "Backups made before spec.taskID reran the completed backup, newest first, at most 10. They stay in storage until retention or a manual delete removes them."
                  items:
                    type: string
                previousRuns:
                  type: array
                  nullable: true
                  description: |
                    What earlier runs did on the clusters that spec.taskID reran with the same name. The rerun replaces the backup copies that they left.
                  items:
                    type: object
                    required:
                      - cluster
                    properties:
                      cluster:
                        type: string
                        description: "Name of the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the earlier runs, with the backup name on each."
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                            backup:
                              type: string
                            base:
                              type: string
                      actions:
                        type: array
                        nullable: true
                        description: "Commands of the earlier runs that changed data on the hosts."
                        items:
                          type: object
                          properties:
                            step:
                              type: string
                            host:
                              type: string
                            command:
                              type: string
                            timeFrom:
                              type: string
                            status:
                              type: string
                            error:
                              type: string
                backups:
                  type: array
                  nullable: true
                  description: |
                    The backup in the storage of each cluster, as the run listed it when it completed.
                    Not refreshed later: a delete by hand or by retention does not show here. Not listed for schemaOnly.
                  items:
                    type: object
                    required:
                      - cluster
                      - name
                    properties:
                      cluster:
                        type: string
                        description: "Cluster whose storage holds the backup."
                      name:
                        type: string
                        description: "Backup name. With a naming template, the name of the backup of the first shard."
                      created:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Earliest creation time that a shard lists."
                      size:
                        type: integer
                        format: int64
                        description: "Sum of the sizes that the hosts list, in bytes."
                      state:
                        type: string
                        description: "Complete: every shard holds the backup. Incomplete: a shard does not hold it. Broken: a host reports it broken."
                        enum:
                          - Complete
                          - Incomplete
                          - Broken
                      base:
                        type: string
                        description: "Backup that an incremental backup needs. Empty for a full backup."
                backupsListTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "When a run last listed status.backups."
                taskID:
                  type: string
                  description: "The spec.taskID that the resource processes."
                taskIDsStarted:
                  type: array
                  description: "Task IDs that the resource started, newest first, at most 10."
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "Task IDs that the resource finished, newest first, at most 10. This includes IDs that arrived during a run and reran nothing."
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackupschedules.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackupSchedule
    singular: clickhousebackupschedule
    plural: clickhousebackupschedules
    shortNames:
      - chbs
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: "Target cluster. Empty means all backup-enabled clusters."
          jsonPath: .spec.cluster
          priority: 1
        - name: phase
          type: string
          description: "Schedule phase: Active, Suspended or Aborted"
          jsonPath: .status.phase
        - name: suspend
          type: string
          description: "Value of spec.suspend"
          jsonPath: .spec.suspend
        - name: status
          type: string
          description: "Reason of the Ready condition: the schedule runs, why it does not run, or its last run failed or had no data"
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: last-schedule
          type: date
          description: "Scheduled start time of the last backup"
          jsonPath: .status.lastScheduleTime
        - name: last-success
          type: date
          description: "Last time all clusters had a successful run"
          jsonPath: .status.lastSuccessfulTime
        - name: last-backup
          type: string
          description: "Newest backup that a run made on all clusters"
          jsonPath: .status.lastBackupName
        - name: last-failure
          type: date
          description: "Last time a run failed"
          jsonPath: .status.lastFailureTime
        - name: taskID
          type: string
          description: "Current task ID"
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackupSchedule makes recurring backups of a ClickHouseInstallation.
            The operator runs clickhouse-backup through SQL on each backup-enabled cluster (see ClickHouseInstallation spec.backup).
            Runs show in status.active and status.recentRuns. The operator creates no other resources for them.
            After a successful run, retention deletes the backups that no entry keeps.
            The API can change in a future release. See docs/backup.md.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - schedules
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(oldSelf.backupNamePrefix) ? oldSelf.backupNamePrefix : '') == '' || (has(self.backupNamePrefix) ? self.backupNamePrefix : '') == oldSelf.backupNamePrefix"
                  message: "backupNamePrefix can be set once and is immutable after: a changed prefix would leave the former series unpruned; create a new resource"
              properties:
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Immutable."
                cluster:
                  type: string
                  description: "Cluster to back up. Empty backs up all backup-enabled clusters, each with its own runs. Immutable."
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                schedules:
                  type: array
                  minItems: 1
                  description: |
                    Backup entries, at most one per period. One run makes one backup, which counts for every entry due at that time.
                    All entries that set time must set the same time.
                    See docs/backup.md.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                      - keep
                    properties:
                      period:
                        type: string
                        description: "How often the entry is due. A minute entry is due every minute and ignores time."
                        enum:
                          - minute
                          - hour
                          - 6hours
                          - daily
                          - weekly
                          - monthly
                      day:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 31
                        description: |
                          Day of the entry. Required for weekly and monthly, not allowed for other periods.
                          weekly: 0..6, 0 is Sunday. monthly: 1..31. A day after the end of a short month means its last day.
                      keep:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "Number of the newest backups of this entry to keep, at least 1."
                      incremental:
                        # A StringBool, see the comment at suspend below.
                        x-kubernetes-preserve-unknown-fields: true
                        description: |
                          Make incremental backups, based on the newest backup of the series.
                          When the chain reaches keep backups, the next run makes a full backup. Only one entry can set it.
                      configOverrides:
                        type: array
                        nullable: true
                        maxItems: 16
                        x-kubernetes-list-type: set
                        description: |
                          clickhouse-backup settings for the runs of this entry that replace the sidecar settings.
                          Each item is KEY=VALUE, where KEY is the env var of the setting, e.g. S3_STORAGE_CLASS=GLACIER_IR. A leading --env= is removed.
                          If a slot matches more than one entry, the entry with the longest period applies.
                          You cannot override the settings that the operator sets: storage location, API and secrets.
                        items:
                          type: string
                          pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                time:
                  type: string
                  description: |
                    Time of day HH:MM in timeZone. Required for daily, weekly and monthly entries.
                    An hour entry uses only the minute. A 6hours entry uses the hour modulo 6 and the minute.
                  pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
                timeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone of the entries, e.g. Europe/Berlin. Empty means UTC.
                suspend: &TypeStringBool
                  description: "Stop new runs. A run in progress continues."
                  # StringBool accepts a YAML bool, 0/1, or a known string (see pkg/apis/common/types/string_bool.go).
                  # A structural schema cannot express this union, so the field uses x-kubernetes-preserve-unknown-fields.
                  x-kubernetes-preserve-unknown-fields: true
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: "Maximum delay in seconds to start a run after its due time."
                successfulRunsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    Number of successful runs that status.recentRuns keeps, at least 1. Default 3.
                failedRunsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    Number of failed runs that status.recentRuns keeps, at least 1. Default 1.
                schemaOnly:
                  <<: *TypeStringBool
                  description: "Back up only table and database definitions, no data."
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up:
                    - FirstPerShard (default): one replica per shard. This is enough for Replicated* tables.
                    - AllReplicas: every replica. Use it for non-replicated tables.
                    A shard is backed up when one of its replicas completes the backup.
                    With AllReplicas, each replica needs its own storage path and object disk path, e.g. with {replica}.
                    The operator aborts a backup or schedule whose replicas share a path (StoragePathConflict).
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: array
                  description: "clickhouse-backup --tables patterns, one per item, e.g. db.table or db.*. Joined with commas, at most 1024 characters. Empty backs up all tables."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                skipTables:
                  type: array
                  description: "Patterns of tables to skip, one per item, e.g. db.tmp* or logs.* (CLICKHOUSE_SKIP_TABLES). System databases are always skipped. Joined with commas, at most 1024 characters."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                skipTableEngines:
                  type: array
                  description: "Table engines to skip, e.g. Kafka (CLICKHOUSE_SKIP_TABLE_ENGINES)."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    pattern: "^[A-Za-z][A-Za-z0-9_]{0,127}$"
                partitions:
                  type: array
                  description: "Partition IDs to back up (clickhouse-backup --partitions)."
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "Maximum run time in seconds of each run. After it, the run fails. Default 24 hours."
                timeouts:
                  type: object
                  description: |
                    Wait limits for the clickhouse-backup commands of each run. They also apply to a ClickHouseBackup with scheduleRef that sets no timeouts.
                    All fields are optional. An unset field comes from backup.timeouts of the operator configuration, then from the built-in default.
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "Maximum wait for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. Maximum 720h."
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long the operator retries a host after its first error before the host fails. An error is: ClickHouse does not answer, or the sidecar returns an error. Go duration. Default 10m. Maximum 168h."
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "Number of polls in a row that can find no status row for a command before the operator treats the command as lost, e.g. after a sidecar restart. Default 5."
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of the inserts into system.backup_actions, a Go duration. It must cover a synchronous delete local or delete remote. Default 4h. Maximum 168h."
                backupNamePrefix:
                  type: string
                  description: |
                    Prefix of the backup names. Each run adds its due time as -YYYYMMDDHHMMSS.
                    Retention deletes only backups with this prefix and such a time.
                    Default: "<namespace>-<installation>-<schedule>", shortened with a hash if too long. At most 112 characters, so the full name fits in 128.
                    You can set it only once, also after creation. After that it is immutable, because retention does not delete backups of an old prefix.
                    Set it after creation only before the first run, e.g. for a schedule held for a recovery.
                  maxLength: 112
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                retention:
                  type: object
                  description: |
                    Backups that retention keeps in addition to the entries: pinned backups,
                    and backups kept before a change of the entries or the time zone. See docs/backup.md.
                  properties:
                    onScheduleChange:
                      type: string
                      description: |
                        What retention does after a change of the entries or the time zone:
                        - Hold (default): keep the backups that the old entries kept, until they expire under the old entries or until releaseHeld.
                          status.clusters[].heldBackups lists those that the new entries would delete, with their expiry time.
                        - Prune: apply the change immediately.
                      enum:
                        - ""
                        - Hold
                        - Prune
                    keepBackups:
                      type: array
                      nullable: true
                      maxItems: 512
                      description: |
                        Backups that retention keeps in addition to the entries, as in the Altinity usual backup workflow.
                        With until, retention keeps the backup until that time.
                        Without until, retention keeps a backup held for a schedule change until it expires, and any other backup while it is listed.
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            maxLength: 128
                            pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                            description: |
                              Backup name. With a naming template, the name of the backup of any shard, or only the time if the template has no {prefix}.
                          until:
                            type: string
                            format: date-time
                            description: |
                              End of the pin, RFC 3339, e.g. 2026-12-31T00:00:00Z. After it, retention treats the backup as any other backup.
                    releaseHeld:
                      type: string
                      description: |
                        changeID from status.retention.previous to release, together with all earlier changes.
                        The next run deletes their held backups that the entries and keepBackups do not keep. Later changes stay held.
                taskID:
                  type: string
                  description: |
                    Set a new value to reset an aborted schedule. A new value is one that is not in status.taskID, taskIDsStarted or taskIDsCompleted.
                    The operator validates the schedule again and updates its phase. It does not start a run.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the schedule"
                  enum:
                    - Active
                    - Suspended
                    - Aborted
                reason:
                  type: string
                  description: "One-word reason for the phase."
                message:
                  type: string
                  description: "Reason for the phase, as a sentence."
                nextScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Next time a run is due."
                entries:
                  type: array
                  description: "Run state of each entry."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                    properties:
                      period:
                        type: string
                        description: "Period of the entry"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Scheduled start time of the last backup for this period. A backup of a longer period at the same time counts too."
                      lastBackupName:
                        type: string
                        description: "Backup of the last successful run that matches the entry."
                clusters:
                  type: array
                  description: |
                    Clusters that the schedule backs up, with the run state on each.
                    A removed cluster stays in the list while retention still has backups to delete on it.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      configSecret:
                        type: string
                        description: "Secret with the clickhouse-backup configuration of the last runs. For a removed cluster, it identifies the storage of its remaining backups."
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Scheduled start time of the last backup of the cluster."
                      lastSuccessfulTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run on the cluster succeeded."
                      lastBackupName:
                        type: string
                        description: "Backup of the last successful run on the cluster."
                      lastFailureTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run on the cluster failed."
                      lastFailureMessage:
                        type: string
                        description: "Why the last failed run on the cluster failed."
                      retentionHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts that a run backed up. When retention is on, it deletes old backups on these hosts.
                        items:
                          type: string
                      unprunedHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts removed from retentionHosts while retention was on. Retention no longer reaches them, so delete their backups manually.
                          A host that returns to retentionHosts is removed from this list.
                        items:
                          type: string
                      heldBackups:
                        type: array
                        nullable: true
                        description: |
                          Backups held for a schedule change (status.retention.previous) that the current entries would delete, found by the last successful run.
                          To keep a backup longer, add it to spec.retention.keepBackups with until. To release the change now, use spec.retention.releaseHeld.
                        items:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              description: "Backup name. With a naming template, the name of the backup of the first shard."
                            expires:
                              type: string
                              description: "End of the hold, RFC 3339, when the old entries would delete the backup. Empty means never."
                      backupsListTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "When retention last listed the backups of the cluster in status.backups."
                lastScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Scheduled start time of the last backup of any cluster."
                lastSuccessfulTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time all clusters had a successful run: the oldest of their last successful runs. Unset while a cluster has no backup."
                lastBackupName:
                  type: string
                  description: "Newest backup that a run made on all clusters. If a cluster lags, retention on other clusters can have deleted it already. See status.clusters for each cluster."
                lastFailureTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a run failed on any cluster."
                lastFailureMessage:
                  type: string
                  description: "Why the last failed run failed."
                retention:
                  type: object
                  description: "Entries and time zone that the runs use, and the earlier changes whose backups retention holds."
                  properties:
                    appliedSchedules:
                      type: array
                      nullable: true
                      description: "Entries that the runs use."
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    appliedTime:
                      type: string
                    appliedTimeZone:
                      type: string
                      description: "Time zone that the runs use."
                    previous:
                      type: array
                      nullable: true
                      description: "Entries and time zones before each change that is not released, oldest first. Retention holds the backups that they kept until those expire. A change is removed at its expires time."
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "Time of the change, RFC 3339 in UTC. It identifies the change."
                          schedules:
                            type: array
                            nullable: true
                            description: "Entries before the change."
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          time:
                            type: string
                          timeZone:
                            type: string
                            description: "Time zone before the change."
                          keepAll:
                            type: boolean
                            description: "If true, hold all backups made before the change until expires, whatever the entries. Set when the oldest changes are merged into one."
                          expires:
                            type: string
                            description: |
                              Time when all backups held by the change expire, RFC 3339. See docs/backup.md for how it is computed.
                    changeID:
                      type: string
                      description: "changeID of the newest change in previous. Set spec.retention.releaseHeld to it to release all changes."
                active:
                  type: array
                  nullable: true
                  description: "Runs in progress, at most one per cluster. The operator resumes them after a restart."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - slot
                    properties:
                      slot:
                        type: string
                        format: date-time
                        description: "Due time of the run."
                      backupName:
                        type: string
                        description: "Backup of the run. With a naming template, the backup of the first shard."
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Phase of the run on the cluster."
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster that the run works on."
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret with the clickhouse-backup configuration that the run uses. It identifies the storage that holds the backup."
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "One-word reason why the cluster waits, or the result of the run on it."
                      message:
                        type: string
                        description: "Why the cluster waits, or the result of the run on it."
                      run:
                        type: object
                        nullable: true
                        description: "Run state on the cluster. The operator resumes the run from it after a restart."
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            properties:
                              backupName:
                                type: string
                              key:
                                type: string
                              namingPrefix:
                                type: string
                              sourceEnv:
                                type: string
                              actionEnv:
                                type: string
                              hadLocal:
                                type: array
                                items:
                                  type: string
                              resumed:
                                type: array
                                items:
                                  type: string
                              replaced:
                                type: array
                                items:
                                  type: string
                              schemaCopies:
                                type: array
                                items:
                                  type: string
                              dataHosts:
                                type: array
                                items:
                                  type: string
                              copyHosts:
                                type: array
                                items:
                                  type: string
                              copyToDetached:
                                type: boolean
                              listed:
                                type: boolean
                              holdsRBAC:
                                type: boolean
                              giveUp:
                                type: boolean
                recentRuns:
                  type: array
                  nullable: true
                  description: "Finished runs, newest first. successfulRunsHistoryLimit and failedRunsHistoryLimit set how many are kept."
                  items:
                    type: object
                    required:
                      - name
                      - slot
                    properties:
                      slot:
                        type: string
                        format: date-time
                        description: "Due time of the run."
                      backupName:
                        type: string
                        description: "Backup of the run. With a naming template, the backup of the first shard."
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Phase of the run on the cluster."
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster that the run works on."
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret with the clickhouse-backup configuration that the run uses. It identifies the storage that holds the backup."
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "One-word reason why the cluster waits, or the result of the run on it."
                      message:
                        type: string
                        description: "Why the cluster waits, or the result of the run on it."
                      run:
                        type: object
                        nullable: true
                        description: "Run state on the cluster. The operator resumes the run from it after a restart."
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            properties:
                              backupName:
                                type: string
                              key:
                                type: string
                              namingPrefix:
                                type: string
                              sourceEnv:
                                type: string
                              actionEnv:
                                type: string
                              hadLocal:
                                type: array
                                items:
                                  type: string
                              resumed:
                                type: array
                                items:
                                  type: string
                              replaced:
                                type: array
                                items:
                                  type: string
                              schemaCopies:
                                type: array
                                items:
                                  type: string
                              dataHosts:
                                type: array
                                items:
                                  type: string
                              copyHosts:
                                type: array
                                items:
                                  type: string
                              copyToDetached:
                                type: boolean
                              listed:
                                type: boolean
                              holdsRBAC:
                                type: boolean
                              giveUp:
                                type: boolean
                backups:
                  type: array
                  nullable: true
                  description: |
                    Backups of the schedule in the storage of each cluster, newest first, at most 1024.
                    Retention lists them after each successful run on the cluster and leaves out those it deleted.
                    status.clusters[].backupsListTime tells when. Backups deleted later by hand show until the next run.
                  items:
                    type: object
                    required:
                      - cluster
                      - name
                    properties:
                      cluster:
                        type: string
                        description: "Cluster whose storage holds the backup."
                      name:
                        type: string
                        description: "Backup name. With a naming template, the name of the backup of the first shard."
                      created:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Earliest creation time that a shard lists."
                      size:
                        type: integer
                        format: int64
                        description: "Sum of the sizes that the hosts list, in bytes."
                      state:
                        type: string
                        description: "Complete: every shard holds the backup. Incomplete: a shard does not hold it. Broken: a host reports it broken."
                        enum:
                          - Complete
                          - Incomplete
                          - Broken
                      base:
                        type: string
                        description: "Backup that an incremental backup needs. Empty for a full backup."
                taskID:
                  type: string
                  description: "The spec.taskID that the resource processes."
                taskIDsStarted:
                  type: array
                  description: "Task IDs that the resource started, newest first, at most 10."
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "Task IDs that the resource finished, newest first, at most 10. This includes IDs that arrived during a run and reran nothing."
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouserestores.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseRestore
    singular: clickhouserestore
    plural: clickhouserestores
    shortNames:
      - chr
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: "Target cluster. Empty means all backup-enabled clusters."
          jsonPath: .spec.cluster
          priority: 1
        - name: backup
          type: string
          description: "Backup to restore"
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Restore phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Restore duration (seconds)
          jsonPath: .status.durationSeconds
        - name: taskID
          type: string
          description: "Current task ID"
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseRestore restores a backup into a ClickHouseInstallation.
            The operator runs clickhouse-backup through SQL on each backup-enabled cluster (see ClickHouseInstallation spec.backup).
            Restore into a new, empty installation if possible. The API can change in a future release. See docs/backup.md.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - backupName
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(self.sourceInstallation) ? self.sourceInstallation : '') == (has(oldSelf.sourceInstallation) ? oldSelf.sourceInstallation : '') && (has(self.sourceNamespace) ? self.sourceNamespace : '') == (has(oldSelf.sourceNamespace) ? oldSelf.sourceNamespace : '')"
                  message: "sourceInstallation and sourceNamespace are immutable; create a new resource"
              properties:
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. A new, empty installation is recommended. Immutable."
                cluster:
                  type: string
                  description: "Cluster to restore into. Empty restores all backup-enabled clusters, each with its own run. Immutable."
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName:
                  type: string
                  description: "Backup to restore"
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                sourceInstallation:
                  type: string
                  description: |
                    ClickHouseInstallation that made the backup, if it is not the target installation.
                    The restore reads the backup from its storage paths ({installation} macro). Empty means the target installation. Immutable.
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                sourceNamespace:
                  type: string
                  description: |
                    Namespace of the ClickHouseInstallation that made the backup, if it is not the target namespace.
                    The restore reads the backup from its storage paths ({namespace} macro). Empty means the target namespace. Immutable.
                  maxLength: 63
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                schemaOnly: &TypeStringBool
                  description: "Restore only table and database definitions, no data."
                  # StringBool accepts a YAML bool, 0/1, or a known string (see pkg/apis/common/types/string_bool.go).
                  # A structural schema cannot express this union, so the field uses x-kubernetes-preserve-unknown-fields.
                  x-kubernetes-preserve-unknown-fields: true
                overwrite:
                  <<: *TypeStringBool
                  description: |
                    Without tables: recreate the databases of the backup (clickhouse-backup restore --rm) and drop their tables that are not in the backup.
                    With tables, or when false (default): recreate only the tables of the backup and keep all other tables.
                validateTopology:
                  <<: *TypeStringBool
                  description: "If true (default), the operator refuses the restore unless every target shard has the backup. This prevents a partial restore from a different layout."
                tables:
                  type: array
                  description: "clickhouse-backup --tables patterns, one per item, e.g. db.table or db.*. Joined with commas, at most 1024 characters. They limit both schema and data. Empty restores all tables."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                partitions:
                  type: array
                  description: |
                    Partition IDs to restore (clickhouse-backup --partitions). Their data replaces these partitions in the existing tables.
                    The schema is not restored, as in the Altinity usual backup workflow. Not allowed with schemaOnly or rbac.
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                skipTables:
                  type: array
                  description: "Patterns of tables to skip, one per item, e.g. db.tmp* or logs.* (CLICKHOUSE_SKIP_TABLES). System databases are always skipped. Joined with commas, at most 1024 characters."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 1024
                    pattern: "^[A-Za-z0-9_.*?][A-Za-z0-9_.*?-]*$"
                skipTableEngines:
                  type: array
                  description: "Table engines to skip, e.g. Kafka (CLICKHOUSE_SKIP_TABLE_ENGINES)."
                  nullable: true
                  maxItems: 64
                  items:
                    type: string
                    pattern: "^[A-Za-z][A-Za-z0-9_]{0,127}$"
                databaseMapping:
                  type: object
                  description: |
                    Map from a backup database (key) to a target database (value) (clickhouse-backup --restore-database-mapping).
                  additionalProperties:
                    type: string
                    pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,127}$"
                configOverrides:
                  type: array
                  nullable: true
                  maxItems: 16
                  x-kubernetes-list-type: set
                  description: |
                    clickhouse-backup settings for this restore that replace the sidecar settings.
                    Each item is KEY=VALUE, where KEY is the env var of the setting, e.g. DOWNLOAD_CONCURRENCY=8. A leading --env= is removed.
                    You cannot override the settings that the operator sets: storage location, API and secrets.
                  items:
                    type: string
                    pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                rbac:
                  <<: *TypeStringBool
                  description: |
                    Also restore users, roles, grants and other access entities from the backup.
                    Allowed only when cluster is empty, because these belong to the whole installation. Needs ClickHouse 23.3 or later.
                replicatedCopyToDetached:
                  <<: *TypeStringBool
                  description: |
                    If true (default), all replicas download the data. The replicas other than the first copy it to the detached directories
                    of their Replicated*MergeTree tables (--replicated-copy-to-detached). Replication then uses these local parts, not the network.
                    If false, the other replicas download only the schema and fetch the data by replication: less disk and download, more replication traffic.
                    See docs/backup.md.
                resumeDownload:
                  <<: *TypeStringBool
                  description: |
                    If true (default), a rerun by spec.taskID resumes the downloads of earlier runs on each host (--hardlink-exists-files).
                    If false, a rerun deletes the local copies (delete local) and downloads the backup again. The first run is the same either way.
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "Maximum run time in seconds on a cluster. After it, the restore fails. Default 24 hours."
                timeouts:
                  type: object
                  description: |
                    Wait limits for the clickhouse-backup commands of this restore. All fields are optional.
                    An unset field comes from backup.timeouts of the operator configuration, then from the built-in default.
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "Maximum wait for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. Maximum 720h."
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long the operator retries a host after its first error before the host fails. An error is: ClickHouse does not answer, or the sidecar returns an error. Go duration. Default 10m. Maximum 168h."
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "Number of polls in a row that can find no status row for a command before the operator treats the command as lost, e.g. after a sidecar restart. Default 5."
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of the inserts into system.backup_actions, a Go duration. It must cover a synchronous delete local or delete remote. Default 4h. Maximum 168h."
                taskID:
                  type: string
                  description: |
                    Set a new value to rerun a failed or aborted restore. A new value is one that is not in status.taskID, taskIDsStarted or taskIDsCompleted.
                    The restore runs again on the clusters where it did not complete, and resumes their downloads (status.previousRuns).
                    A completed or running restore is not rerun.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the restore."
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Backup that the restore restores, fixed at the first run."
                cluster:
                  type: string
                  description: "spec.cluster at validation. Empty means all backup-enabled clusters. It sets the restore scope and whether access entities are restored."
                clusters:
                  type: array
                  description: |
                    Target clusters, resolved at validation, with the restore state on each. Each cluster has its own run.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Phase of the restore on the cluster."
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster that the run works on."
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret with the clickhouse-backup configuration that the run uses. It identifies the storage that holds the backup."
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "One-word reason why the cluster waits, or the result of the restore on it."
                      message:
                        type: string
                        description: "Why the cluster waits, or the result of the restore on it."
                      run:
                        type: object
                        nullable: true
                        description: "Run state on the cluster. The operator resumes the run from it after a restart."
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            properties:
                              backupName:
                                type: string
                              key:
                                type: string
                              namingPrefix:
                                type: string
                              sourceEnv:
                                type: string
                              actionEnv:
                                type: string
                              hadLocal:
                                type: array
                                items:
                                  type: string
                              resumed:
                                type: array
                                items:
                                  type: string
                              replaced:
                                type: array
                                items:
                                  type: string
                              schemaCopies:
                                type: array
                                items:
                                  type: string
                              dataHosts:
                                type: array
                                items:
                                  type: string
                              copyHosts:
                                type: array
                                items:
                                  type: string
                              copyToDetached:
                                type: boolean
                              listed:
                                type: boolean
                              holdsRBAC:
                                type: boolean
                              giveUp:
                                type: boolean
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                previousRuns:
                  type: array
                  nullable: true
                  description: |
                    What earlier runs did on the clusters that spec.taskID reran. The rerun resumes their downloads.
                    Without this record, a restore from another installation refuses local copies that it did not download.
                  items:
                    type: object
                    required:
                      - cluster
                    properties:
                      cluster:
                        type: string
                        description: "Name of the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the earlier runs, with the backup name on each."
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                            backup:
                              type: string
                            base:
                              type: string
                      actions:
                        type: array
                        nullable: true
                        description: "Commands of the earlier runs that changed data on the hosts."
                        items:
                          type: object
                          properties:
                            step:
                              type: string
                            host:
                              type: string
                            command:
                              type: string
                            timeFrom:
                              type: string
                            status:
                              type: string
                            error:
                              type: string
                taskID:
                  type: string
                  description: "The spec.taskID that the resource processes."
                taskIDsStarted:
                  type: array
                  description: "Task IDs that the resource started, newest first, at most 10."
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "Task IDs that the resource finished, newest first, at most 10. This includes IDs that arrived during a run and reran nothing."
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
