# Template Parameters:
#
# OPERATOR_VERSION=${OPERATOR_VERSION}
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackups.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackup
    singular: clickhousebackup
    plural: clickhousebackups
    shortNames:
      - chb
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: schedule
          type: string
          description: ClickHouseBackupSchedule whose backup this one makes once
          jsonPath: .spec.scheduleRef.name
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: scheduled
          type: string
          description: Time the backup is due at, empty for when it is created
          jsonPath: .spec.scheduledTime
          priority: 1
        - name: backup
          type: string
          description: Backup name
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Backup phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Backup duration (seconds)
          jsonPath: .status.durationSeconds
        - name: taskID
          type: string
          description: Current task id
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackup defines a one-off backup of a ClickHouseInstallation.
            The operator runs the backup on every backup-enabled cluster it targets, driving the
            clickhouse-backup sidecar it injects into the cluster (see ClickHouseInstallation
            spec.backup) through SQL, creating and uploading a backup under one name. The API may change
            in a future release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.clickHouseInstallation) != has(self.scheduleRef)"
                  message: "exactly one of clickHouseInstallation and scheduleRef is required"
                - rule: "(has(self.clickHouseInstallation) ? self.clickHouseInstallation : '') == (has(oldSelf.clickHouseInstallation) ? oldSelf.clickHouseInstallation : '') && (has(self.scheduleRef) ? self.scheduleRef.name : '') == (has(oldSelf.scheduleRef) ? oldSelf.scheduleRef.name : '') && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation, scheduleRef and cluster are immutable; create a new resource"
                # schemaOnly takes any value a StringBool does, which CEL cannot type: the operator refuses it
                - rule: "!has(self.scheduleRef) || !(has(self.replicaSelection) || has(self.tables) || has(self.partitions) || has(self.activeDeadlineSeconds))"
                  message: "a backup that runs a schedule takes its options from it: replicaSelection, tables, partitions and activeDeadlineSeconds are not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || (has(self.backupName) ? self.backupName : '') == ''"
                  message: "a backup that runs a schedule is named with the schedule's backupNamePrefix: backupName is not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || !has(self.configOverrides)"
                  message: "a backup that runs a schedule takes no configOverrides: they are not set with scheduleRef"
                - rule: "!has(self.backupName) || !self.backupName.matches('-[0-9]{14}$')"
                  message: "backupName must not end like the backups of a schedule, -YYYYMMDDHHMMSS, which the retention of a schedule of that prefix would prune"
              properties:
                configOverrides:
                  type: array
                  nullable: true
                  maxItems: 16
                  x-kubernetes-list-type: set
                  description: |
                    clickhouse-backup settings the backup is made with in place of those of the sidecar, KEY=VALUE of the env
                    var of the setting, e.g. S3_STORAGE_CLASS=STANDARD_IA; a leading --env= is stripped. Not the settings the
                    operator sets, those of where the backups are, of the API or of secrets. Not with scheduleRef
                  items:
                    type: string
                    pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Exactly one of it and scheduleRef is set. Immutable"
                scheduleRef:
                  type: object
                  description: |
                    ClickHouseBackupSchedule in the same namespace whose backup this one makes once, now or at scheduledTime: the
                    installation, the backup options, the backupNamePrefix and, unless cluster narrows them to one, the clusters
                    are the schedule's, as they are when the backup is validated. The backup is named with that prefix,
                    never with backupName, and stays out of the schedule's retention.
                    Exactly one of it and clickHouseInstallation is set. Immutable
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "Name of the ClickHouseBackupSchedule"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each in a run of its own, under one backup name; with scheduleRef, every cluster the schedule backs up. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName: &TypeBackupName
                  type: string
                  description: |
                    Optional explicit backup name, which must not end like the backups of a schedule (-YYYYMMDDHHMMSS).
                    Generated from the resource name and the time the backup is due when empty. Not set with scheduleRef,
                    whose backup is named with the schedule's backupNamePrefix
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                scheduledTime:
                  type: string
                  description: |
                    RFC 3339 time, with its offset, the backup is due at, e.g. 2026-10-20T02:00:00+02:00. Empty makes it due
                    when it is created. Can be changed until the backup is validated, at that time or later
                  pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: |
                    How late, counted from the time the backup is due, it may start on a cluster: a cluster whose run is not
                    created by then fails, as does the backup when it is not validated by then. Unset waits as long as it takes
                diffFromRemote:
                  <<: *TypeBackupName
                  description: "Existing backup to take this backup incrementally against (clickhouse-backup --diff-from-remote). The base backup must stay in the backup storage while this backup is kept"
                schemaOnly: &TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                    A shard counts as backed up once any of its replicas made the backup, AllReplicas included.
                    AllReplicas needs a storage path and an object disk path of its own on every replica, as {replica}
                    gives them: the replicas of a shard make a backup of one name at once, and the operator aborts a
                    backup or a schedule whose paths, expanded with the macros of every host, they share
                    (StoragePathConflict).
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "How long the run may run before it is stopped and the operation fails. Defaults to 24 hours"
                timeouts:
                  type: object
                  description: |
                    How the operator waits for the commands of the backup on the clickhouse-backup sidecars. Every field is optional:
                    one left unset is that of the schedule a backup runs (scheduleRef), else that of backup.timeouts of the
                    operator configuration, else the built-in default
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "How long the operator waits for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. At most 720h"
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long a host whose ClickHouse does not answer, or whose sidecar answers the URL engine with an error, is retried from the first error in a row before the host fails, a Go duration. Default 10m. At most 168h"
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "How many polls in a row may find no row of a submitted command before the operator takes it as lost, as after a restart of the sidecar. Default 5"
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of every insert into system.backup_actions, a Go duration: a synchronous delete local or delete remote answers once it is done. Default 4h. At most 168h"
                taskID:
                  type: string
                  description: |
                    Reruns a backup that finished when it changes to a value status.taskID, taskIDsStarted and
                    taskIDsCompleted do not record. A completed backup makes a new backup, named anew at the time of the
                    rerun, and keeps the one it made in the storage (status.previousBackupNames); a completed backup named
                    by backupName needs another backupName with the taskID. A backup that failed or was aborted makes its
                    backup again under its name on the clusters it did not complete on, replacing the copies of it its
                    runs there left. A value set while the backup runs reruns nothing
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Lifecycle phase of the operation"
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Resolved backup name, the same on every cluster"
                schedule:
                  type: object
                  description: |
                    What a backup that runs a schedule takes from it, recorded anew on every reconcile until the backup is
                    validated and kept from then on: the backup is made with these, whatever the schedule becomes
                  properties:
                    name:
                      type: string
                      description: "Name of the ClickHouseBackupSchedule"
                    generation:
                      type: integer
                      format: int64
                      description: "Generation of the schedule the record was taken of"
                    clickHouseInstallation:
                      type: string
                      description: "ClickHouseInstallation the schedule backs up"
                    cluster:
                      type: string
                      description: "Cluster the backup targets, empty for every cluster the schedule backs up"
                    backupNamePrefix:
                      type: string
                      description: "The schedule's backupNamePrefix, which names the backup"
                    schedules:
                      type: array
                      description: "The schedule's entries, which make the backup incremental and the retention after it, as after a scheduled run"
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          time:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    timeZone:
                      type: string
                      description: "The schedule's timeZone"
                    keepBackups:
                      type: array
                      nullable: true
                      description: "The schedule's retention.keepBackups, which the retention after the backup keeps beyond the entries"
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: "The name of the backup pinned"
                          until:
                            type: string
                            format: date-time
                            description: "When the pin ends, RFC 3339"
                    previousSchedules:
                      type: array
                      nullable: true
                      description: "The schedule's status.retention.previous, whose backups the retention after the backup holds"
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "When the change was made, RFC 3339 in UTC, which identifies it"
                          schedules:
                            type: array
                            nullable: true
                            description: "The entries before the change"
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                time:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          timeZone:
                            type: string
                            description: "The time zone before the change"
                          keepAll:
                            type: boolean
                            description: "Holds every backup made before the change, whatever the entries, until expires: the oldest changes merged into one"
                          expires:
                            type: string
                            description: |
                              When every backup the change holds has expired, RFC 3339: a backup made before the change expires
                              at the latest keep periods of the entry that lasts longest after the change; of a merge, the
                              later of those of the changes merged
                    schemaOnly:
                      type: string
                      description: "The schedule's schemaOnly"
                    replicaSelection:
                      type: string
                      description: "The schedule's replicaSelection"
                    tables:
                      type: string
                      description: "The schedule's tables"
                    partitions:
                      type: array
                      nullable: true
                      description: "The schedule's partitions"
                      items:
                        type: string
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      description: "The schedule's activeDeadlineSeconds"
                    timeouts:
                      type: object
                      description: |
                        The schedule's timeouts, which those of the backup override field by field
                      properties:
                        actionTimeout:
                          type: string
                          format: duration
                          description: "How long the operator waits for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. At most 720h"
                        unreachableTimeout:
                          type: string
                          format: duration
                          description: "How long a host whose ClickHouse does not answer, or whose sidecar answers the URL engine with an error, is retried from the first error in a row before the host fails, a Go duration. Default 10m. At most 168h"
                        errorResponsesMax:
                          type: integer
                          format: int32
                          description: "How many polls in a row may find no row of a submitted command before the operator takes it as lost, as after a restart of the sidecar. Default 5"
                        httpReceiveTimeout:
                          type: string
                          format: duration
                          description: "http_receive_timeout and http_send_timeout of every insert into system.backup_actions, a Go duration: a synchronous delete local or delete remote answers once it is done. Default 4h. At most 168h"
                clusters:
                  type: array
                  description: |
                    The clusters the backup targets, resolved once it is validated, each run by a run of its own,
                    and the state of the backup on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the backup on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the run drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the run keeps the backup by, or reads it by, as the run was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the backup went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the backup went on it"
                      run:
                        type: object
                        nullable: true
                        description: "State of the run of the operation on the cluster, which the operator resumes after a restart"
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                rerunTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "When spec.taskID last reran the backup: the backup is due then, which names a new backup and starts its starting deadline"
                previousBackupNames:
                  type: array
                  nullable: true
                  description: "The backups the backup made before spec.taskID reran it once it completed, newest first, 10 at most: they stay in the storage, which retention or a delete by hand removes"
                  items:
                    type: string
                previousRuns:
                  type: array
                  nullable: true
                  description: |
                    What the runs of the backup did on the clusters spec.taskID reran it on, under the same name: the rerun
                    replaces the copies of the backup they left (creates of the backup)
                  items:
                    type: object
                    required:
                      - cluster
                    properties:
                      cluster:
                        type: string
                        description: "Name of the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts the runs worked on, with the name of the backup on each"
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                            backup:
                              type: string
                            base:
                              type: string
                      actions:
                        type: array
                        nullable: true
                        description: "Commands of the runs that changed what the hosts keep"
                        items:
                          type: object
                          properties:
                            step:
                              type: string
                            host:
                              type: string
                            command:
                              type: string
                            timeFrom:
                              type: string
                            status:
                              type: string
                            error:
                              type: string
                taskID:
                  type: string
                  description: "The spec.taskID the resource acts on"
                taskIDsStarted:
                  type: array
                  description: "The task ids the resource started acting on, newest first, 10 at most"
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "The task ids the resource is done with, newest first, 10 at most: the run each started finished, or the id came while a run was in progress and reran nothing"
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackupschedules.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackupSchedule
    singular: clickhousebackupschedule
    plural: clickhousebackupschedules
    shortNames:
      - chbs
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: phase
          type: string
          description: Schedule phase - Active, Suspended or Aborted
          jsonPath: .status.phase
        - name: suspend
          type: string
          description: Whether the schedule is suspended by its spec
          jsonPath: .spec.suspend
        - name: status
          type: string
          description: Reason of the Ready condition - whether the schedule runs, why it does not, or that its last run failed or backed up no data
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: last-schedule
          type: date
          description: Last time a backup run was scheduled
          jsonPath: .status.lastScheduleTime
        - name: last-success
          type: date
          description: Oldest of the last successful scheduled backups of the clusters
          jsonPath: .status.lastSuccessfulTime
        - name: last-backup
          type: string
          description: Newest backup a scheduled run made on every cluster
          jsonPath: .status.lastBackupName
          priority: 1
        - name: last-failure
          type: date
          description: Last time a scheduled backup failed
          jsonPath: .status.lastFailureTime
        - name: taskID
          type: string
          description: Current task id
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackupSchedule defines a recurring backup of a ClickHouseInstallation.
            The operator runs the schedule itself on every backup-enabled cluster it targets, at the slots of the
            finest of its entries, driving clickhouse-backup on the cluster through SQL (see ClickHouseInstallation
            spec.backup); a run lives in status.active and status.recentRuns, no resource is created for it; a run whose time matches coarser entries counts for them too. After a successful run
            the backups of the schedule's series that no entry keeps are deleted. The API may change in a future
            release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - schedules
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(oldSelf.backupNamePrefix) ? oldSelf.backupNamePrefix : '') == '' || (has(self.backupNamePrefix) ? self.backupNamePrefix : '') == oldSelf.backupNamePrefix"
                  message: "backupNamePrefix can be set once and is immutable after: a changed prefix would leave the former series unpruned; create a new resource"
              properties:
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each by a schedule of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                schedules:
                  type: array
                  minItems: 1
                  description: |
                    The periods the schedule backs up at, at most one entry per period. Every entry that sets a time sets the
                    same, which an hour or 6hours entry that sets none takes, so every slot of a coarser entry is a slot of the
                    finest one, whose slots the runs run at. A run matches its time against the entries: one backup
                    is made, for the entry of the longest period it matches, and it counts for each of them. A weekly and a
                    monthly entry need a daily or finer one beside them
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                      - keep
                    properties:
                      period:
                        type: string
                        description: "How often the entry is due; a minute entry is due every minute, whatever its time"
                        enum:
                          - minute
                          - hour
                          - 6hours
                          - daily
                          - weekly
                          - monthly
                      time:
                        type: string
                        description: |
                          HH:MM the entry is due at, in timeZone. Required for daily, weekly and monthly. For hour only its
                          minute is used, for 6hours its hour modulo 6 and its minute; empty takes the time the other entries
                          set, 00:00 when none does
                        pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
                      day:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 31
                        description: |
                          Day the entry is due on: for weekly 0..6, 0 being Sunday; for monthly 1..31, a day past the end
                          of a shorter month meaning its last day. Required for weekly and monthly, not set otherwise
                      keep:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "How many of the newest backups made at the slots of the entry are kept, at least 1"
                      incremental:
                        # A StringBool, polymorphic as suspend below
                        x-kubernetes-preserve-unknown-fields: true
                        description: |
                          Make the runs of the entry incremental backups on the newest backup of the series while the chain
                          of incremental backups is shorter than keep; the run after makes a full backup again. At most one
                          entry
                      configOverrides:
                        type: array
                        nullable: true
                        maxItems: 16
                        x-kubernetes-list-type: set
                        description: |
                          clickhouse-backup settings the runs of the entry make their backups with in place of those of the
                          sidecar, KEY=VALUE of the env var of the setting, e.g. S3_STORAGE_CLASS=GLACIER_IR; a leading --env= is
                          stripped. Those of the heaviest entry of a slot apply. Not the settings the operator sets, those of
                          where the backups are, of the API or of secrets
                        items:
                          type: string
                          pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                timeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone the schedules are read in, e.g. Europe/Berlin, . Empty reads them in UTC
                suspend: &TypeStringBool
                  description: "Pause new runs. A run in progress goes on"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: "Deadline in seconds for starting a run that missed its scheduled time"
                successfulRunsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many successful finished runs status.recentRuns keeps, at least 1. Defaults to 3
                failedRunsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many failed finished runs status.recentRuns keeps, at least 1. Defaults to 1
                schemaOnly:
                  <<: *TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                    A shard counts as backed up once any of its replicas made the backup, AllReplicas included.
                    AllReplicas needs a storage path and an object disk path of its own on every replica, as {replica}
                    gives them: the replicas of a shard make a backup of one name at once, and the operator aborts a
                    backup or a schedule whose paths, expanded with the macros of every host, they share
                    (StoragePathConflict).
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "How long each backup run may run before it is stopped and the run fails. Defaults to 24 hours"
                timeouts:
                  type: object
                  description: |
                    How the operator waits for the commands of every run of the schedule, and of a ClickHouseBackup that runs it
                    (scheduleRef) and sets none of its own, on the clickhouse-backup sidecars. Every field is optional: one left
                    unset is that of backup.timeouts of the operator configuration, else the built-in default
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "How long the operator waits for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. At most 720h"
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long a host whose ClickHouse does not answer, or whose sidecar answers the URL engine with an error, is retried from the first error in a row before the host fails, a Go duration. Default 10m. At most 168h"
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "How many polls in a row may find no row of a submitted command before the operator takes it as lost, as after a restart of the sidecar. Default 5"
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of every insert into system.backup_actions, a Go duration: a synchronous delete local or delete remote answers once it is done. Default 4h. At most 168h"
                backupNamePrefix:
                  type: string
                  description: |
                    Prefix of the backup names; each run appends the time it was due, -YYYYMMDDHHMMSS.
                    Retention only ever prunes backups named with this prefix and such a time. Defaults to
                    "<namespace>-<installation>-<schedule>", shortened with a hash when longer. At most
                    112 characters, so the name with its suffix stays within 128.
                    Can be set once and is immutable after, as a changed prefix would leave the backups of the
                    former series unpruned. Set later, it replaces the default prefix the same way: meant for a
                    schedule that has not run yet, such as one held for a recovery
                  maxLength: 112
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                retention:
                  type: object
                  description: |
                    What retention keeps beyond the entries: backups pinned by name, and the backups the schedule kept
                    before a change of its entries or time zone, held until they expire as that schedule would have deleted
                    them, or until released
                  properties:
                    onScheduleChange:
                      type: string
                      description: |
                        What retention does with the backups the entries kept before a change of the entries or of the
                        time zone: Hold (default) keeps each until it expires as the entries before the change would have
                        deleted it, or until releaseHeld releases the change, and lists in status.clusters[].heldBackups those
                        the schedule as it is would delete, with when each expires; Prune applies the change at once
                      enum:
                        - ""
                        - Hold
                        - Prune
                    keepBackups:
                      type: array
                      nullable: true
                      maxItems: 512
                      description: |
                        Backups retention keeps beyond the entries, as the Altinity usual backup workflow keeps the backups its
                        dialog of a schedule change pins and those made by hand, each until its until, or without one: a backup
                        the schedule kept before a change of it until it expires as that schedule would have deleted it, any
                        other as long as it is listed
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            maxLength: 128
                            pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                            description: |
                              The name of the backup, or with a naming template the name of the backup of any shard, or the
                              time alone when the template holds no {prefix}
                          until:
                            type: string
                            format: date-time
                            description: |
                              When the pin ends, RFC 3339 such as 2026-12-31T00:00:00Z: retention keeps the backup until then,
                              and treats it as any other backup after
                    releaseHeld:
                      type: string
                      description: |
                        The changeID of status.retention.previous whose held backups, and those of every earlier change, are
                        released: the next run deletes those neither the entries nor keepBackups keep. A later change is never
                        released by it
                taskID:
                  type: string
                  description: |
                    Resets a schedule that is aborted when it changes to a value status.taskID, taskIDsStarted and
                    taskIDsCompleted do not record: the schedule is validated again at once and its phase told anew. It
                    runs no slot by itself
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the schedule"
                  enum:
                    - Active
                    - Suspended
                    - Aborted
                reason:
                  type: string
                  description: "Why the schedule is in its phase, in one word"
                message:
                  type: string
                  description: "Why the schedule is in its phase, in a sentence"
                nextScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Next time a run of the runs matches an entry of the schedule"
                entries:
                  type: array
                  description: "State of the runs of each entry of the schedule"
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                    properties:
                      period:
                        type: string
                        description: "Period of the entry"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run matching the entry was scheduled, made for it or for a coarser entry that matched as well"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful run matching the entry made"
                clusters:
                  type: array
                  description: |
                    The clusters the schedule backs up, and a cluster it no longer backs up
                    while retention leaves backups of it unpruned, with the state of the runs on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration the runs of the cluster keep their backups by, as its schedule was last built: for a cluster that lost its schedule, the storage its unpruned backups lie in"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a backup run was scheduled on the cluster"
                      lastSuccessfulTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup run of the cluster completed successfully"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful scheduled run of the cluster made"
                      lastFailureTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup run of the cluster failed"
                      lastFailureMessage:
                        type: string
                        description: "Why the last failed scheduled backup run of the cluster failed"
                      retentionHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts of the cluster the schedule backs up that a scheduled run has backed up: those that hold its
                          backups, which retention, when on, prunes
                        items:
                          type: string
                      unprunedHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts that left retentionHosts while retention was on. No run reaches them any more, so retention
                          no longer prunes the backups they made, which stay until deleted by hand. A host that
                          rejoins retentionHosts is dropped from it.
                        items:
                          type: string
                      heldBackups:
                        type: array
                        nullable: true
                        description: |
                          Backups the last successful scheduled run of the cluster found held for a change of the schedule,
                          status.retention.previous, which the schedule as it is would delete, with when each expires: add
                          those to keep longer to spec.retention.keepBackups with an until, or release the change at once with
                          spec.retention.releaseHeld
                        items:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              description: "The name of the backup, with a naming template that of the backup of the first shard"
                            expires:
                              type: string
                              description: "When the hold ends, RFC 3339, as the schedule before the change would have deleted the backup; empty for never"
                lastScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a backup run was scheduled on any cluster"
                lastSuccessfulTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Oldest of the last successful runs of the clusters the schedule backs up: by then every cluster had a backup. Unset while a cluster has none"
                lastBackupName:
                  type: string
                  description: "Newest backup a scheduled run made on every cluster the schedule backs up. While a cluster lags, the retention of the others may have pruned it already: the per-cluster names tell what each cluster still holds"
                lastFailureTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a scheduled backup run failed on any cluster"
                lastFailureMessage:
                  type: string
                  description: "Why the last failed scheduled backup run failed"
                retention:
                  type: object
                  description: "The entries and time zone the runs apply, and the changes of them whose backups retention holds"
                  properties:
                    appliedSchedules:
                      type: array
                      nullable: true
                      description: "The entries the runs apply"
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          time:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    appliedTimeZone:
                      type: string
                      description: "The time zone the runs apply"
                    previous:
                      type: array
                      nullable: true
                      description: "The entries and time zones before each change not released yet, oldest first: retention keeps every backup they kept when the change was made, until it expires; a change is dropped once all of them have, at its expires"
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "When the change was made, RFC 3339 in UTC, which identifies it"
                          schedules:
                            type: array
                            nullable: true
                            description: "The entries before the change"
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                time:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          timeZone:
                            type: string
                            description: "The time zone before the change"
                          keepAll:
                            type: boolean
                            description: "Holds every backup made before the change, whatever the entries, until expires: the oldest changes merged into one"
                          expires:
                            type: string
                            description: |
                              When every backup the change holds has expired, RFC 3339: a backup made before the change expires
                              at the latest keep periods of the entry that lasts longest after the change; of a merge, the
                              later of those of the changes merged
                    changeID:
                      type: string
                      description: "The changeID of the newest change of previous, which spec.retention.releaseHeld releases with every earlier one"
                active:
                  type: array
                  nullable: true
                  description: "Runs in progress, one per cluster at most, which the operator resumes after a restart"
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - slot
                    properties:
                      slot:
                        type: string
                        format: date-time
                        description: "Time the run was due"
                      backupName:
                        type: string
                        description: "Backup the run makes, with a naming template the backup of the first shard"
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the run on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the run drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the run keeps the backup by, or reads it by, as the run was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the run went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the run went on it"
                      run:
                        type: object
                        nullable: true
                        description: "State of the run of the operation on the cluster, which the operator resumes after a restart"
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                recentRuns:
                  type: array
                  nullable: true
                  description: "Newest finished runs, newest first, as many as successfulRunsHistoryLimit and failedRunsHistoryLimit keep"
                  items:
                    type: object
                    required:
                      - name
                      - slot
                    properties:
                      slot:
                        type: string
                        format: date-time
                        description: "Time the run was due"
                      backupName:
                        type: string
                        description: "Backup the run makes, with a naming template the backup of the first shard"
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the run on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the run drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the run keeps the backup by, or reads it by, as the run was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the run went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the run went on it"
                      run:
                        type: object
                        nullable: true
                        description: "State of the run of the operation on the cluster, which the operator resumes after a restart"
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                taskID:
                  type: string
                  description: "The spec.taskID the resource acts on"
                taskIDsStarted:
                  type: array
                  description: "The task ids the resource started acting on, newest first, 10 at most"
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "The task ids the resource is done with, newest first, 10 at most: the run each started finished, or the id came while a run was in progress and reran nothing"
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouserestores.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: ${OPERATOR_VERSION}
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseRestore
    singular: clickhouserestore
    plural: clickhouserestores
    shortNames:
      - chr
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: backup
          type: string
          description: Backup the restore run restores
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Restore phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Restore duration (seconds)
          jsonPath: .status.durationSeconds
        - name: taskID
          type: string
          description: Current task id
          priority: 1
          jsonPath: .status.taskID
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseRestore defines a one-off restore of a backup into a
            ClickHouseInstallation. The operator runs one run per backup-enabled cluster it targets,
            each driving the clickhouse-backup sidecar it injects into the cluster (see
            ClickHouseInstallation spec.backup). Restoring into a fresh, empty installation is
            recommended. The API may change in a future release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - backupName
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(self.sourceInstallation) ? self.sourceInstallation : '') == (has(oldSelf.sourceInstallation) ? oldSelf.sourceInstallation : '') && (has(self.sourceNamespace) ? self.sourceNamespace : '') == (has(oldSelf.sourceNamespace) ? oldSelf.sourceNamespace : '')"
                  message: "sourceInstallation and sourceNamespace are immutable; create a new resource"
              properties:
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace (a fresh, empty installation is recommended). Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to restore into. Empty restores every backup-enabled cluster, each in a run of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName:
                  type: string
                  description: "Backup to restore"
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                sourceInstallation:
                  type: string
                  description: |
                    ClickHouseInstallation that made the backup, when not the restored one: the restore reads the backup from the
                    storage paths the {installation} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                sourceNamespace:
                  type: string
                  description: |
                    Namespace of the ClickHouseInstallation that made the backup, when not that of the restored one: the restore
                    reads the backup from the storage paths the {namespace} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 63
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                schemaOnly: &TypeStringBool
                  description: "Restore table/database definitions only (no data)"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                overwrite:
                  <<: *TypeStringBool
                  description: "Without tables, recreate the databases of the backup whole (clickhouse-backup restore --rm), dropping their tables the backup does not hold. With tables, or when false (default), only the tables of the backup are recreated - clickhouse-backup drops those that exist anyway - and every other table is left alone"
                validateTopology:
                  <<: *TypeStringBool
                  description: "When true (default) the restore is refused unless every target shard holds the backup, so a backup taken from a different layout is not half-applied"
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated, restricting the schema and the data restored. Empty restores every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids the restore is restricted to (clickhouse-backup --partitions): their data is downloaded and attached into the existing tables, replacing those partitions, and the schema is not restored, as the Altinity usual backup workflow restores partitions. Not with schemaOnly or rbac"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                skipTables:
                  type: string
                  description: "Optional clickhouse-backup table pattern, e.g. db.tmp* or logs.*, comma-separated, of the tables the restore leaves out, on top of the system databases (CLICKHOUSE_SKIP_TABLES)"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                skipTableEngines:
                  type: array
                  description: "Optional table engines, e.g. Kafka, whose tables the restore leaves out (CLICKHOUSE_SKIP_TABLE_ENGINES)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z][A-Za-z0-9_]{0,127}$"
                databaseMapping:
                  type: object
                  description: |
                    Optional mapping of the databases of the backup, the keys, to the databases the restore restores their tables into,
                    the values (clickhouse-backup --restore-database-mapping)
                  additionalProperties:
                    type: string
                    pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,127}$"
                rbac:
                  <<: *TypeStringBool
                  description: |
                    Also restore the users, roles, grants and other access entities the backup holds. They belong to the
                    whole installation, so only a restore with an empty cluster may set it. Needs ClickHouse 23.3 or later
                replicatedCopyToDetached:
                  <<: *TypeStringBool
                  description: |
                    When true (default), every replica of a shard downloads the data: the replicas but the first one copy
                    it into the detached directories of their Replicated*MergeTree tables (clickhouse-backup restore --data
                    --replicated-copy-to-detached), all at once, then the first replica attaches it, and the other replicas
                    take the parts replication tells them of from their own detached directories instead of fetching them
                    over the network. A first replica that does not answer leaves the data to the next replica of its shard.
                    When false, the replicas but the first one download the schema alone (clickhouse-backup download
                    --schema), and fetch the data the first replica attaches by replication: less disk and download, more
                    replication traffic
                resumeDownload:
                  <<: *TypeStringBool
                  description: |
                    When true (default), a rerun of the restore by spec.taskID resumes the downloads its earlier runs left on
                    each host (clickhouse-backup download --hardlink-exists-files), from another installation too, where the
                    preflight checks the local copy an earlier run downloaded instead of downloading the schema over it.
                    When false, a rerun deletes the local copies of the backup its earlier runs downloaded (clickhouse-backup
                    delete local) and downloads the backup again. The first run of the restore is the same either way
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483647
                  description: "How long the restore run may run before it is stopped and the restore fails. Defaults to 24 hours"
                timeouts:
                  type: object
                  description: |
                    How the operator waits for the commands of the restore on the clickhouse-backup sidecars. Every field is
                    optional: one left unset is that of backup.timeouts of the operator configuration, else the built-in default
                  properties:
                    actionTimeout:
                      type: string
                      format: duration
                      description: "How long the operator waits for one command on one host, a Go duration, e.g. 12h or 90m. Default 12h. At most 720h"
                    unreachableTimeout:
                      type: string
                      format: duration
                      description: "How long a host whose ClickHouse does not answer, or whose sidecar answers the URL engine with an error, is retried from the first error in a row before the host fails, a Go duration. Default 10m. At most 168h"
                    errorResponsesMax:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 1000
                      description: "How many polls in a row may find no row of a submitted command before the operator takes it as lost, as after a restart of the sidecar. Default 5"
                    httpReceiveTimeout:
                      type: string
                      format: duration
                      description: "http_receive_timeout and http_send_timeout of every insert into system.backup_actions, a Go duration: a synchronous delete local or delete remote answers once it is done. Default 4h. At most 168h"
                taskID:
                  type: string
                  description: |
                    Reruns a restore that failed or was aborted when it changes to a value status.taskID, taskIDsStarted
                    and taskIDsCompleted do not record: the restore runs again on the clusters it did not complete on,
                    resuming the downloads its runs there made (status.previousRuns). A completed restore, or one that
                    runs, is not rerun
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Lifecycle phase of the restore"
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Backup the restore runs restore, as it was when the first run was created"
                cluster:
                  type: string
                  description: "Cluster spec.cluster named when the restore was validated, empty for every backup-enabled cluster: what the restore holds and whether it restores access entities follow it"
                clusters:
                  type: array
                  description: |
                    The clusters the restore targets, resolved once it is validated, each run by a run of its own,
                    and the state of the restore on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the restore on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the run drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the run keeps the backup by, or reads it by, as the run was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it"
                      run:
                        type: object
                        nullable: true
                        description: "State of the run of the operation on the cluster, which the operator resumes after a restart"
                        properties:
                          operation:
                            type: string
                          step:
                            type: string
                          mutated:
                            type: boolean
                          hosts:
                            type: array
                            nullable: true
                            items:
                              type: object
                              properties:
                                host:
                                  type: string
                                backup:
                                  type: string
                                base:
                                  type: string
                          actions:
                            type: array
                            nullable: true
                            description: "Commands the run inserted into system.backup_actions"
                            items:
                              type: object
                              properties:
                                step:
                                  type: string
                                host:
                                  type: string
                                command:
                                  type: string
                                timeFrom:
                                  type: string
                                status:
                                  type: string
                                error:
                                  type: string
                          plan:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                previousRuns:
                  type: array
                  nullable: true
                  description: |
                    What the runs of the restore did on the clusters spec.taskID reran it on: the rerun resumes the downloads
                    they made, which a restore from another installation would otherwise refuse as local copies it did not
                    download
                  items:
                    type: object
                    required:
                      - cluster
                    properties:
                      cluster:
                        type: string
                        description: "Name of the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts the runs worked on, with the name of the backup on each"
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                            backup:
                              type: string
                            base:
                              type: string
                      actions:
                        type: array
                        nullable: true
                        description: "Commands of the runs that changed what the hosts keep"
                        items:
                          type: object
                          properties:
                            step:
                              type: string
                            host:
                              type: string
                            command:
                              type: string
                            timeFrom:
                              type: string
                            status:
                              type: string
                            error:
                              type: string
                taskID:
                  type: string
                  description: "The spec.taskID the resource acts on"
                taskIDsStarted:
                  type: array
                  description: "The task ids the resource started acting on, newest first, 10 at most"
                  nullable: true
                  items:
                    type: string
                taskIDsCompleted:
                  type: array
                  description: "The task ids the resource is done with, newest first, 10 at most: the run each started finished, or the id came while a run was in progress and reran nothing"
                  nullable: true
                  items:
                    type: string
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
