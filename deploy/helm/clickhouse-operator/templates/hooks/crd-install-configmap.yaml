{{- if .Values.crdHook.enabled }}
{{- /* One CRD per ConfigMap. Grouping several of them into one object pushed it past the
       262144-byte metadata.annotations limit, which breaks client-side `kubectl apply`
       (ArgoCD, `helm template | kubectl apply`) while leaving `helm install` working.
       Keep it one-per-object: a new CRD gets its own ConfigMap plus a projected source in
       crd-install-job.yaml, never an extra key on an existing one. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "altinity-clickhouse-operator.fullname" . }}-crds-1
  namespace: {{ include "altinity-clickhouse-operator.namespace" . }}
  labels:
    {{- include "altinity-clickhouse-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-install-hook
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-7"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.crdHook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  clickhouseinstallations.yaml: |
{{ .Files.Get "crds/CustomResourceDefinition-clickhouseinstallations.clickhouse.altinity.com.yaml" | indent 4 }}
