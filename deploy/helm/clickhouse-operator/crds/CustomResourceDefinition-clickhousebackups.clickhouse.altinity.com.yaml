# Template Parameters:
#
# OPERATOR_VERSION=0.28.0
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackups.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackup
    singular: clickhousebackup
    plural: clickhousebackups
    shortNames:
      - chb
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: backup
          type: string
          description: Remote backup name
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Backup phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Backup duration (seconds)
          jsonPath: .status.durationSeconds
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "ClickHouseBackup defines a one-off backup of a ClickHouseInstallation driven by clickhouse-backup"
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
              properties:
                clickHouseInstallation:
                  type: string
                  description: "Name of the target ClickHouseInstallation in the same namespace"
                backupName:
                  type: string
                  description: "Optional explicit remote backup name; generated when empty"
                schemaOnly:
                  type: boolean
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: "Which replicas to back up"
                  enum:
                    - FirstPerShard
                    - AllReplicas
                image:
                  type: string
                  description: "Optional container image override for the trigger job"
                clickHouseCredentialsSecretName:
                  type: string
                  description: "Optional Secret with CLICKHOUSE_USER/CLICKHOUSE_PASSWORD"
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern to back up only matching tables"
                partitions:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: "Optional partition ids to back up"
                diffFromRemote:
                  type: string
                  description: "Existing remote backup name to make this an incremental backup"
                keepLastRemote:
                  type: integer
                  format: int32
                  description: "Keep only the N most recent remote backups (retention)"
                verify:
                  type: boolean
                  description: "Run a verification job after the backup to confirm it is restorable"
            status:
              type: object
              properties:
                phase:
                  type: string
                backupName:
                  type: string
                jobName:
                  type: string
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
