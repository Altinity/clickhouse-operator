                    users:
                      type: object
                      description: |
                        allows configure <yandex><users>..</users></yandex> section in each `Pod` during generate `ConfigMap` which will mount in `/etc/clickhouse-server/users.d/`
                        you can configure password hashed, authorization restrictions, database level security row filters etc.
                        More details: https://clickhouse.tech/docs/en/operations/settings/settings-users/
                        Your yaml code will convert to XML, see examples https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specconfigurationusers

                        any key could contains `valueFrom` with `secretKeyRef` which allow pass password from kubernetes secrets
                        by default the secret value is passed in `pod.spec.containers.env` and generated with from_env=XXX in /etc/clickhouse-server/users.d/chop-generated-users.xml
                        a password change is then picked up only after the Pod is recreated
                        set `valueFrom.hotReload: true` on user password, password_sha256_hex, or password_double_sha1_hex to publish that user as chop-generated-hot-reload-users.xml in a CHI-owned Secret, mounted into users.d next to chop-generated-users.xml, and reload it without a Pod restart
                        hotReload on any other field is rejected

                        look into https://github.com/Altinity/clickhouse-operator/blob/master/docs/chi-examples/05-settings-01-overview.yaml for examples

                        the `k8s_secret_` and `k8s_secret_env_` key prefixes were REMOVED in 0.27.4
                        they accepted a namespace/secret/key value and could therefore read a secret from any namespace
