---
# Template Parameters:
#
# OPERATOR_VERSION=0.28.0
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackups.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackup
    singular: clickhousebackup
    plural: clickhousebackups
    shortNames:
      - chb
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: schedule
          type: string
          description: ClickHouseBackupSchedule whose backup this one makes once
          jsonPath: .spec.scheduleRef.name
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: scheduled
          type: string
          description: Time the backup is due at, empty for when it is created
          jsonPath: .spec.scheduledTime
          priority: 1
        - name: backup
          type: string
          description: Backup name
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Backup phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Backup duration (seconds)
          jsonPath: .status.durationSeconds
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackup defines a one-off backup of a ClickHouseInstallation.
            The operator runs one Job per backup-enabled cluster it targets, each driving the
            clickhouse-backup sidecar it injects into the cluster (see ClickHouseInstallation
            spec.backup), creating and uploading a backup under one name. The API may change
            in a future release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.clickHouseInstallation) != has(self.scheduleRef)"
                  message: "exactly one of clickHouseInstallation and scheduleRef is required"
                - rule: "(has(self.clickHouseInstallation) ? self.clickHouseInstallation : '') == (has(oldSelf.clickHouseInstallation) ? oldSelf.clickHouseInstallation : '') && (has(self.scheduleRef) ? self.scheduleRef.name : '') == (has(oldSelf.scheduleRef) ? oldSelf.scheduleRef.name : '') && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation, scheduleRef and cluster are immutable; create a new resource"
                # schemaOnly takes any value a StringBool does, which CEL cannot type: the operator refuses it
                - rule: "!has(self.scheduleRef) || !(has(self.replicaSelection) || has(self.tables) || has(self.partitions) || has(self.activeDeadlineSeconds))"
                  message: "a backup that runs a schedule takes its options from it: replicaSelection, tables, partitions and activeDeadlineSeconds are not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || (has(self.backupName) ? self.backupName : '') == ''"
                  message: "a backup that runs a schedule is named with the schedule's backupNamePrefix: backupName is not set with scheduleRef"
                - rule: "!has(self.scheduleRef) || !has(self.configOverrides)"
                  message: "a backup that runs a schedule takes no configOverrides: they are not set with scheduleRef"
                - rule: "!has(self.backupName) || !self.backupName.matches('-[0-9]{14}$')"
                  message: "backupName must not end like the backups of a schedule, -YYYYMMDDHHMMSS, which the retention of a schedule of that prefix would prune"
              properties:
                configOverrides:
                  type: array
                  nullable: true
                  maxItems: 16
                  x-kubernetes-list-type: set
                  description: |
                    clickhouse-backup settings the backup is made with in place of those of the sidecar, KEY=VALUE of the env
                    var of the setting, e.g. S3_STORAGE_CLASS=STANDARD_IA; a leading --env= is stripped. Not the settings the
                    operator sets, those of where the backups are, of the API or of secrets. Not with scheduleRef
                  items:
                    type: string
                    pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the backup whose key `backup-orchestrator.sh` its Jobs run instead of the
                    operator's orchestrator script, the one of the operator configuration. With scheduleRef, unset takes the
                    schedule's
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Exactly one of it and scheduleRef is set. Immutable"
                scheduleRef:
                  type: object
                  description: |
                    ClickHouseBackupSchedule in the same namespace whose backup this one makes once, now or at scheduledTime: the
                    installation, the backup options, the backupNamePrefix and, unless cluster narrows them to one, the clusters
                    are the schedule's, as they are when the backup is validated. The backup is named with that prefix,
                    never with backupName, and stays out of the schedule's retention.
                    Exactly one of it and clickHouseInstallation is set. Immutable
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "Name of the ClickHouseBackupSchedule"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each in a Job of its own, under one backup name; with scheduleRef, every cluster the schedule backs up. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName: &TypeBackupName
                  type: string
                  description: |
                    Optional explicit backup name, which must not end like the backups of a schedule (-YYYYMMDDHHMMSS).
                    Generated from the resource name and the time the backup is due when empty. Not set with scheduleRef,
                    whose backup is named with the schedule's backupNamePrefix
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                scheduledTime:
                  type: string
                  description: |
                    RFC 3339 time, with its offset, the backup is due at, e.g. 2026-10-20T02:00:00+02:00. Empty makes it due
                    when it is created. Can be changed until the backup is validated, at that time or later
                  pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: |
                    How late, counted from the time the backup is due, it may start on a cluster: a cluster whose Job is not
                    created by then fails, as does the backup when it is not validated by then. Unset waits as long as it takes
                diffFromRemote:
                  <<: *TypeBackupName
                  description: "Existing backup to take this backup incrementally against (clickhouse-backup --diff-from-remote). The base backup must stay in the backup storage while this backup is kept"
                verify: &TypeStringBool
                  description: "Run a verification Job after the backup that downloads it and checks it is restorable, without touching cluster data"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                schemaOnly:
                  <<: *TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long the Job may run before it is stopped and the operation fails. Defaults to 24 hours"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Lifecycle phase of the operation"
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Resolved backup name, the same on every cluster"
                schedule:
                  type: object
                  description: |
                    What a backup that runs a schedule takes from it, recorded anew on every reconcile until the backup is
                    validated and kept from then on: the backup is made with these, whatever the schedule becomes
                  properties:
                    orchestratorConfigMapRef:
                      type: object
                      description: |
                        The schedule's orchestratorConfigMapRef, which the backup runs unless it names its own
                      properties:
                        name:
                          description: |
                            Name of the referent. More info:
                            https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                    name:
                      type: string
                      description: "Name of the ClickHouseBackupSchedule"
                    generation:
                      type: integer
                      format: int64
                      description: "Generation of the schedule the record was taken of"
                    clickHouseInstallation:
                      type: string
                      description: "ClickHouseInstallation the schedule backs up"
                    cluster:
                      type: string
                      description: "Cluster the backup targets, empty for every cluster the schedule backs up"
                    backupNamePrefix:
                      type: string
                      description: "The schedule's backupNamePrefix, which names the backup"
                    schedules:
                      type: array
                      description: "The schedule's entries, which make the backup incremental and the retention after it, as after a scheduled run"
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          time:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    timeZone:
                      type: string
                      description: "The schedule's timeZone"
                    keepBackups:
                      type: array
                      nullable: true
                      description: "The schedule's retention.keepBackups, which the retention after the backup never deletes"
                      items:
                        type: string
                    previousSchedules:
                      type: array
                      nullable: true
                      description: "The schedule's status.retention.previous, whose backups the retention after the backup holds"
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "When the change was made, RFC 3339 in UTC, which identifies it"
                          schedules:
                            type: array
                            nullable: true
                            description: "The entries before the change"
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                time:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          timeZone:
                            type: string
                            description: "The time zone before the change"
                          keepAll:
                            type: boolean
                            description: "Holds every backup made before the change, whatever the entries: the oldest changes merged into one"
                    schemaOnly:
                      type: string
                      description: "The schedule's schemaOnly"
                    replicaSelection:
                      type: string
                      description: "The schedule's replicaSelection"
                    tables:
                      type: string
                      description: "The schedule's tables"
                    partitions:
                      type: array
                      nullable: true
                      description: "The schedule's partitions"
                      items:
                        type: string
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      description: "The schedule's activeDeadlineSeconds"
                clusters:
                  type: array
                  description: |
                    The clusters the backup targets, resolved once it is validated, each run by a Job of its own,
                    and the state of the backup on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the backup on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      jobName:
                        type: string
                        description: "Job that drives the backup on the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the Job drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the Job keeps the backup by, or reads it by, as the Job was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the backup went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the backup went on it"
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackupschedules.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackupSchedule
    singular: clickhousebackupschedule
    plural: clickhousebackupschedules
    shortNames:
      - chbs
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: phase
          type: string
          description: Schedule phase - Active, Suspended or Aborted
          jsonPath: .status.phase
        - name: suspend
          type: string
          description: Whether the schedule is suspended by its spec
          jsonPath: .spec.suspend
        - name: status
          type: string
          description: Reason of the Ready condition - whether the schedule runs, why it does not, or that its last run failed or backed up no data
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: last-schedule
          type: date
          description: Last time a backup Job was scheduled
          jsonPath: .status.lastScheduleTime
        - name: last-success
          type: date
          description: Oldest of the last successful scheduled backups of the clusters
          jsonPath: .status.lastSuccessfulTime
        - name: last-backup
          type: string
          description: Newest backup a scheduled run made on every cluster
          jsonPath: .status.lastBackupName
          priority: 1
        - name: last-failure
          type: date
          description: Last time a scheduled backup failed
          jsonPath: .status.lastFailureTime
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackupSchedule defines a recurring backup of a ClickHouseInstallation.
            The operator runs one CronJob per backup-enabled cluster it targets, on the cron schedule of the
            finest of its entries, each driving clickhouse-backup on the cluster (see ClickHouseInstallation
            spec.backup); a run whose time matches coarser entries counts for them too. After a successful run
            the backups of the schedule's series that no entry keeps are deleted. The API may change in a future
            release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - schedules
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(oldSelf.backupNamePrefix) ? oldSelf.backupNamePrefix : '') == '' || (has(self.backupNamePrefix) ? self.backupNamePrefix : '') == oldSelf.backupNamePrefix"
                  message: "backupNamePrefix can be set once and is immutable after: a changed prefix would leave the former series unpruned; create a new resource"
              properties:
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the schedule whose key `backup-orchestrator.sh` the runs of its CronJobs
                    run instead of the operator's orchestrator script, the one of the operator configuration
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each by a CronJob of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                schedules:
                  type: array
                  minItems: 1
                  description: |
                    The periods the schedule backs up at, at most one entry per period. Every entry that sets a time sets the
                    same, which an hour or 6hours entry that sets none takes, so every slot of a coarser entry is a slot of the
                    finest one, whose cron schedule the CronJobs run on. A run matches its time against the entries: one backup
                    is made, for the entry of the longest period it matches, and it counts for each of them. A weekly and a
                    monthly entry need a daily or finer one beside them
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                      - keep
                    properties:
                      period:
                        type: string
                        description: "How often the entry is due; a minute entry is due every minute, whatever its time"
                        enum:
                          - minute
                          - hour
                          - 6hours
                          - daily
                          - weekly
                          - monthly
                      time:
                        type: string
                        description: |
                          HH:MM the entry is due at, in timeZone. Required for daily, weekly and monthly. For hour only its
                          minute is used, for 6hours its hour modulo 6 and its minute; empty takes the time the other entries
                          set, 00:00 when none does
                        pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
                      day:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 31
                        description: |
                          Day the entry is due on: for weekly 0..6, 0 being Sunday; for monthly 1..31, a day past the end
                          of a shorter month meaning its last day. Required for weekly and monthly, not set otherwise
                      keep:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "How many of the newest backups made at the slots of the entry are kept, at least 1"
                      incremental:
                        # A StringBool, polymorphic as suspend below
                        x-kubernetes-preserve-unknown-fields: true
                        description: |
                          Make the runs of the entry incremental backups on the newest backup of the series while the chain
                          of incremental backups is shorter than keep; the run after makes a full backup again. At most one
                          entry
                      configOverrides:
                        type: array
                        nullable: true
                        maxItems: 16
                        x-kubernetes-list-type: set
                        description: |
                          clickhouse-backup settings the runs of the entry make their backups with in place of those of the
                          sidecar, KEY=VALUE of the env var of the setting, e.g. S3_STORAGE_CLASS=GLACIER_IR; a leading --env= is
                          stripped. Those of the heaviest entry of a slot apply. Not the settings the operator sets, those of
                          where the backups are, of the API or of secrets
                        items:
                          type: string
                          pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                timeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone the schedules are read in, e.g. Europe/Berlin, as the CronJob's timeZone. Empty reads them in
                    the time zone of the Kubernetes controller manager, UTC as a rule
                suspend: &TypeStringBool
                  description: "Pause creation of new backup Jobs. Jobs already running are not affected"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                concurrencyPolicy:
                  type: string
                  description: |
                    How to treat a run that is due while the previous one is still running.
                    Forbid (default) starts the new run only once the running one has finished, and not at all past
                    startingDeadlineSeconds; Allow runs both; Replace stops the running one.
                  enum:
                    - Allow
                    - Forbid
                    - Replace
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  description: "Deadline in seconds for starting a run that missed its scheduled time"
                successfulJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many successful finished Jobs to keep, at least 1: the operator learns from the Job of a run
                    the backup it made, whether that backup holds data and the hosts it backed up. Defaults to 3
                failedJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many failed finished Jobs to keep, at least 1: the operator learns from the Job of a run why
                    it failed and the hosts it backed up. Defaults to 1
                schemaOnly:
                  <<: *TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long each backup Job may run before it is stopped and the run fails. Defaults to 24 hours"
                backupNamePrefix:
                  type: string
                  description: |
                    Prefix of the backup names; each run appends the time it was due, -YYYYMMDDHHMMSS.
                    Retention only ever prunes backups named with this prefix and such a time. Defaults to
                    "<namespace>-<installation>-<schedule>", shortened with a hash when longer. At most
                    112 characters, so the name with its suffix stays within 128.
                    Can be set once and is immutable after, as a changed prefix would leave the backups of the
                    former series unpruned. Set later, it replaces the default prefix the same way: meant for a
                    schedule that has not run yet, such as one held for a recovery
                  maxLength: 112
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                retention:
                  type: object
                  description: |
                    What retention keeps beyond the entries: backups pinned by name, and the backups the schedule kept
                    before a change of its entries or time zone, held until released
                  properties:
                    onScheduleChange:
                      type: string
                      description: |
                        What retention does with the backups the entries kept before a change of the entries or of the
                        time zone: Hold (default) keeps them all until releaseHeld releases the change, and lists in
                        status.clusters[].heldBackups those the schedule as it is would delete; Prune applies the change at once
                      enum:
                        - ""
                        - Hold
                        - Prune
                    keepBackups:
                      type: array
                      nullable: true
                      maxItems: 512
                      description: |
                        Backups retention never deletes, as the Altinity Cloud Manager keeps the backups its dialog of a schedule
                        change pins: their names, or with a naming template the name of the backup of any shard, or the time alone
                        when the template holds no {prefix}
                      items:
                        type: string
                        maxLength: 128
                        pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                    releaseHeld:
                      type: string
                      description: |
                        The changeID of status.retention.previous whose held backups, and those of every earlier change, are
                        released: the next run deletes those neither the entries nor keepBackups keep. A later change is never
                        released by it
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the schedule"
                  enum:
                    - Active
                    - Suspended
                    - Aborted
                reason:
                  type: string
                  description: "Why the schedule is in its phase, in one word"
                message:
                  type: string
                  description: "Why the schedule is in its phase, in a sentence"
                nextScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Next time a run of the CronJobs matches an entry of the schedule"
                entries:
                  type: array
                  description: "State of the runs of each entry of the schedule"
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                    properties:
                      period:
                        type: string
                        description: "Period of the entry"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run matching the entry was scheduled, made for it or for a coarser entry that matched as well"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful run matching the entry made"
                clusters:
                  type: array
                  description: |
                    The clusters the schedule backs up, each by a CronJob of its own, and a cluster it no longer backs up
                    while retention leaves backups of it unpruned, with the state of the runs on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      cronJobName:
                        type: string
                        description: "Name of the CronJob that runs the schedule on the cluster"
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration the runs of the cluster keep their backups by, as its CronJob was last built: for a cluster that lost its CronJob, the storage its unpruned backups lie in"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a backup Job was scheduled on the cluster"
                      lastSuccessfulTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster completed successfully"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful scheduled run of the cluster made"
                      lastFailureTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster failed"
                      lastFailureMessage:
                        type: string
                        description: "Why the last failed scheduled backup Job of the cluster failed"
                      retentionHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts of the cluster the schedule backs up that a scheduled run has backed up: those that hold its
                          backups, which retention, when on, prunes
                        items:
                          type: string
                      unprunedHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts that left retentionHosts while retention was on. No run reaches them any more, so retention
                          no longer prunes the backups they made, which stay until deleted by hand. A host that
                          rejoins retentionHosts is dropped from it.
                        items:
                          type: string
                      heldBackups:
                        type: array
                        nullable: true
                        description: |
                          Backups the last successful scheduled run of the cluster found held for a change of the schedule,
                          status.retention.previous, which the schedule as it is would delete: add those to keep to
                          spec.retention.keepBackups, then release the change with spec.retention.releaseHeld
                        items:
                          type: string
                lastScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a backup Job was scheduled on any cluster"
                lastSuccessfulTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Oldest of the last successful runs of the clusters the schedule backs up: by then every cluster had a backup. Unset while a cluster has none"
                lastBackupName:
                  type: string
                  description: "Newest backup a scheduled run made on every cluster the schedule backs up. While a cluster lags, the retention of the others may have pruned it already: the per-cluster names tell what each cluster still holds"
                lastFailureTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a scheduled backup Job failed on any cluster"
                lastFailureMessage:
                  type: string
                  description: "Why the last failed scheduled backup Job failed"
                retention:
                  type: object
                  description: "The entries and time zone the CronJobs apply, and the changes of them whose backups retention holds"
                  properties:
                    appliedSchedules:
                      type: array
                      nullable: true
                      description: "The entries the CronJobs apply"
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          time:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    appliedTimeZone:
                      type: string
                      description: "The time zone the CronJobs apply"
                    previous:
                      type: array
                      nullable: true
                      description: "The entries and time zones before each change not released yet, oldest first: retention keeps every backup they kept when the change was made"
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "When the change was made, RFC 3339 in UTC, which identifies it"
                          schedules:
                            type: array
                            nullable: true
                            description: "The entries before the change"
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                time:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          timeZone:
                            type: string
                            description: "The time zone before the change"
                          keepAll:
                            type: boolean
                            description: "Holds every backup made before the change, whatever the entries: the oldest changes merged into one"
                    changeID:
                      type: string
                      description: "The changeID of the newest change of previous, which spec.retention.releaseHeld releases with every earlier one"
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouserestores.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseRestore
    singular: clickhouserestore
    plural: clickhouserestores
    shortNames:
      - chr
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: backup
          type: string
          description: Backup the restore Job restores
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Restore phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Restore duration (seconds)
          jsonPath: .status.durationSeconds
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseRestore defines a one-off restore of a backup into a
            ClickHouseInstallation. The operator runs one Job per backup-enabled cluster it targets,
            each driving the clickhouse-backup sidecar it injects into the cluster (see
            ClickHouseInstallation spec.backup). Restoring into a fresh, empty installation is
            recommended. The API may change in a future release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - backupName
              x-kubernetes-validations:
                - rule: "self.clickHouseInstallation == oldSelf.clickHouseInstallation && (has(self.cluster) ? self.cluster : '') == (has(oldSelf.cluster) ? oldSelf.cluster : '')"
                  message: "clickHouseInstallation and cluster are immutable; create a new resource"
                - rule: "(has(self.sourceInstallation) ? self.sourceInstallation : '') == (has(oldSelf.sourceInstallation) ? oldSelf.sourceInstallation : '') && (has(self.sourceNamespace) ? self.sourceNamespace : '') == (has(oldSelf.sourceNamespace) ? oldSelf.sourceNamespace : '')"
                  message: "sourceInstallation and sourceNamespace are immutable; create a new resource"
              properties:
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the restore whose key `backup-orchestrator.sh` its Jobs run instead of the
                    operator's orchestrator script, the one of the operator configuration
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace (a fresh, empty installation is recommended). Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to restore into. Empty restores every backup-enabled cluster, each in a Job of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName:
                  type: string
                  description: "Backup to restore"
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                sourceInstallation:
                  type: string
                  description: |
                    ClickHouseInstallation that made the backup, when not the restored one: the restore reads the backup from the
                    storage paths the {installation} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                sourceNamespace:
                  type: string
                  description: |
                    Namespace of the ClickHouseInstallation that made the backup, when not that of the restored one: the restore
                    reads the backup from the storage paths the {namespace} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 63
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                schemaOnly: &TypeStringBool
                  description: "Restore table/database definitions only (no data)"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                overwrite:
                  <<: *TypeStringBool
                  description: "Allow restoring over existing tables, which are dropped first. When false (default) the restore is refused if any target host already holds user tables"
                validateTopology:
                  <<: *TypeStringBool
                  description: "When true (default) the restore is refused unless every target shard holds the backup, so a backup taken from a different layout is not half-applied"
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated, restricting the schema and the data restored. Empty restores every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids the restore is restricted to (clickhouse-backup --partitions): their data is downloaded and attached into the existing tables, replacing those partitions, and the schema is not restored, as the Altinity Cloud Manager restores partitions. Not with schemaOnly or rbac"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                skipTables:
                  type: string
                  description: "Optional clickhouse-backup table pattern, e.g. db.tmp* or logs.*, comma-separated, of the tables the restore leaves out, on top of the system databases (CLICKHOUSE_SKIP_TABLES)"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                skipTableEngines:
                  type: array
                  description: "Optional table engines, e.g. Kafka, whose tables the restore leaves out (CLICKHOUSE_SKIP_TABLE_ENGINES)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z][A-Za-z0-9_]{0,127}$"
                databaseMapping:
                  type: object
                  description: |
                    Optional mapping of the databases of the backup, the keys, to the databases the restore restores their tables into,
                    the values (clickhouse-backup --restore-database-mapping). The overwrite guard checks the databases restored into
                  additionalProperties:
                    type: string
                    pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,127}$"
                rbac:
                  <<: *TypeStringBool
                  description: |
                    Also restore the users, roles, grants and other access entities the backup holds. They belong to the
                    whole installation, so only a restore with an empty cluster may set it. Needs ClickHouse 23.3 or later
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long the restore Job may run before it is stopped and the restore fails. Defaults to 24 hours"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Lifecycle phase of the restore"
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Backup the restore Jobs restore, as it was when the first Job was created"
                cluster:
                  type: string
                  description: "Cluster spec.cluster named when the restore was validated, empty for every backup-enabled cluster: what the restore holds and whether it restores access entities follow it"
                clusters:
                  type: array
                  description: |
                    The clusters the restore targets, resolved once it is validated, each run by a Job of its own,
                    and the state of the restore on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the restore on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      jobName:
                        type: string
                        description: "Job that drives the restore on the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the Job drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the Job keeps the backup by, or reads it by, as the Job was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it"
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
# Template Parameters:
#
# COMMENT=
# NAMESPACE=${OPERATOR_NAMESPACE}
# NAME=clickhouse-operator
#
# Setup ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-operator
  namespace: ${OPERATOR_NAMESPACE}
  labels:
    clickhouse.altinity.com/chop: 0.28.0
---
# Template Parameters:
#
# NAMESPACE=${OPERATOR_NAMESPACE}
# COMMENT=#
# ROLE_KIND=ClusterRole
# ROLE_NAME=clickhouse-operator-${OPERATOR_NAMESPACE}
# ROLE_BINDING_KIND=ClusterRoleBinding
# ROLE_BINDING_NAME=clickhouse-operator-${OPERATOR_NAMESPACE}
#


# Specifies either
#   ClusterRole
# or
#   Role
# to be bound to ServiceAccount.
# ClusterRole is namespace-less and must have unique name
# Role is namespace-bound
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clickhouse-operator-${OPERATOR_NAMESPACE}
  #namespace: ${OPERATOR_NAMESPACE}
  labels:
    clickhouse.altinity.com/chop: 0.28.0
rules:

  #
  # Core API group
  #

  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - persistentvolumeclaims
      - secrets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
      - delete
  # The backup orchestrator Jobs run as the operator's ServiceAccount. In a namespace other than the
  # operator's own the operator creates a ServiceAccount of that name, and a Role and RoleBinding that
  # let the orchestrator read the backup resources and pods and post events
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # The backup controllers are leader-elected by a Lease in the namespace of the operator
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list

  #
  # apps.* resources
  #

  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - patch
      - update
      - delete
  # The operator deployment personally, identified by name
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - clickhouse-operator
    verbs:
      - get
      - patch
      - update
      - delete

  #
  # policy.* resources
  #

  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete

  #
  # discovery.* resources
  #

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  #
  # batch.* resources - backup/restore Jobs and CronJobs
  # They are owned by their backup resource and garbage-collected with it. The operator never deletes
  # a Job; a schedule deletes the CronJob of a cluster it no longer backs up.
  #

  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - patch
      - watch
      - create
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete

  #
  # apiextensions
  #

  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list

  #
  # The operator's specific Custom Resources
  #

  # clickhouse - related resources
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallations
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - delete
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallationtemplates
      - clickhouseoperatorconfigurations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallations/finalizers
      - clickhouseinstallationtemplates/finalizers
      - clickhouseoperatorconfigurations/finalizers
    verbs:
      - update
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallations/status
      - clickhouseinstallationtemplates/status
      - clickhouseoperatorconfigurations/status
    verbs:
      - get
      - update
      - patch
      - create
      - delete

  # clickhouse-keeper - related resources
  - apiGroups:
      - clickhouse-keeper.altinity.com
    resources:
      - clickhousekeeperinstallations
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - delete
  - apiGroups:
      - clickhouse-keeper.altinity.com
    resources:
      - clickhousekeeperinstallations/finalizers
    verbs:
      - update
  - apiGroups:
      - clickhouse-keeper.altinity.com
    resources:
      - clickhousekeeperinstallations/status
    verbs:
      - get
      - update
      - patch
      - create
      - delete

  # clickhouse backup - related resources
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhousebackups
      - clickhousebackupschedules
    verbs:
      - get
      - list
      - watch
  # The operator creates a restore itself to recover an installation from a backup
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouserestores
    verbs:
      - get
      - list
      - watch
      - create
  # Jobs and CronJobs carry a blocking owner reference to their backup resource, which requires
  # update on the owner's finalizers where OwnerReferencesPermissionEnforcement is enabled (OpenShift)
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhousebackups/finalizers
      - clickhousebackupschedules/finalizers
      - clickhouserestores/finalizers
    verbs:
      - update
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhousebackups/status
      - clickhousebackupschedules/status
      - clickhouserestores/status
    verbs:
      - update
---
# Specifies either
#   ClusterRoleBinding between ClusterRole and ServiceAccount.
# or
#   RoleBinding between Role and ServiceAccount.
# ClusterRoleBinding is namespace-less and must have unique name
# RoleBinding is namespace-bound
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clickhouse-operator-${OPERATOR_NAMESPACE}
  #namespace: ${OPERATOR_NAMESPACE}
  labels:
    clickhouse.altinity.com/chop: 0.28.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clickhouse-operator-${OPERATOR_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: clickhouse-operator
    namespace: ${OPERATOR_NAMESPACE}
---
# Template Parameters:
#
# NAME=etc-clickhouse-operator-files
# NAMESPACE=${OPERATOR_NAMESPACE}
# COMMENT=
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: etc-clickhouse-operator-files
  namespace: ${OPERATOR_NAMESPACE}
  labels:
    clickhouse.altinity.com/chop: 0.28.0
    app: clickhouse-operator
data:
  config.yaml: |
    # IMPORTANT
    # This file is auto-generated
    # Do not edit this file - all changes would be lost
    # Edit appropriate template in the following folder:
    # deploy/builder/templates-config
    # IMPORTANT
    #
    # Template parameters available:
    #   WATCH_NAMESPACES=
    #   CH_USERNAME_PLAIN=
    #   CH_PASSWORD_PLAIN=
    #   CH_CREDENTIALS_SECRET_NAMESPACE=
    #   CH_CREDENTIALS_SECRET_NAME=clickhouse-operator
    #   VERBOSITY=1
    
    ################################################
    ##
    ## Watch section
    ##
    ################################################
    watch:
      # Namespaces where clickhouse-operator watches for events.
      # Concurrently running operators should watch on different namespaces.
      # `include` and `exclude` accept literal namespace names or regexp patterns.
      # Empty `include` watches the operator's own namespace (or all namespaces when
      # the operator runs in `kube-system`); use [".*"] to force watch-all elsewhere.
      # Empty `exclude` matches none. `exclude` is applied after `include`.
      namespaces:
        include: []
        exclude: []
    
      # Behavior when ClickHouseOperatorConfiguration changes: none | restart
      configuration:
        onChange: restart
    
    clickhouse:
      configuration:
        ################################################
        ##
        ## Configuration files section
        ##
        ################################################
        file:
          # Each 'path' can be either absolute or relative.
          # In case path is absolute - it is used as is
          # In case path is relative - it is relative to the folder where configuration file you are reading right now is located.
          path:
            # Path to the folder where ClickHouse configuration files common for all instances within a CHI are located.
            common: chi/config.d
            # Path to the folder where ClickHouse configuration files unique for each instance (host) within a CHI are located.
            host: chi/conf.d
            # Path to the folder where ClickHouse configuration files with users' settings are located.
            # Files are common for all instances within a CHI.
            user: chi/users.d
        ################################################
        ##
        ## Configuration users section
        ##
        ################################################
        user:
          # Default settings for user accounts, created by the operator.
          # IMPORTANT. These are not access credentials or settings for 'default' user account,
          # it is a template for filling out missing fields for all user accounts to be created by the operator,
          # with the following EXCEPTIONS:
          # 1. 'default' user account DOES NOT use provided password, but uses all the rest of the fields.
          #    Password for 'default' user account has to be provided explicitly, if to be used.
          # 2. CHOP user account DOES NOT use:
          #    - profile setting. It uses predefined profile called 'clickhouse_operator'
          #    - quota setting. It uses empty quota name.
          #    - networks IP setting. Operator specifies 'networks/ip' user setting to match operators' pod IP only.
          #    - password setting. Password for CHOP account is used from 'clickhouse.access.*' section
          default:
            # Default values for ClickHouse user account(s) created by the operator
            #   1. user/profile - string
            #   2. user/quota - string
            #   3. user/networks/ip - multiple strings
            #   4. user/password - string
            # These values can be overwritten on per-user basis.
            profile: "default"
            quota: "default"
            networksIP:
              - "::1"
              - "127.0.0.1"
            password: "default"
        ################################################
        ##
        ## Configuration network section
        ##
        ################################################
        network:
          # Default host_regexp to limit network connectivity from outside
          hostRegexpTemplate: "(chi-{chi}-[^.]+\\d+-\\d+|clickhouse\\-{chi})\\.{namespace}\\.svc\\.cluster\\.local$"
    
      ################################################
      ##
      ## Configuration restart policy section
      ## Configuration restart policy describes what configuration changes require ClickHouse restart
      ##
      ################################################
      configurationRestartPolicy:
        rules:
          # IMPORTANT!
          # Special version of "*" - default version - has to satisfy all ClickHouse versions.
          # Default version will also be used in case ClickHouse version is unknown.
          # ClickHouse version may be unknown due to host being down - for example, because of incorrect "settings" section.
          # ClickHouse is not willing to start in case incorrect/unknown settings are provided in config file.
          - version: "*"
            rules:
              # see https://kb.altinity.com/altinity-kb-setup-and-maintenance/altinity-kb-server-config-files/#server-config-configxml-sections-which-dont-require-restart
              # changeable_without_restart = Yes reloads that server setting even when a wildcard rule below says restart.
              # An exact rule such as settings/<name>: "yes" still restarts. Other server settings follow the rules below.
    
              - settings/*: "yes"
    
              # single values
              - settings/access_control_path: "no"
              - settings/dictionaries_config: "no"
              - settings/max_server_memory_*: "no"
              - settings/max_*_to_drop: "no"
              - settings/max_concurrent_queries: "no"
              - settings/models_config: "no"
              - settings/user_defined_executable_functions_config: "no"
    
              # structured XML
              - settings/logger/*: "no"
              - settings/macros/*: "no"
              - settings/remote_servers/*: "no"
              - settings/user_directories/*: "no"
    
              # these settings should not lead to pod restarts
              - settings/display_secrets_in_show_and_select: "no"
    
              - zookeeper/*: "no"
    
              - files/*.xml: "yes"
              - files/config.d/*.xml: "yes"
              - files/config.d/*dict*.xml: "no"
              - files/config.d/*no_restart*: "no"
    
              # exceptions in default profile
              - profiles/default/background_*_pool_size: "yes"
              - profiles/default/max_*_for_server: "yes"
          - version: "21.*"
            rules:
              - settings/logger: "yes"
    
      #################################################
      ##
      ## Access to ClickHouse instances
      ##
      ################################################
      access:
        # Possible values for 'scheme' are:
        #   1. http - force http to be used to connect to ClickHouse instances
        #   2. https - force https to be used to connect to ClickHouse instances
        #   3. Auto - either http or https is selected based on open ports
        scheme: "Auto"
        # ClickHouse credentials (username, password and port) to be used by the operator to connect to ClickHouse instances.
        # These credentials are used for:
        #   1. Metrics requests
        #   2. Schema maintenance
        # User with these credentials can be specified in additional ClickHouse .xml config files,
        # located in 'clickhouse.configuration.file.path.user' folder
        username: ""
        password: ""
        # Inline PEM CA bundle the operator uses to verify ClickHouse server TLS.
        rootCA: ""
        # Alternate source for rootCA — a Secret in the operator's namespace.
        # Mutually exclusive with the inline rootCA above (inline wins). Empty
        # `name` = not used (no-op). When `key` is empty, the operator tries
        # "ca.crt" then "tls.crt". Resolved once at config load (an operator
        # restart picks up a rotated Secret).
        rootCASecretRef:
          name: ""
          key: ""
    
        # Location of the k8s Secret with username and password to be used by the operator to connect to ClickHouse instances.
        # Can be used instead of explicitly specified username and password available in sections:
        #   - clickhouse.access.username
        #   - clickhouse.access.password
        # Secret should have two keys:
        #   1. username
        #   2. password
        secret:
          # Empty `namespace` means that k8s secret would be looked in the same namespace where operator's pod is running.
          namespace: ""
          # Empty `name` means no k8s Secret would be looked for
          name: "clickhouse-operator"
        # Port where to connect to ClickHouse instances to
        port: 8123
    
        # Timeouts used to limit connection and queries from the operator to ClickHouse instances
        # Specified in seconds.
        timeouts:
          # Timout to setup connection from the operator to ClickHouse instances. In seconds.
          connect: 5
          # Timout to perform SQL query from the operator to ClickHouse instances. In seconds.
          query: 4
    
      ################################################
      ##
      ## Addons specifies additional configuration sections
      ## Should it be called something like "templates"?
      ##
      ################################################
      addons:
        rules:
          - version: "*"
            spec:
              configuration:
                users:
                profiles:
                quotas:
                settings:
                files:
          - version: ">= 23.3"
            spec:
              configuration:
                ###
                ### users.d is global while description depends on CH version which may vary on per-host basis
                ### In case of global-ness this may be better to implement via auto-templates
                ###
                ### As a solution, this may be applied on the whole cluster based on any of its hosts
                ###
                ### What to do when host is just created? CH version is not known prior to CH started and user config is required before CH started.
                ### We do not have any info about the cluster on initial creation
                ###
                users:
                  "{clickhouseOperatorUser}/access_management": 1
                  "{clickhouseOperatorUser}/named_collection_control": 1
                  "{clickhouseOperatorUser}/show_named_collections": 1
                  "{clickhouseOperatorUser}/show_named_collections_secrets": 1
                profiles:
                quotas:
                settings:
                files:
          - version: ">= 23.5"
            spec:
              configuration:
                users:
                profiles:
                  clickhouse_operator/format_display_secrets_in_show_and_select: 1
                quotas:
                settings:
                  ##
                  ## this may be added on per-host basis into host's conf.d folder
                  ##
                  display_secrets_in_show_and_select: 1
                files:
    
      #################################################
      ##
      ## Metrics collection
      ##
      ################################################
    
      metrics:
        # Timeouts used to limit connection and queries from the metrics exporter to ClickHouse instances
        # Specified in seconds.
        timeouts:
          # Timeout used to limit metrics collection request. In seconds.
          # Upon reaching this timeout metrics collection is aborted and no more metrics are collected in this cycle.
          # All collected metrics are returned.
          collect: 9
        # Regexp to match tables in system database to fetch metrics from.
        # Multiple tables can be matched using regexp. Matched tables are merged using merge() table function.
        # Default is "^(metrics|custom_metrics)$" which fetches from both system.metrics and system.custom_metrics.
        tablesRegexp: "^(metrics|custom_metrics)$"
        # List of regexps to match ClickHouse metrics to exclude from collection/export.
        # Regexps match internal metric names before Prometheus normalization and prefixing.
        # Default is the per-CPU OS metrics filter shown below; set to [] to disable.
        excludeRegexp:
          - "^metric\\.(OS.*CPU[0-9]+|CPUFrequencyMHz_[0-9]+)$"
    
    keeper:
      configuration:
        ################################################
        ##
        ## Configuration files section
        ##
        ################################################
        file:
          # Each 'path' can be either absolute or relative.
          # In case path is absolute - it is used as is
          # In case path is relative - it is relative to the folder where configuration file you are reading right now is located.
          path:
            # Path to the folder where Keeper configuration files common for all instances within a CHK are located.
            common: chk/keeper_config.d
            # Path to the folder where Keeper configuration files unique for each instance (host) within a CHK are located.
            host: chk/conf.d
            # Path to the folder where Keeper configuration files with users' settings are located.
            # Files are common for all instances within a CHI.
            user: chk/users.d
    
    ################################################
    ##
    ## Security Section
    ##
    ## Operator-wide security toggles. All fields default to unset / permissive so
    ## upgrades from earlier versions preserve identical behavior. Set explicit
    ## values here to tighten the operator's outbound TLS posture; CHIs may further
    ## override per-cluster via spec.configuration.clusters[].security.
    ##
    ## Three orthogonal axes govern this section:
    ##   1. security.policy           — TLS-hardening master switch (Permissive | Enforced)
    ##   2. security.fips.enforced    — FIPS cryptographic-module gate (bool)
    ##   3. security.images.policy    — Workload image-tag governance   (Permissive | FIPSRequired)
    ## Each axis is independent: enabling one does not enable the others.
    ##
    ## See docs/chi-examples/70-chop-config.yaml for a fully-annotated example
    ## and docs/security_hardening.md for the design + per-knob semantics.
    ##
    ################################################
    security:
      clickhouse:
        tls:
          # Strict | None | "" (preserve legacy InsecureSkipVerify=true)
          verify: ""
          # "1.2" | "1.3" | "" (Go stdlib default)
          minVersion: ""
          # SNI / cert-name override; default = dial host
          serverName: ""
          # Inline PEM CA bundle (or base64-wrapped)
          rootCA: ""
          # Alternate source — Secret in operator namespace. Mutually exclusive
          # with the inline rootCA above. Empty `name` = not used (no-op).
          # When `key` is empty, the operator tries "ca.crt" then "tls.crt".
          rootCASecretRef:
            name: ""
            key: ""
      zookeeper:
        tls:
          verify: ""
          minVersion: ""
      kubernetes:
        tls:
          # Strict refuses an insecure kubeconfig at startup
          verify: ""
          # Floors the K8s API client transport TLS version; coerced to 1.3 under FIPS/Enforced
          minVersion: ""
      ipc:
        # Plain (default) | Secure (loopback + X-CHOP-Token)
        mode: Plain
        # Defaults to 127.0.0.1 when mode=Secure
        bindHost: ""
        # Defaults to /etc/clickhouse-operator-ipc/token
        tokenPath: ""
      # Operator-wide TLS-hardening master switch. ONLY governs TLS posture across
      # CH / ZK / K8s transports — NOT the FIPS cryptographic-module gate (see
      # security.fips.enforced below for that, orthogonal axis).
      #
      # Permissive (default) preserves 0.27.0 behavior — no coercion, no rejection.
      # Enforced coerces all TLS knobs above to their Strict positions at startup:
      #   - clickhouse.tls.verify=Strict, clickhouse.tls.minVersion=1.3
      #   - zookeeper.tls.verify=Strict,  zookeeper.tls.minVersion=1.3
      #   - kubernetes.tls.verify=Strict, kubernetes.tls.minVersion=1.3
      #   - ipc.mode=Secure
      #   - clickhouse.access.scheme: http is coerced to https
      # Enforced also rejects CHIs that cannot be served in a hardened posture
      # (e.g. plaintext external ZooKeeper, ZK digest auth).
      #
      # Independent of the Go FIPS toolchain — works on non-FIPS builds for pure
      # TLS hardening. Combine with security.fips.enforced=true for full FIPS
      # cryptographic-module enforcement.
      policy: Permissive
      # FIPS cryptographic-module enforcement. Orthogonal to security.policy.
      # Default operator and metrics-exporter images are FIPS-compatible —
      # built with GOFIPS140=v1.0.0 and run with GODEBUG=fips140=on, so
      # crypto/fips140.Enabled() returns true at runtime.
      # When enforced=true, the operator Fatals at startup unless the binary
      # reports crypto/fips140 Enabled — guards against accidentally running
      # a non-FIPS rebuild in a hardened deployment.
      fips:
        enforced: false
      images:
        # Workload image-tag governance gate. Today's only non-default value is
        # FIPSRequired (admission rejects CRs whose CH/Keeper images lack 'fips'
        # in tag; post-Ready SELECT version() must contain 'fips' or CR aborts).
        # Orthogonal to security.policy and security.fips.enforced.
        # See docs/security_hardening_fips.md → "security.images.policy: FIPSRequired"
        # for the full policy matrix + detection details + recovery procedure.
        policy: Permissive
    
    ################################################
    ##
    ## Template(s) management section
    ##
    ################################################
    template:
      chi:
        # CHI template updates handling policy
        # Possible policy values:
        #   - ReadOnStart. Accept CHIT updates on the operator's start only.
        #   - ApplyOnNextReconcile. Accept CHIT updates at all time. Apply new CHITs on next regular reconcile of the CHI
        policy: ApplyOnNextReconcile
    
        # Path to the folder where ClickHouseInstallation templates .yaml manifests are located.
        # Templates are added to the list of all templates and used when CHI is reconciled.
        # Templates are applied in sorted alpha-numeric order.
        path: chi/templates.d
      # NB there is deliberately no `chk:` section here. OperatorConfigTemplate declares only a CHI
      # field, so any template.chk.* key unmarshals into nothing and is pruned by the chopconf CRD -
      # it read as a supported knob while doing nothing. CHK templating is not implemented; adding
      # the keys back requires the Go field and a reader first.
    
    ################################################
    ##
    ## Reconcile section
    ##
    ################################################
    reconcile:
      # Reconcile runtime settings
      runtime:
        # Max number of concurrent CHI reconciles in progress
        reconcileCHIsThreadsNumber: 10
        # Max number of concurrent CHK reconciles in progress
        reconcileCHKsThreadsNumber: 1
    
        # The operator reconciles shards concurrently in each CHI with the following limitations:
        #   1. Number of shards being reconciled (and thus having hosts down) in each CHI concurrently
        #      can not be greater than 'reconcileShardsThreadsNumber'.
        #   2. Percentage of shards being reconciled (and thus having hosts down) in each CHI concurrently
        #      can not be greater than 'reconcileShardsMaxConcurrencyPercent'.
        #   3. The first shard is always reconciled alone. Concurrency starts from the second shard and onward.
        # Thus limiting number of shards being reconciled (and thus having hosts down) in each CHI by both number and percentage
    
        # Max number of concurrent shard reconciles within one cluster in progress
        reconcileShardsThreadsNumber: 5
        # Max percentage of concurrent shard reconciles within one cluster in progress
        reconcileShardsMaxConcurrencyPercent: 50
    
        # Kubernetes API client rate limit of the operator: requests per second and burst. Set both.
        # 0 keeps the client-go defaults (5 and 10 per API group). Read from this file only, at startup.
        # OPERATOR_K8S_CLIENT_QPS_LIMIT and OPERATOR_K8S_CLIENT_BURST_LIMIT env vars override them.
        k8sClientQPS: 0
        k8sClientBurst: 0
    
      # Reconcile StatefulSet scenario
      statefulSet:
        # Create StatefulSet scenario
        create:
          # What to do in case created StatefulSet is not in 'Ready' after `reconcile.statefulSet.update.timeout` seconds
          # Possible options:
          # 1. abort - abort the process, do nothing with the problematic StatefulSet, leave it as it is,
          #    do not try to fix or delete or update it, just abort reconcile cycle.
          #    Do not proceed to the next StatefulSet(s) and wait for an admin to assist.
          # 2. delete - delete newly created problematic StatefulSet and follow 'abort' path afterwards.
          # 3. ignore - ignore an error, pretend nothing happened, continue reconcile and move on to the next StatefulSet.
          onFailure: ignore
    
        # Update StatefulSet scenario
        update:
          # How many seconds to wait for created/updated StatefulSet to be 'Ready'
          timeout: 300
          # How many seconds to wait between checks/polls for created/updated StatefulSet status
          pollInterval: 5
          # What to do in case updated StatefulSet is not in 'Ready' after `reconcile.statefulSet.update.timeout` seconds
          # Possible options:
          # 1. abort - abort the process, do nothing with the problematic StatefulSet, leave it as it is,
          #    do not try to fix or delete or update it, just abort reconcile cycle.
          #    Do not proceed to the next StatefulSet(s) and wait for an admin to assist.
          # 2. rollback - delete Pod and rollback StatefulSet to previous Generation.
          #    Pod would be recreated by StatefulSet based on rollback-ed StatefulSet configuration.
          #    Follow 'abort' path afterwards.
          # 3. ignore - ignore an error, pretend nothing happened, continue reconcile and move on to the next StatefulSet.
          onFailure: abort
    
        # Recreate StatefulSet scenario
        recreate:
          # What to do in case operator is in need to recreate StatefulSet?
          # Possible options:
          # 1. abort - abort the process, do nothing with the problematic StatefulSet, leave it as it is,
          #    do not try to fix or delete or update it, just abort reconcile cycle.
          #    Do not proceed to the next StatefulSet(s) and wait for an admin to assist.
          # 2. recreate - proceed and recreate StatefulSet.
    
          # Triggered when PVC data loss or missing volumes are detected
          onDataLoss: recreate
          # Triggered when StatefulSet update fails or StatefulSet is not ready
          onUpdateFailure: recreate
    
      # Reconcile Host scenario
      host:
        # The operator during reconcile procedure should wait for a ClickHouse host to achieve the following conditions:
        wait:
          # Whether the operator during reconcile procedure should wait for a ClickHouse host:
          #   - to be excluded from a ClickHouse cluster
          #   - to complete all running queries
          #   - to be included into a ClickHouse cluster
          # respectfully before moving forward with host reconcile
          exclude: true
          queries: true
          include: false
          # The operator during reconcile procedure should wait for replicas to catch-up
          # replication delay a.k.a replication lag for the following replicas
          replicas:
            # All replicas (new and known earlier) are explicitly requested to wait for replication to catch-up
            all: no
            # New replicas only are requested to wait for replication to catch-up
            new: yes
            # Replication catch-up is considered to be completed as soon as replication delay
            # a.k.a replication lag - calculated as "MAX(absolute_delay) FROM system.replicas"
            # is within this specified delay (in seconds)
            delay: 10
          probes:
            # Whether the operator during host launch procedure should wait for startup probe to succeed.
            # In case probe is unspecified wait is assumed to be completed successfully.
            # Default option value is to do not wait.
            startup: no
            # Whether the operator during host launch procedure should wait for readiness probe to succeed.
            # In case probe is unspecified wait is assumed to be completed successfully.
            # Default option value is to wait.
            readiness: yes
        # The operator during reconcile procedure should drop the following entities:
        drop:
          replicas:
            # Whether the operator during reconcile procedure should drop replicas when replica is deleted
            onDelete: yes
            # Whether the operator during reconcile procedure should drop replicas when replica volume is lost
            onLostVolume: yes
            # Whether the operator during reconcile procedure should drop active replicas when replica is deleted or recreated
            active: no
    
      ################################################
      ##
      ## Coordination with external systems during reconcile
      ##
      ################################################
      coordination:
        keeper:
          # How long the operator waits for a referenced ClickHouseKeeper to become ready
          # before aborting CHI reconcile. In seconds.
          readyTimeout: 120
          # Reaction when a referenced CHK resource changes:
          #   none      — do nothing (default, backward-compatible)
          #   reconcile — trigger CHI reconcile
          onKeeperResourceUpdate: none
    
      ################################################
      ##
      ## Auto-recovery from aborted reconcile
      ##
      ################################################
      recovery:
        # Recovery scopes keyed by the CHI .status.status they apply to.
        # Each scope contains on<Event>: <action> mappings that apply while the CHI
        # is in that status. Multi-scope design anticipates future states beyond Aborted
        # (e.g. Failed, Broken).
        onStatus:
          # Recovery for a CHI whose .status.status is Aborted (reconcile did not complete)
          # when one of its host pods transitions to Ready — auto-resumes the reconcile.
          aborted:
            # Action when a pod belonging to an Aborted CHI transitions to Ready:
            #   retry (default) — re-enqueue the CHI for reconcile
            #   none            — do nothing, CHI stays Aborted
            onPodReady: retry
            # Future events (not yet implemented):
            #   onKeeperReady: retry       — retry when a referenced CHK becomes ready
            #   onOperatorRestart: retry   — sweep Aborted CHIs on operator startup
          # Recovery for a CHI whose .status.status is Completed (fully reconciled) when one
          # of its host pods regresses to Ready=False and stays NotReady (sustained) without
          # crashing — auto-heals stuck hosts.
          completed:
            # Action when a Completed CHI's pod flips Ready=True -> Ready=False and
            # stays NotReady for at least onPodNotReadyThreshold:
            #   none (default) — do nothing
            #   retry          — re-enqueue the CHI so the stuck host is force-restarted
            # OFF by default: force-recreating a Completed CHI's pod is destructive — it can
            # interrupt a replica's in-progress recovery and means hard downtime for a
            # single-replica shard. Opt in with `retry` only where that trade-off is acceptable.
            onPodNotReady: none
            # Minimum duration a pod must stay Ready=False before recovery fires, once enabled
            # (Go duration string; default 5m). Raise it for slow-recovering replicas.
            onPodNotReadyThreshold: 5m
          # Future scopes (not yet implemented):
          # failed:
          #   onPodReady: retry
          # broken:
          #   onPodReady: retry
    
        # Future global policy knobs (not yet implemented) — flat peers of `onStatus`,
        # apply across all recovery scopes:
        #
        # Global kill-switch for auto-recovery:
        # enabled: true
        #
        # Cap on consecutive auto-recovery attempts before giving up:
        # retries: 5
        #
        # Minimum time between auto-recovery attempts for the same CHI:
        # cooldown: 30s
        #
        # Exponential backoff for auto-recovery attempts:
        # backoff:
        #   duration: 5s
        #   factor: 2
        #   maxDuration: 2m
    
    ################################################
    ##
    ## Annotations management section
    ##
    ################################################
    annotation:
      # Applied when:
      #  1. Propagating annotations from the CHI's `metadata.annotations` to child objects' `metadata.annotations`,
      #  2. Propagating annotations from the CHI Template's `metadata.annotations` to CHI's `metadata.annotations`,
      # Include annotations from the following list:
      # Applied only when not empty. Empty list means "include all, no selection"
      include: []
      # Exclude annotations from the following list:
      exclude: []
    
    ################################################
    ##
    ## Labels management section
    ##
    ################################################
    label:
      # Applied when:
      #  1. Propagating labels from the CHI's `metadata.labels` to child objects' `metadata.labels`,
      #  2. Propagating labels from the CHI Template's `metadata.labels` to CHI's `metadata.labels`,
      # Include labels from the following list:
      # Applied only when not empty. Empty list means "include all, no selection"
      include: []
      # Exclude labels from the following list:
      # Applied only when not empty. Empty list means "nothing to exclude, no selection"
      exclude: []
      # Whether to append *Scope* labels to StatefulSet and Pod.
      # Full list of available *scope* labels check in 'labeler.go'
      #  LabelShardScopeIndex
      #  LabelReplicaScopeIndex
      #  LabelCHIScopeIndex
      #  LabelCHIScopeCycleSize
      #  LabelCHIScopeCycleIndex
      #  LabelCHIScopeCycleOffset
      #  LabelClusterScopeIndex
      #  LabelClusterScopeCycleSize
      #  LabelClusterScopeCycleIndex
      #  LabelClusterScopeCycleOffset
      appendScope: "no"
    
    ################################################
    ##
    ## Metrics management section
    ##
    ################################################
    metrics:
      labels:
        exclude: []
    
    ################################################
    ##
    ## Status management section
    ##
    ################################################
    status:
      fields:
        action: false
        actions: false
        error: true
        errors: true
    
    ################################################
    ##
    ## StatefulSet management section
    ##
    ################################################
    statefulSet:
      revisionHistoryLimit: 0
    
    ################################################
    ##
    ## Pod management section
    ##
    ################################################
    pod:
      # Grace period for Pod termination.
      # How many seconds to wait between sending
      # SIGTERM and SIGKILL during Pod termination process.
      # Increase this number is case of slow shutdown.
      terminationGracePeriod: 30
    
    ################################################
    ##
    ## Backup section
    ##
    ################################################
    backup:
      # EXPERIMENTAL. Where in its storage the clickhouse-backup sidecar of a host keeps its backups,
      # and their object disk data, when the settings of that storage set no path of their own.
      # Templates clickhouse-backup expands with the macros of the host: {namespace},
      # {installation}, {cluster}, {shard}, {replica}. Changing them rolls the pods of every
      # backup-enabled cluster and leaves the backups made under the old paths where they are.
      # See docs/backup.md#storage-paths.
      storagePath: "backup/{namespace}/{installation}/{cluster}/{shard}"
      storageObjectDiskPath: "object_disks/{namespace}/{installation}/{cluster}/{shard}"
      # Path to the folder of the backup orchestrator script, backup-orchestrator.sh, which the backup, verify and
      # restore Jobs run. Relative to the folder of this file unless absolute, as template.chi.path.
      # See docs/backup.md#the-orchestrator-script.
      path: backup
      # Path to the folder of the Python orchestrator script, backup-orchestrator.py, which the Jobs of a cluster with
      # backup.orchestrator python run. Relative to the folder of this file unless absolute.
      # See docs/backup.md#python-orchestrator.
      pythonPath: backup-python
    
    ################################################
    ##
    ## Log parameters section
    ##
    ################################################
    logger:
      logtostderr: "true"
      alsologtostderr: "false"
      v: "1"
      stderrthreshold: ""
      vmodule: ""
      log_backtrace_at: ""

