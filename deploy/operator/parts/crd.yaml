              x-kubernetes-preserve-unknown-fields: true
              properties:
                watch:
                  type: object
                  description: "Parameters for watch kubernetes resources which used by clickhouse-operator deployment"
                  properties:
                    namespaces:
                      type: object
                      description: "List of namespaces where clickhouse-operator watches for events."
                      x-kubernetes-preserve-unknown-fields: true
                    configuration:
                      type: object
                      description: "Behavior when ClickHouseOperatorConfiguration resources change"
                      properties:
                        onChange:
                          type: string
                          enum:
                            - none
                            - None
                            - ignore
                            - Ignore
                            - restart
                            - Restart
                          description: "none/ignore — do nothing; restart — exit process so the operator pod restarts"
                clickhouse:
                  type: object
                  description: "Clickhouse related parameters used by clickhouse-operator"
                  properties:
                    configuration:
                      type: object
                      properties:
                        file:
                          type: object
                          properties:
                            path:
                              type: object
                              description: |
                                Each 'path' can be either absolute or relative.
                                In case path is absolute - it is used as is.
                                In case path is relative - it is relative to the folder where configuration file you are reading right now is located.
                              properties:
                                common:
                                  type: string
                                  description: |
                                    Path to the folder where ClickHouse configuration files common for all instances within a CHI are located.
                                    Default value - config.d
                                host:
                                  type: string
                                  description: |
                                    Path to the folder where ClickHouse configuration files unique for each instance (host) within a CHI are located.
                                    Default value - conf.d
                                user:
                                  type: string
                                  description: |
                                    Path to the folder where ClickHouse configuration files with users settings are located.
                                    Files are common for all instances within a CHI.
                                    Default value - users.d
                        user:
                          type: object
                          description: "Default parameters for any user which will create"
                          properties:
                            default:
                              type: object
                              properties:
                                profile:
                                  type: string
                                  description: "ClickHouse server configuration `<profile>...</profile>` for any <user>"
                                quota:
                                  type: string
                                  description: "ClickHouse server configuration `<quota>...</quota>` for any <user>"
                                networksIP:
                                  type: array
                                  description: "ClickHouse server configuration `<networks><ip>...</ip></networks>` for any <user>"
                                  items:
                                    type: string
                                password:
                                  type: string
                                  description: "ClickHouse server configuration `<password>...</password>` for any <user>"
                        network:
                          type: object
                          description: "Default network parameters for any user which will create"
                          properties:
                            hostRegexpTemplate:
                              type: string
                              description: "ClickHouse server configuration `<host_regexp>...</host_regexp>` for any <user>"
                    configurationRestartPolicy:
                      type: object
                      description: "Configuration restart policy describes what configuration changes require ClickHouse restart"
                      properties:
                        rules:
                          type: array
                          description: "Array of set of rules per specified ClickHouse versions"
                          items:
                            type: object
                            properties:
                              version:
                                type: string
                                description: "ClickHouse version expression"
                              rules:
                                type: array
                                description: "Set of configuration rules for specified ClickHouse version"
                                items:
                                  type: object
                                  description: "setting: value pairs for configuration restart policy"
                                  x-kubernetes-preserve-unknown-fields: true
                    access:
                      type: object
                      description: "parameters which use for connect to clickhouse from clickhouse-operator deployment"
                      properties:
                        scheme:
                          type: string
                          description: "The scheme to user for connecting to ClickHouse. Possible values: http, https, auto"
                        username:
                          type: string
                          description: "ClickHouse username to be used by operator to connect to ClickHouse instances, deprecated, use chCredentialsSecretName"
                        password:
                          type: string
                          description: "ClickHouse password to be used by operator to connect to ClickHouse instances, deprecated, use chCredentialsSecretName"
                        rootCA:
                          type: string
                          description: "Root certificate authority that clients use when verifying server certificates. Used for https connection to ClickHouse"
                        rootCASecretRef:
                          type: object
                          description: "Reference to a k8s Secret (in the operator namespace) holding the PEM root certificate authority used when verifying ClickHouse server certificates over https. Alternate source for rootCA; mutually exclusive with the inline rootCA above (inline wins)."
                          properties:
                            name:
                              type: string
                              description: "Name of the k8s Secret holding the PEM CA bundle. Empty name = not used"
                            key:
                              type: string
                              description: "Key within the Secret whose value is the PEM CA bundle. When empty, the operator tries 'ca.crt' then 'tls.crt'"
                        secret:
                          type: object
                          properties:
                            namespace:
                              type: string
                              description: "Location of k8s Secret with username and password to be used by operator to connect to ClickHouse instances"
                            name:
                              type: string
                              description: "Name of k8s Secret with username and password to be used by operator to connect to ClickHouse instances"
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                          description: "Port to be used by operator to connect to ClickHouse instances"
                        timeouts:
                          type: object
                          description: "Timeouts used to limit connection and queries from the operator to ClickHouse instances, In seconds"
                          properties:
                            connect:
                              type: integer
                              minimum: 1
                              maximum: 10
                              description: "Timout to setup connection from the operator to ClickHouse instances. In seconds."
                            query:
                              type: integer
                              minimum: 1
                              maximum: 600
                              description: "Timout to perform SQL query from the operator to ClickHouse instances. In seconds."
                    addons:
                      type: object
                      description: "Configuration addons specifies additional settings"
                      properties:
                        rules:
                          type: array
                          description: "Array of set of rules per specified ClickHouse versions"
                          items:
                            type: object
                            properties:
                              version:
                                type: string
                                description: "ClickHouse version expression"
                              spec:
                                type: object
                                description: "spec"
                                properties:
                                  configuration:
                                    type: object
                                    description: "allows configure multiple aspects and behavior for `clickhouse-server` instance and also allows describe multiple `clickhouse-server` clusters inside one `chi` resource"
                                    properties:
                                      users:
                                        type: object
                                        description: "see same section from CR spec"
                                        x-kubernetes-preserve-unknown-fields: true
                                      profiles:
                                        type: object
                                        description: "see same section from CR spec"
                                        x-kubernetes-preserve-unknown-fields: true
                                      quotas:
                                        type: object
                                        description: "see same section from CR spec"
                                        x-kubernetes-preserve-unknown-fields: true
                                      settings:
                                        type: object
                                        description: "see same section from CR spec"
                                        x-kubernetes-preserve-unknown-fields: true
                                      files:
                                        type: object
                                        description: "see same section from CR spec"
                                        x-kubernetes-preserve-unknown-fields: true
                    metrics:
                      type: object
                      description: "parameters which use for connect to fetch metrics from clickhouse by clickhouse-operator"
                      properties:
                        timeouts:
                          type: object
                          description: |
                            Timeouts used to limit connection and queries from the metrics exporter to ClickHouse instances
                            Specified in seconds.
                          properties:
                            collect:
                              type: integer
                              minimum: 1
                              maximum: 600
                              description: |
                                Timeout used to limit metrics collection request. In seconds.
                                Upon reaching this timeout metrics collection is aborted and no more metrics are collected in this cycle.
                                All collected metrics are returned.
                        tablesRegexp:
                          type: string
                          description: |
                            Regexp to match tables in system database to fetch metrics from.
                            Multiple tables can be matched using regexp. Matched tables are merged using merge() table function.
                            Default is "^(metrics|custom_metrics)$".
                        excludeRegexp:
                          type: array
                          items:
                            type: string
                          description: |
                            List of regexps to match ClickHouse metrics to exclude from collection/export.
                            Regexps match internal metric names before Prometheus normalization and prefixing.
                keeper:
                  type: object
                  description: |
                    Keeper-side counterparts of the `clickhouse` section - config-file paths and the
                    default Keeper user/network settings the operator generates for
                    ClickHouseKeeperInstallation resources.
                    Declared preserve-unknown-fields rather than fully modelled: without this the API
                    server PRUNES the whole section from a ClickHouseOperatorConfiguration CR and the
                    operator silently falls back to built-in defaults. The ConfigMap path was never
                    affected. Modelling the leaves properly would also buy validation - see the
                    coverage test in pkg/apis/clickhouse.altinity.com/v1.
                  x-kubernetes-preserve-unknown-fields: true
                security:
                  type: object
                  description: |
                    Per-component security toggles for outbound connections the operator establishes:
                    ClickHouse-client TLS (clickhouse.tls.verify, clickhouse.tls.minVersion, clickhouse.tls.serverName, clickhouse.tls.rootCA, clickhouse.tls.rootCASecretRef),
                    ZooKeeper/Keeper-client TLS (zookeeper.tls.verify, zookeeper.tls.minVersion),
                    Kubernetes-client TLS (kubernetes.tls.verify=Strict refuses an insecure kubeconfig at startup; kubernetes.tls.minVersion floors the K8s API client transport, coerced to 1.3 under FIPS/Enforced),
                    operator↔metrics-exporter IPC channel hardening (ipc.mode, ipc.bindHost, ipc.tokenPath).
                    Operator-wide master switch (security.policy): Permissive (default) preserves 0.27.0
                    behavior; Enforced coerces all per-component knobs above to their Strict positions
                    at startup (clickhouse.tls.verify=Strict, clickhouse.tls.minVersion=1.3,
                    zookeeper.tls.verify=Strict, zookeeper.tls.minVersion=1.3,
                    kubernetes.tls.verify=Strict, kubernetes.tls.minVersion=1.3, ipc.mode=Secure) and
                    rejects CHIs that cannot be served in a FIPS-compatible posture (e.g. CHIs
                    referencing plain-text external ZooKeeper). Independent of the Go runtime FIPS
                    toolchain — when this operator binary is built with GOFIPS140=v1.0.0 (the Go FIPS
                    module currently in CMVP review, not yet a completed validation) the startup gate
                    ORs runtime detection with this knob.
                    FIPS image policy (security.images.policy): orthogonal to security.policy.
                    Permissive (default) accepts any image; Required refuses CRs whose CH/Keeper
                    images lack the "fips" tag substring (admission) AND aborts running CRs whose
                    `SELECT version()` lacks "fips" (post-Ready confirmation).
                    All fields default to nil — current behavior preserved on upgrade.
                    See docs/security_hardening.md for details.
                  x-kubernetes-preserve-unknown-fields: true
                template:
                  type: object
                  description: "Parameters which are used if you want to generate ClickHouseInstallationTemplate custom resources from files which are stored inside clickhouse-operator deployment"
                  properties:
                    chi:
                      type: object
                      properties:
                        policy:
                          type: string
                          description: |
                            CHI template updates handling policy
                            Possible policy values:
                              - ReadOnStart. Accept CHIT updates on the operators start only.
                              - ApplyOnNextReconcile. Accept CHIT updates at all time. Apply news CHITs on next regular reconcile of the CHI
                          enum:
                            # both humped and all-lowercase accepted
                            - ""
                            - "ReadOnStart"
                            - "readonstart"
                            - "ApplyOnNextReconcile"
                            - "applyonnextreconcile"
                        path:
                          type: string
                          description: "Path to folder where ClickHouseInstallationTemplate .yaml manifests are located."
                reconcile:
                  type: object
                  description: "allow tuning reconciling process"
                  properties:
                    runtime:
                      type: object
                      description: "runtime parameters for clickhouse-operator process which are used during reconcile cycle"
                      properties:
                        reconcileCHIsThreadsNumber:
                          type: integer
                          minimum: 1
                          maximum: 65535
                          description: "How many goroutines will be used to reconcile CHIs in parallel, 10 by default"
                        reconcileCHKsThreadsNumber:
                          type: integer
                          minimum: 1
                          maximum: 65535
                          description: "How many goroutines will be used to reconcile CHKs in parallel, 1 by default"
                        reconcileShardsThreadsNumber:
                          type: integer
                          minimum: 1
                          maximum: 65535
                          description: "How many goroutines will be used to reconcile shards of a cluster in parallel, 1 by default"
                        reconcileShardsMaxConcurrencyPercent:
                          type: integer
                          minimum: 0
                          maximum: 100
                          description: "The maximum percentage of cluster shards that may be reconciled in parallel, 50 percent by default."
                    statefulSet:
                      type: object
                      description: "Allow change default behavior for reconciling StatefulSet which generated by clickhouse-operator"
                      properties:
                        create:
                          type: object
                          description: "Behavior during create StatefulSet"
                          properties:
                            onFailure:
                              type: string
                              description: |
                                What to do in case created StatefulSet is not in Ready after `statefulSetUpdateTimeout` seconds
                                Possible options:
                                1. abort - do nothing, just break the process and wait for admin.
                                2. delete - delete newly created problematic StatefulSet.
                                3. ignore (default) - ignore error, pretend nothing happened and move on to the next StatefulSet.
                        update:
                          type: object
                          description: "Behavior during update StatefulSet"
                          properties:
                            timeout:
                              type: integer
                              description: "How many seconds to wait for created/updated StatefulSet to be Ready"
                            pollInterval:
                              type: integer
                              description: "How many seconds to wait between checks for created/updated StatefulSet status"
                            onFailure:
                              type: string
                              description: |
                                What to do in case updated StatefulSet is not in Ready after `statefulSetUpdateTimeout` seconds
                                Possible options:
                                1. abort - do nothing, just break the process and wait for admin.
                                2. rollback (default) - delete Pod and rollback StatefulSet to previous Generation. Pod would be recreated by StatefulSet based on rollback-ed configuration.
                                3. ignore - ignore error, pretend nothing happened and move on to the next StatefulSet.
                        recreate:
                          type: object
                          description: "Behavior during recreate StatefulSet"
                          properties:
                            onDataLoss:
                              type: string
                              description: |
                                What to do in case operator needs to recreate StatefulSet due to PVC data loss or missing volumes.
                                Possible options:
                                1. abort - abort the process, do nothing with the problematic StatefulSet.
                                2. recreate (default) - proceed and recreate StatefulSet.
                            onUpdateFailure:
                              type: string
                              description: |
                                What to do in case operator needs to recreate StatefulSet due to update failure or StatefulSet not ready.
                                Possible options:
                                1. abort - abort the process, do nothing with the problematic StatefulSet.
                                2. recreate (default) - proceed and recreate StatefulSet.
                    host:
                      type: object
                      description: |
                        Whether the operator during reconcile procedure should wait for a ClickHouse host:
                          - to be excluded from a ClickHouse cluster
                          - to complete all running queries
                          - to be included into a ClickHouse cluster
                        respectfully before moving forward
                      properties:
                        wait:
                          type: object
                          properties:
                            exclude:
                              description: "Whether the operator during reconcile procedure should wait for a ClickHouse host to be excluded from a ClickHouse cluster"
                              # StringBool is polymorphic — accepts native YAML
                              # bool (true/false), integer (0/1), or string from
