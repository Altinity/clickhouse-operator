                              top-level `chi.spec.defaults.templates.dataVolumeClaimTemplate` or `chi.spec.defaults.templates.logVolumeClaimTemplate`,
                              cluster-level `chi.spec.configuration.clusters.templates.dataVolumeClaimTemplate` or `chi.spec.configuration.clusters.templates.logVolumeClaimTemplate`,
                              shard-level `chi.spec.configuration.clusters.layout.shards.temlates.dataVolumeClaimTemplate` or `chi.spec.configuration.clusters.layout.shards.temlates.logVolumeClaimTemplate`
                              replica-level `chi.spec.configuration.clusters.layout.replicas.templates.dataVolumeClaimTemplate` or `chi.spec.configuration.clusters.layout.replicas.templates.logVolumeClaimTemplate`
                          provisioner:
                            type: string
                            description: "defines `PVC` provisioner - be it StatefulSet or the Operator (case-insensitive)"
                            enum:
                              - ""
                              - "StatefulSet"
                              - "statefulset"
                              - "Operator"
                              - "operator"
                          reclaimPolicy:
                            type: string
                            description: |
                              defines behavior of `PVC` deletion (case-insensitive).
                              `Delete` by default, if `Retain` specified then `PVC` will be kept when deleting StatefulSet
                            enum:
                              - ""
                              - "Retain"
                              - "retain"
                              - "Delete"
                              - "delete"
                          metadata:
                            type: object
                            description: |
                              allows to pass standard object's metadata from template to PVC
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
                            # nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                          spec:
                            type: object
                            description: |
                              allows define all aspects of `PVC` resource
                              More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims
                            # nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                    serviceTemplates:
                      type: array
                      description: |
                        allows define template for rendering `Service` which would get endpoint from Pods which scoped chi-wide, cluster-wide, shard-wide, replica-wide level
                      # nullable: true
                      items:
                        type: object
                        #required:
                        #  - name
                        #  - spec
                        properties:
                          name:
                            type: string
                            description: |
                              template name, could use to link inside
                              chi-level `chi.spec.defaults.templates.serviceTemplate`
                              cluster-level `chi.spec.configuration.clusters.templates.clusterServiceTemplate`
                              shard-level `chi.spec.configuration.clusters.layout.shards.temlates.shardServiceTemplate`
                              replica-level `chi.spec.configuration.clusters.layout.replicas.templates.replicaServiceTemplate` or `chi.spec.configuration.clusters.layout.shards.replicas.replicaServiceTemplate`
                          generateName:
                            type: string
                            description: |
                              allows define format for generated `Service` name,
                              look to https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatesservicetemplates
                              for details about available template variables"
                          metadata:
                            # TODO specify ObjectMeta
                            type: object
                            description: |
                              allows pass standard object's metadata from template to Service
                              Could be use for define specificly for Cloud Provider metadata which impact to behavior of service
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
                            # nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                          spec:
                            # TODO specify ServiceSpec
                            type: object
                            description: |
                              describe behavior of generated Service
                              More info: https://kubernetes.io/docs/concepts/services-networking/service/
                            # nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                security:
                  type: object
                  description: |
                    CHI-level security defaults, applied to every cluster that does not override
                    them. Each cluster can shadow these via spec.configuration.clusters[].security.
                    See docs/security_hardening.md for details.
                  x-kubernetes-preserve-unknown-fields: true
                backup:
                  type: object
                  properties:
                    enabled:
                      # StringBool is polymorphic — accepts native YAML bool (true/false),
                      # integer (0/1), or string from the recognized vocabulary
                      # (true/True/TRUE, yes/Yes, on/On, 1, enable/enabled, and their
                      # false/no/off/0/disable/disabled counterparts). Validation moves
                      # into the operator: pkg/apis/common/types StringBool.UnmarshalJSON
                      # normalizes input, IsValid() rejects garbage at normalize time.
                      # Structural-schema rules don't natively support bool|int|string
                      # union, so we use x-kubernetes-preserve-unknown-fields: true as
                      # the documented escape hatch (k8s apiextensions.k8s.io/v1).
                      x-kubernetes-preserve-unknown-fields: true
                      description: |
                        Enable operator-managed backup: inject the clickhouse-backup sidecar and allow backup/restore resources to target
                        the cluster. Takes effect only with a storage that has a `secretRef`, or `podTemplate` set, which name where the
                        sidecar takes its storage from: without either, backup stays off
                    podTemplate:
                      type: string
                      description: |
                        Pod template whose container named clickhouse-backup the sidecar is built on: what the container sets is kept,
                        and the operator fills in only what it lacks. Only that container is taken, not the other containers, volumes
                        or Pod settings of the template. Left empty, the operator builds the sidecar on its own
                    storages:
                      type: array
                      description: |
                        Storages the backups may be kept in, each under a name of its own; one per level for now. A cluster takes
                        those of the installation along with its own, pairing them by name: a storage of its own that the installation
                        declares too takes what it leaves out from the installation's. Templates contribute theirs alike
                      maxItems: 1
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: |
                              Name of the storage, which `storage` names: a DNS label of at most 45 characters
                            maxLength: 45
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                          secretRef:
                            type: object
                            description: |
                              Secret in the installation's namespace whose key `config.yml` holds the clickhouse-backup configuration
                              of the storage, a YAML mapping of its sections, e.g. general.remote_storage, s3.bucket, s3.path,
                              s3.access_key, s3.secret_key. The operator generates the configuration file of the sidecar from it,
                              which follows a change of the Secret without a restart.
                              Without one, of its own or of the storage of the same name it pairs with, the storage is configured by the
                              container of the Pod template `podTemplate` names
                            properties:
                              name:
                                description: |
                                  Name of the referent. More info:
                                  https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                    storage:
                      type: string
                      description: |
                        Name of the storage of `storages` the sidecar keeps the backups in. Left out, it is the only storage the same
                        level declares, or else the one the level a cluster inherits from uses; required where a level declares
                        several. On a cluster that turns backup on, a name no level declares aborts the reconcile. An explicit ""
                        on a cluster leaves the cluster without a storage
                    recovery:
                      type: object
                      description: |
                        Restore a new installation from a backup once it has completed its first reconcile: the operator
                        creates a ClickHouseRestore of every backup-enabled cluster that inherits a backup name, users, roles and
                        grants included, and records the recovery in the `clickhouse.altinity.com/recovered-from` annotation.
                        Changing it changes no Pod. Taken from the installation only, never from a ClickHouseInstallationTemplate.
                      properties:
                        backupName:
                          type: string
                          description: "Backup to recover from. An explicit empty name on a cluster leaves the cluster out of a recovery the installation asks for"
                          maxLength: 128
                          pattern: '^([A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?)?$'
                        sourceInstallation:
                          type: string
                          description: |
                            ClickHouseInstallation that made the backup, when not this one: the recovery reads the backup from the
                            storage paths the {installation} macro gives there. Empty, this installation
                          maxLength: 253
                          pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                        sourceNamespace:
                          type: string
                          description: |
                            Namespace of the ClickHouseInstallation that made the backup, when not this one: the recovery reads the
                            backup from the storage paths the {namespace} macro gives there. Empty, the namespace of this installation
                          maxLength: 63
                          pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                  description: |
                    EXPERIMENTAL. Operator-managed backup defaults, applied to every cluster. Each cluster can override
                    them via `chi.spec.configuration.clusters[].backup`, e.g. `enabled: "no"` to opt a cluster out.
                    When enabled, the operator injects a clickhouse-backup sidecar into every Pod of the cluster,
                    so turning it on or off rolls the cluster's Pods. Backup takes effect only where the storage a cluster
                    uses has a `secretRef`, or `podTemplate` is set: without either the sidecar would have no backup storage,
                    so backup stays off and the operator warns.
                    See docs/backup.md for details.
                useTemplates:
                  type: array
                  description: |
                    list of `ClickHouseInstallationTemplate` (chit) resource names which will merge with current `CHI`
                    manifest during render Kubernetes resources to create related ClickHouse clusters"
                  # nullable: true
                  items:
                    type: object
                    #required:
                    #  - name
                    properties:
                      name:
                        type: string
                        description: "name of `ClickHouseInstallationTemplate` (chit) resource"
                      namespace:
                        type: string
                        description: "Kubernetes namespace where need search `chit` resource, depending on `watchNamespaces` settings in `clickhouse-operator`"
                      useType:
                        type: string
                        description: "optional, current strategy is only merge, and current `chi` settings have more priority than merged template `chit` (case-insensitive)"
                        enum:
                          # List useTypeXXX constants from model (both humped and all-lowercase accepted)
                          - ""
                          - "Merge"
                          - "merge"
