                                - "delete"
                              description: "Behavior policy for failed StatefulSet, `Retain` by default"
                            pvc:
                              type: string
                              enum:
                                # List ObjectsCleanupXXX constants from model (both humped and all-lowercase accepted)
                                - ""
                                - "Retain"
                                - "retain"
                                - "Delete"
                                - "delete"
