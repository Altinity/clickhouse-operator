                            configMap:
                              type: string
                              enum:
                                # List ObjectsCleanupXXX constants from model (both humped and all-lowercase accepted)
                                - ""
                                - "Retain"
                                - "retain"
                                - "Delete"
                                - "delete"
                              description: "Behavior policy for failed ConfigMap, `Retain` by default"
                            service:
                              type: string
                              enum:
                                # List ObjectsCleanupXXX constants from model (both humped and all-lowercase accepted)
                                - ""
                                - "Retain"
                                - "retain"
