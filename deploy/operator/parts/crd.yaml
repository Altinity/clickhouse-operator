                      # integer (0/1), or string from the recognized vocabulary
                      # (true/True/TRUE, yes/Yes, on/On, 1, enable/enabled, and their
                      # false/no/off/0/disable/disabled counterparts). Validation moves
                      # into the operator: pkg/apis/common/types StringBool.UnmarshalJSON
                      # normalizes input, IsValid() rejects garbage at normalize time.
                      # Structural-schema rules don't natively support bool|int|string
                      # union, so we use x-kubernetes-preserve-unknown-fields: true as
                      # the documented escape hatch (k8s apiextensions.k8s.io/v1).
                      x-kubernetes-preserve-unknown-fields: true
                      description: |
                        Enable operator-managed backup: inject the clickhouse-backup sidecar and allow backup/restore resources to target
                        the cluster. Needs `storageConfig`.
                    podTemplate:
                      type: string
                      description: |
                        Pod template whose container named clickhouse-backup the sidecar is built on: what the container sets is kept,
                        and the operator fills in only what it lacks. Only that container is taken, not the other containers, volumes
                        or Pod settings of the template. Left empty, the operator builds the sidecar on its own
                    storageConfig:
                      type: object
                      description: |
                        Secret key in the installation namespace with the clickhouse-backup configuration.
                        The value is a YAML mapping of config sections, e.g. general.remote_storage, s3.bucket, s3.path, s3.access_key, s3.secret_key.
                        The operator generates the config file from it, adds the REST API credentials, and follows Secret changes without a restart.
                        A cluster without it inherits the installation value. `secretKeyRef.name: ""` on a cluster removes it.
                        Required when backup is enabled.
                      properties:
                        valueFrom:
                          description: "Source of the clickhouse-backup configuration"
                          type: object
                          properties:
                            secretKeyRef:
                              description: |
                                Secret key in the installation namespace.
                              type: object
                              properties:
                                name:
                                  description: |
                                    Name of the referent. More info:
                                    https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                key:
                                  description: "Secret key with the clickhouse-backup configuration, e.g. `config.yml`. Required."
                                  type: string
                                optional:
                                  description: "Not supported. The operator refuses an optional source."
                                  type: boolean
                              required:
                                - key
                            hotReload:
                              description: "Not supported. The operator refuses hotReload."
                              type: boolean
                    preferredReplica:
                      type: integer
                      minimum: 0
                      description: |
                        Index, from 0, of the replica that backs up each shard (backupReplica in the Altinity usual backup workflow). Default 0.
                        A shard with fewer replicas uses its first replica. If the replica does not answer, the backup runs on the first replica.
                        See docs/backup.md.
                    naming:
                      type: string
                      maxLength: 128
                      pattern: '^([A-Za-z0-9._-]|\{[A-Za-z]+\})+$'
                      description: |
                        Template for backup names, one name per shard, e.g. "shard{shardNum}-{YYYYMMDDHHIISS}" as in the Altinity usual backup workflow.
                        Placeholders:
                        - {shard}: value of the {shard} macro of the host. The storage path uses it too. It is the shard index from 0, unless the layout names the shard.
                        - {shardNum}: shard number from 1 (shard_num in system.clusters).
                        - {cluster}, {chi}, {namespace}.
                        - {prefix}: backupNamePrefix of the schedule.
                        - Time tokens YYYY, MM, DD, HH, II (minutes) and SS in braces, e.g. {YYYYMMDDHHIISS}.
                        {shard} or {shardNum} is required, and all time tokens are required. An unscheduled backup has a T before the hour.
                        Empty (default) names a backup "<prefix>-<YYYYMMDDHHMMSS>", the same on every shard. See docs/backup.md.
                    recovery:
                      type: object
                      description: |
                        Restore a new installation from a backup once it has completed its first reconcile: the operator
                        creates a ClickHouseRestore of every backup-enabled cluster that inherits a backup name, users, roles and
                        grants included, and records the recovery in the `clickhouse.altinity.com/recovered-from` annotation.
                        Changing it changes no Pod. Taken from the installation only, never from a ClickHouseInstallationTemplate.
                      properties:
                        backupName:
                          type: string
                          description: "Backup to recover from. An explicit empty name on a cluster leaves the cluster out of a recovery the installation asks for"
                          maxLength: 128
                          pattern: '^([A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?)?$'
                        sourceInstallation:
                          type: string
                          description: |
                            ClickHouseInstallation that made the backup, when not this one: the recovery reads the backup from the
                            storage paths the {installation} macro gives there. Empty, this installation
                          maxLength: 253
                          pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                        sourceNamespace:
                          type: string
                          description: |
                            Namespace of the ClickHouseInstallation that made the backup, when not this one: the recovery reads the
                            backup from the storage paths the {namespace} macro gives there. Empty, the namespace of this installation
                          maxLength: 63
                          pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                  description: |
                    EXPERIMENTAL. Operator-managed backup defaults, applied to every cluster. Each cluster can override
                    them via `chi.spec.configuration.clusters[].backup`, e.g. `enabled: "no"` to opt a cluster out.
                    The operator adds a clickhouse-backup sidecar to every Pod of the cluster, so a change of `enabled` restarts the Pods.
                    A backup-enabled cluster needs a `storageConfig`. Without it, the operator aborts the reconcile (BackupConfigInvalid).
                    See docs/backup.md for details.
                useTemplates:
                  type: array
                  description: |
                    list of `ClickHouseInstallationTemplate` (chit) resource names which will merge with current `CHI`
                    manifest during render Kubernetes resources to create related ClickHouse clusters"
                  # nullable: true
                  items:
                    type: object
                    #required:
                    #  - name
                    properties:
                      name:
                        type: string
                        description: "name of `ClickHouseInstallationTemplate` (chit) resource"
                      namespace:
                        type: string
                        description: "Kubernetes namespace where need search `chit` resource, depending on `watchNamespaces` settings in `clickhouse-operator`"
                      useType:
                        type: string
                        description: "optional, current strategy is only merge, and current `chi` settings have more priority than merged template `chit` (case-insensitive)"
                        enum:
                          # List useTypeXXX constants from model (both humped and all-lowercase accepted)
                          - ""
                          - "Merge"
                          - "merge"
