                                - "delete"
                              description: "Behavior policy for failed Service, `Retain` by default"
                    macros:
                      type: object
                      description: "macros parameters"
                      properties:
                        sections:
                          type: object
                          description: "sections behaviour for macros"
                          properties:
                            users:
                              type: object
