                    - "LabelCHIScopeCycleIndex"
                    - "LabelCHIScopeCycleOffset"
                    - "LabelClusterScopeIndex"
                    - "LabelClusterScopeCycleSize"
                    - "LabelClusterScopeCycleIndex"
                    - "LabelClusterScopeCycleOffset"
            metrics:
              type: object
              description: "defines metrics exporter options"
              properties:
                labels:
                  type: object
                  description: "defines metric labels options"
                  properties:
                    exclude:
                      type: array
                      description: |
                        When adding labels to a metric exclude labels with names from the following list
                      items:
                        type: string
            status:
              type: object
              description: "defines status options"
              properties:
                fields:
                  type: object
                  description: "defines status fields options"
                  properties:
                    action:
                      !!merge <<: *TypeStringBool
                      description: "Whether the operator should fill status field 'action'"
                    actions:
                      !!merge <<: *TypeStringBool
                      description: "Whether the operator should fill status field 'actions'"
                    error:
                      !!merge <<: *TypeStringBool
                      description: "Whether the operator should fill status field 'error'"
                    errors:
                      !!merge <<: *TypeStringBool
                      description: "Whether the operator should fill status field 'errors'"
            statefulSet:
              type: object
              description: "define StatefulSet-specific parameters"
              properties:
                revisionHistoryLimit:
                  type: integer
                  description: "revisionHistoryLimit is the maximum number of revisions that will be\nmaintained in the StatefulSet's revision history.                         \nLook details in `statefulset.spec.revisionHistoryLimit`\n"
            pod:
              type: object
              description: "define pod specific parameters"
              properties:
                terminationGracePeriod:
                  type: integer
                  description: "Optional duration in seconds the pod needs to terminate gracefully. \nLook details in `pod.spec.terminationGracePeriodSeconds`\n"
            backup:
              type: object
              description: "EXPERIMENTAL. Defaults of operator-managed backup, see docs/backup.md"
              properties:
                storagePath:
                  type: string
                  description: |
                    Where in its storage the clickhouse-backup sidecar of a host keeps its backups when the settings of that
                    storage set no path. A template clickhouse-backup expands with the macros of the host: {namespace},
                    {installation}, {cluster}, {shard}, {replica}. Default: backup/{namespace}/{installation}/{cluster}/{shard}.
                    Changing it rolls the pods of every backup-enabled cluster and leaves the backups made under the old path
                    where they are
                storageObjectDiskPath:
                  type: string
                  description: |
                    Where in its storage the clickhouse-backup sidecar of a host keeps the object disk data of its backups when
                    the settings of that storage set no object disk path. A template like storagePath.
                    Default: object_disks/{namespace}/{installation}/{cluster}/{shard}
                path:
                  type: string
                  description: |
                    Path to the folder of the backup orchestrator script, backup-orchestrator.sh, which the backup, verify
                    and restore Jobs run. Relative to the folder of the operator configuration unless absolute. Default: backup
                pythonPath:
                  type: string
                  description: |
                    Path to the folder of the Python orchestrator script, backup-orchestrator.py, which the Jobs of a cluster
                    with backup.orchestrator python run. Relative to the folder of the operator configuration unless absolute.
                    Default: backup-python
            logger:
              type: object
              description: "allow setup clickhouse-operator logger behavior"
              properties:
                logtostderr:
                  type: string
                  description: "boolean, allows logs to stderr"
                alsologtostderr:
                  type: string
                  description: "boolean allows logs to stderr and files both"
                v:
                  type: string
                  description: "verbosity level of clickhouse-operator log, default - 1 max - 9"
                stderrthreshold:
                  type: string
                vmodule:
                  type: string
                  description: |
                    Comma-separated list of filename=N, where filename (can be a pattern) must have no .go ext, and N is a V level.
                    Ex.: file*=2 sets the 'V' to 2 in all files with names like file*.
                log_backtrace_at:
                  type: string
                  description: |
                    It can be set to a file and line number with a logging line.
                    Ex.: file.go:123
                    Each time when this line is being executed, a stack trace will be written to the Info log.
