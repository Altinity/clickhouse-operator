                                    type: string
                                  key:
                                    description: The key of the secret to select from. Must be a valid secret key.
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its key must be defined
                                    type: boolean
                                required:
                                  - name
                                  - key
                      security:
                        type: object
                        description: |
                          Per-cluster security toggles for outbound TLS connections the operator makes
                          to this cluster's ClickHouse and ZooKeeper / Keeper hosts. Nil fields fall
                          through to the operator-wide defaults in ClickHouseOperatorConfiguration.
                          See docs/security_hardening.md for details.
                        x-kubernetes-preserve-unknown-fields: true
                      backup: &TypeClusterBackup
                        type: object
                        description: |
                          EXPERIMENTAL. Operator-managed backup for this cluster, overriding `chi.spec.backup`.
                          Fields left empty are inherited from `chi.spec.backup`; set `enabled: "no"` to opt this cluster out.
                          When enabled in mode sidecar, the operator injects a clickhouse-backup sidecar into every Pod of the
                          cluster, so turning it on or off rolls the cluster's Pods. Customize the container through a container
                          named clickhouse-backup in the Pod template `podTemplate` names. Backup takes effect only where the
                          cluster has a `configSecretRef`: without it clickhouse-backup would have no storage and no API
                          credentials, so backup stays off and the operator warns.
                          See docs/backup.md for details.
                        properties:
                          enabled:
                            !!merge <<: *TypeStringBool
                            description: |
                              Enable operator-managed backup: inject the clickhouse-backup sidecar and allow backup/restore resources to target
                              the cluster. Takes effect only with `configSecretRef` set, which names where clickhouse-backup takes its
                              storage and API credentials from: without it, backup stays off
                          mode:
                            type: string
                            description: |
                              How the operator reaches clickhouse-backup on the hosts of the cluster. sidecar (default) injects it into
                              every ClickHouse Pod. pod injects nothing: while a backup or a restore of the cluster runs, the operator
                              runs one backup Pod per shard on the node of a ready replica, mounting that replica's volumes
                            enum:
                              - ""
                              - sidecar
                              - pod
                          podTemplate:
                            type: string
                            description: |
                              Pod template whose container named clickhouse-backup the sidecar is built on: what the container sets is kept,
                              and the operator fills in only what it lacks. Only that container is taken, not the other containers, volumes
                              or Pod settings of the template. Left empty, the operator builds the sidecar on its own
                          configSecretRef:
                            type: object
                            description: |
                              Secret in the installation's namespace whose key `config.yml` holds the clickhouse-backup configuration
                              of the sidecar, a YAML mapping of its sections, e.g. general.remote_storage, s3.bucket, s3.path,
                              s3.access_key, s3.secret_key. The operator generates the configuration file of the sidecar from it,
                              which follows a change of the Secret without a restart. A cluster that leaves it out takes the
                              installation's; an explicit `name: ""` on a cluster leaves the cluster without one. Required: without
                              one, backup stays off. The configuration must set api.username and api.password of the REST API
                            properties:
                              name:
                                description: |
                                  Name of the referent. More info:
                                  https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                          preferredReplica:
                            type: integer
                            minimum: 0
                            description: |
