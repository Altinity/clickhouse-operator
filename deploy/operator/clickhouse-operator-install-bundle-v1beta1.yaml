apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackupschedules.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackupSchedule
    singular: clickhousebackupschedule
    plural: clickhousebackupschedules
    shortNames:
      - chbs
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: phase
          type: string
          description: Schedule phase - Active, Suspended or Aborted
          jsonPath: .status.phase
        - name: suspend
          type: string
          description: Whether the schedule is suspended by its spec
          jsonPath: .spec.suspend
        - name: status
          type: string
          description: Reason of the Ready condition - whether the schedule runs, why it does not, or that its last run failed or backed up no data
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: last-schedule
          type: date
          description: Last time a backup Job was scheduled
          jsonPath: .status.lastScheduleTime
        - name: last-success
          type: date
          description: Oldest of the last successful scheduled backups of the clusters
          jsonPath: .status.lastSuccessfulTime
        - name: last-backup
          type: string
          description: Newest backup a scheduled run made on every cluster
          jsonPath: .status.lastBackupName
          priority: 1
        - name: last-failure
          type: date
          description: Last time a scheduled backup failed
          jsonPath: .status.lastFailureTime
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackupSchedule defines a recurring backup of a ClickHouseInstallation.
            The operator runs one CronJob per backup-enabled cluster it targets, on the cron schedule of the
            finest of its entries, each driving clickhouse-backup on the cluster (see ClickHouseInstallation
            spec.backup); a run whose time matches coarser entries counts for them too. After a successful run
            the backups of the schedule's series that no entry keeps are deleted. The API may change in a future
            release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - schedules
              properties:
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the schedule whose key `backup-orchestrator.sh` the runs of its CronJobs
                    run instead of the operator's orchestrator script, the one of the operator configuration
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each by a CronJob of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                schedules:
                  type: array
                  minItems: 1
                  description: |
                    The periods the schedule backs up at, at most one entry per period. Every entry that sets a time sets the
                    same, which an hour or 6hours entry that sets none takes, so every slot of a coarser entry is a slot of the
                    finest one, whose cron schedule the CronJobs run on. A run matches its time against the entries: one backup
                    is made, for the entry of the longest period it matches, and it counts for each of them. A weekly and a
                    monthly entry need a daily or finer one beside them
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                      - keep
                    properties:
                      period:
                        type: string
                        description: "How often the entry is due; a minute entry is due every minute, whatever its time"
                        enum:
                          - minute
                          - hour
                          - 6hours
                          - daily
                          - weekly
                          - monthly
                      time:
                        type: string
                        description: |
                          HH:MM the entry is due at, in timeZone. Required for daily, weekly and monthly. For hour only its
                          minute is used, for 6hours its hour modulo 6 and its minute; empty takes the time the other entries
                          set, 00:00 when none does
                        pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
                      day:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 31
                        description: |
                          Day the entry is due on: for weekly 0..6, 0 being Sunday; for monthly 1..31, a day past the end
                          of a shorter month meaning its last day. Required for weekly and monthly, not set otherwise
                      keep:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "How many of the newest backups made at the slots of the entry are kept, at least 1"
                      incremental:
                        # A StringBool, polymorphic as suspend below
                        x-kubernetes-preserve-unknown-fields: true
                        description: |
                          Make the runs of the entry incremental backups on the newest backup of the series while the chain
                          of incremental backups is shorter than keep; the run after makes a full backup again. At most one
                          entry
                timeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone the schedules are read in, e.g. Europe/Berlin, as the CronJob's timeZone. Empty reads them in
                    the time zone of the Kubernetes controller manager, UTC as a rule
                suspend: &TypeStringBool
                  description: "Pause creation of new backup Jobs. Jobs already running are not affected"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                concurrencyPolicy:
                  type: string
                  description: |
                    How to treat a run that is due while the previous one is still running.
                    Forbid (default) starts the new run only once the running one has finished, and not at all past
                    startingDeadlineSeconds; Allow runs both; Replace stops the running one.
                  enum:
                    - Allow
                    - Forbid
                    - Replace
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  description: "Deadline in seconds for starting a run that missed its scheduled time"
                successfulJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many successful finished Jobs to keep, at least 1: the operator learns from the Job of a run
                    the backup it made, whether that backup holds data and the hosts it backed up. Defaults to 3
                failedJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many failed finished Jobs to keep, at least 1: the operator learns from the Job of a run why
                    it failed and the hosts it backed up. Defaults to 1
                schemaOnly:
                  !!merge <<: *TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long each backup Job may run before it is stopped and the run fails. Defaults to 24 hours"
                backupNamePrefix:
                  type: string
                  description: |
                    Prefix of the backup names; each run appends the time it was due, -YYYYMMDDHHMMSS.
                    Retention only ever prunes backups named with this prefix and such a time. Defaults to
                    "<namespace>-<installation>-<schedule>", shortened with a hash when longer. At most
                    112 characters, so the name with its suffix stays within 128.
                    Can be set once and is immutable after, as a changed prefix would leave the backups of the
                    former series unpruned. Set later, it replaces the default prefix the same way: meant for a
                    schedule that has not run yet, such as one held for a recovery
                  maxLength: 112
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the schedule"
                  enum:
                    - Active
                    - Suspended
                    - Aborted
                reason:
                  type: string
                  description: "Why the schedule is in its phase, in one word"
                message:
                  type: string
                  description: "Why the schedule is in its phase, in a sentence"
                nextScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Next time a run of the CronJobs matches an entry of the schedule"
                entries:
                  type: array
                  description: "State of the runs of each entry of the schedule"
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                    properties:
                      period:
                        type: string
                        description: "Period of the entry"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run matching the entry was scheduled, made for it or for a coarser entry that matched as well"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful run matching the entry made"
                clusters:
                  type: array
                  description: |
                    The clusters the schedule backs up, each by a CronJob of its own, and a cluster it no longer backs up
                    while retention leaves backups of it unpruned, with the state of the runs on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      cronJobName:
                        type: string
                        description: "Name of the CronJob that runs the schedule on the cluster"
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration the runs of the cluster keep their backups by, as its CronJob was last built: for a cluster that lost its CronJob, the storage its unpruned backups lie in"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a backup Job was scheduled on the cluster"
                      lastSuccessfulTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster completed successfully"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful scheduled run of the cluster made"
                      lastFailureTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster failed"
                      lastFailureMessage:
                        type: string
                        description: "Why the last failed scheduled backup Job of the cluster failed"
                      retentionHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts of the cluster the schedule backs up that a scheduled run has backed up: those that hold its
                          backups, which retention, when on, prunes
                        items:
                          type: string
                      unprunedHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts that left retentionHosts while retention was on. No run reaches them any more, so retention
                          no longer prunes the backups they made, which stay until deleted by hand. A host that
                          rejoins retentionHosts is dropped from it.
                        items:
                          type: string
                lastScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a backup Job was scheduled on any cluster"
                lastSuccessfulTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Oldest of the last successful runs of the clusters the schedule backs up: by then every cluster had a backup. Unset while a cluster has none"
                lastBackupName:
                  type: string
                  description: "Newest backup a scheduled run made on every cluster the schedule backs up. While a cluster lags, the retention of the others may have pruned it already: the per-cluster names tell what each cluster still holds"
                lastFailureTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a scheduled backup Job failed on any cluster"
                lastFailureMessage:
                  type: string
                  description: "Why the last failed scheduled backup Job failed"
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouserestores.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseRestore
    singular: clickhouserestore
    plural: clickhouserestores
    shortNames:
      - chr
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: backup
          type: string
          description: Backup the restore Job restores
          jsonPath: .status.backupName
        - name: phase
          type: string
          description: Restore phase
          jsonPath: .status.phase
        - name: duration
          type: integer
          description: Restore duration (seconds)
          jsonPath: .status.durationSeconds
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseRestore defines a one-off restore of a backup into a
            ClickHouseInstallation. The operator runs one Job per backup-enabled cluster it targets,
            each driving the clickhouse-backup sidecar it injects into the cluster (see
            ClickHouseInstallation spec.backup). Restoring into a fresh, empty installation is
            recommended. The API may change in a future release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - backupName
              properties:
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the restore whose key `backup-orchestrator.sh` its Jobs run instead of the
                    operator's orchestrator script, the one of the operator configuration
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace (a fresh, empty installation is recommended). Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to restore into. Empty restores every backup-enabled cluster, each in a Job of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                backupName:
                  type: string
                  description: "Backup to restore"
                  maxLength: 128
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                sourceInstallation:
                  type: string
                  description: |
                    ClickHouseInstallation that made the backup, when not the restored one: the restore reads the backup from the
                    storage paths the {installation} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                sourceNamespace:
                  type: string
                  description: |
                    Namespace of the ClickHouseInstallation that made the backup, when not that of the restored one: the restore
                    reads the backup from the storage paths the {namespace} macro gives there. Empty, that of the restored installation. Immutable
                  maxLength: 63
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                schemaOnly: &TypeStringBool
                  description: "Restore table/database definitions only (no data)"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                overwrite:
                  !!merge <<: *TypeStringBool
                  description: "Allow restoring over existing tables, which are dropped first. When false (default) the restore is refused if any target host already holds user tables"
                validateTopology:
                  !!merge <<: *TypeStringBool
                  description: "When true (default) the restore is refused unless every target shard holds the backup, so a backup taken from a different layout is not half-applied"
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated, restricting the schema and the data restored. Empty restores every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                rbac:
                  !!merge <<: *TypeStringBool
                  description: |
                    Also restore the users, roles, grants and other access entities the backup holds. They belong to the
                    whole installation, so only a restore with an empty cluster may set it. Needs ClickHouse 23.3 or later
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long the restore Job may run before it is stopped and the restore fails. Defaults to 24 hours"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Lifecycle phase of the restore"
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                backupName:
                  type: string
                  description: "Backup the restore Jobs restore, as it was when the first Job was created"
                cluster:
                  type: string
                  description: "Cluster spec.cluster named when the restore was validated, empty for every backup-enabled cluster: what the restore holds and whether it restores access entities follow it"
                clusters:
                  type: array
                  description: |
                    The clusters the restore targets, resolved once it is validated, each run by a Job of its own,
                    and the state of the restore on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      phase:
                        type: string
                        description: "Lifecycle phase of the restore on the cluster"
                        enum:
                          - Pending
                          - Running
                          - Completed
                          - Failed
                          - Aborted
                      jobName:
                        type: string
                        description: "Job that drives the restore on the cluster"
                      hosts:
                        type: array
                        nullable: true
                        description: "Hosts of the cluster the Job drives"
                        items:
                          type: string
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration of the cluster the Job keeps the backup by, or reads it by, as the Job was built: the storage the backup lies in"
                      startTime:
                        type: string
                        format: date-time
                        nullable: true
                      completionTime:
                        type: string
                        format: date-time
                        nullable: true
                      reason:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it, in one word"
                      message:
                        type: string
                        description: "Why the cluster waits, or how the restore went on it"
                startTime:
                  type: string
                  format: date-time
                  nullable: true
                completionTime:
                  type: string
                  format: date-time
                  nullable: true
                durationSeconds:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
---
# Template Parameters:
#
# COMMENT=
# NAMESPACE=kube-system
# NAME=clickhouse-operator
#
# Setup ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-operator
  namespace: kube-system
  labels:
    clickhouse.altinity.com/chop: 0.28.0
# Template Parameters:
#
# NAMESPACE=kube-system
# COMMENT=#
# ROLE_KIND=ClusterRole
# ROLE_NAME=clickhouse-operator-kube-system
# ROLE_BINDING_KIND=ClusterRoleBinding
# ROLE_BINDING_NAME=clickhouse-operator-kube-system
#
---
# Specifies either
#   ClusterRole
# or
#   Role
# to be bound to ServiceAccount.
# ClusterRole is namespace-less and must have unique name
# Role is namespace-bound
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clickhouse-operator-kube-system
  #namespace: kube-system
  labels:
    clickhouse.altinity.com/chop: 0.28.0
rules:
  #
  # Core API group
  #
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - persistentvolumeclaims
      - secrets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
      - delete
  # The backup orchestrator Jobs run as the operator's ServiceAccount. In a namespace other than the
  # operator's own the operator creates a ServiceAccount of that name, and a Role and RoleBinding that
  # let the orchestrator read the backup resources and pods and post events
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # The backup controllers are leader-elected by a Lease in the namespace of the operator
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
  #
  # apps.* resources
  #
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - patch
      - update
      - delete
  # The operator deployment personally, identified by name
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - clickhouse-operator
    verbs:
      - get
      - patch
      - update
      - delete
  #
  # policy.* resources
  #
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
      - create
      - delete
  #
  # discovery.* resources
  #
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  #
  # batch.* resources - backup/restore Jobs and CronJobs
