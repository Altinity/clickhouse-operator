apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhousebackupschedules.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.28.0
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseBackupSchedule
    singular: clickhousebackupschedule
    plural: clickhousebackupschedules
    shortNames:
      - chbs
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: installation
          type: string
          description: Target ClickHouseInstallation
          jsonPath: .spec.clickHouseInstallation
        - name: cluster
          type: string
          description: Target cluster, empty means every backup-enabled cluster
          jsonPath: .spec.cluster
          priority: 1
        - name: phase
          type: string
          description: Schedule phase - Active, Suspended or Aborted
          jsonPath: .status.phase
        - name: suspend
          type: string
          description: Whether the schedule is suspended by its spec
          jsonPath: .spec.suspend
        - name: status
          type: string
          description: Reason of the Ready condition - whether the schedule runs, why it does not, or that its last run failed or backed up no data
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: last-schedule
          type: date
          description: Last time a backup Job was scheduled
          jsonPath: .status.lastScheduleTime
        - name: last-success
          type: date
          description: Oldest of the last successful scheduled backups of the clusters
          jsonPath: .status.lastSuccessfulTime
        - name: last-backup
          type: string
          description: Newest backup a scheduled run made on every cluster
          jsonPath: .status.lastBackupName
          priority: 1
        - name: last-failure
          type: date
          description: Last time a scheduled backup failed
          jsonPath: .status.lastFailureTime
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: |
            EXPERIMENTAL. ClickHouseBackupSchedule defines a recurring backup of a ClickHouseInstallation.
            The operator runs one CronJob per backup-enabled cluster it targets, on the cron schedule of the
            finest of its entries, each driving clickhouse-backup on the cluster (see ClickHouseInstallation
            spec.backup); a run whose time matches coarser entries counts for them too. After a successful run
            the backups of the schedule's series that no entry keeps are deleted. The API may change in a future
            release.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clickHouseInstallation
                - schedules
              properties:
                orchestratorConfigMapRef:
                  type: object
                  description: |
                    ConfigMap in the namespace of the schedule whose key `backup-orchestrator.sh` (`backup-orchestrator.py` for a cluster whose backup.orchestrator is python) the runs of its CronJobs
                    run instead of the operator's orchestrator script, the one of the operator configuration
                  properties:
                    name:
                      description: |
                        Name of the referent. More info:
                        https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                clickHouseInstallation:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Name of the target ClickHouseInstallation in the same namespace. Immutable"
                cluster:
                  type: string
                  description: "Optional cluster of the ClickHouseInstallation to back up. Empty backs up every backup-enabled cluster, each by a CronJob of its own. Immutable"
                  # Mirrors the ClickHouseInstallation cluster name constraint
                  maxLength: 15
                  pattern: "^[a-zA-Z0-9-]{0,15}$"
                schedules:
                  type: array
                  minItems: 1
                  description: |
                    The periods the schedule backs up at, at most one entry per period. Every entry that sets a time sets the
                    same, which an hour or 6hours entry that sets none takes, so every slot of a coarser entry is a slot of the
                    finest one, whose cron schedule the CronJobs run on. A run matches its time against the entries: one backup
                    is made, for the entry of the longest period it matches, and it counts for each of them. A weekly and a
                    monthly entry need a daily or finer one beside them
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                      - keep
                    properties:
                      period:
                        type: string
                        description: "How often the entry is due; a minute entry is due every minute, whatever its time"
                        enum:
                          - minute
                          - hour
                          - 6hours
                          - daily
                          - weekly
                          - monthly
                      time:
                        type: string
                        description: |
                          HH:MM the entry is due at, in timeZone. Required for daily, weekly and monthly. For hour only its
                          minute is used, for 6hours its hour modulo 6 and its minute; empty takes the time the other entries
                          set, 00:00 when none does
                        pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
                      day:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 31
                        description: |
                          Day the entry is due on: for weekly 0..6, 0 being Sunday; for monthly 1..31, a day past the end
                          of a shorter month meaning its last day. Required for weekly and monthly, not set otherwise
                      keep:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "How many of the newest backups made at the slots of the entry are kept, at least 1"
                      incremental:
                        # A StringBool, polymorphic as suspend below
                        x-kubernetes-preserve-unknown-fields: true
                        description: |
                          Make the runs of the entry incremental backups on the newest backup of the series while the chain
                          of incremental backups is shorter than keep; the run after makes a full backup again. At most one
                          entry
                      configOverrides:
                        type: array
                        nullable: true
                        maxItems: 16
                        x-kubernetes-list-type: set
                        description: |
                          clickhouse-backup settings the runs of the entry make their backups with in place of those of the
                          sidecar, KEY=VALUE of the env var of the setting, e.g. S3_STORAGE_CLASS=GLACIER_IR; a leading --env= is
                          stripped. Those of the heaviest entry of a slot apply. Not the settings the operator sets, those of
                          where the backups are, of the API or of secrets
                        items:
                          type: string
                          pattern: '^(--env=)?[A-Z][A-Z0-9_]{0,63}=[A-Za-z0-9_.,:/@+=-]{1,256}$'
                timeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone the schedules are read in, e.g. Europe/Berlin, as the CronJob's timeZone. Empty reads them in
                    the time zone of the Kubernetes controller manager, UTC as a rule
                suspend: &TypeStringBool
                  description: "Pause creation of new backup Jobs. Jobs already running are not affected"
                  # StringBool is polymorphic — accepts native YAML bool (true/false),
                  # integer (0/1), or string from the recognized vocabulary.
                  # See pkg/apis/common/types/string_bool.go (UnmarshalJSON + IsValid).
                  # Structural-schema rules don't natively support bool|int|string
                  # union, so we use x-kubernetes-preserve-unknown-fields: true.
                  x-kubernetes-preserve-unknown-fields: true
                concurrencyPolicy:
                  type: string
                  description: |
                    How to treat a run that is due while the previous one is still running.
                    Forbid (default) starts the new run only once the running one has finished, and not at all past
                    startingDeadlineSeconds; Allow runs both; Replace stops the running one.
                  enum:
                    - Allow
                    - Forbid
                    - Replace
                startingDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  description: "Deadline in seconds for starting a run that missed its scheduled time"
                successfulJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many successful finished Jobs to keep, at least 1: the operator learns from the Job of a run
                    the backup it made, whether that backup holds data and the hosts it backed up. Defaults to 3
                failedJobsHistoryLimit:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |
                    How many failed finished Jobs to keep, at least 1: the operator learns from the Job of a run why
                    it failed and the hosts it backed up. Defaults to 1
                schemaOnly:
                  !!merge <<: *TypeStringBool
                  description: "Back up table/database definitions only (no data)"
                replicaSelection:
                  type: string
                  description: |
                    Which replicas to back up.
                    FirstPerShard (default) backs up one replica per shard, which is enough for Replicated* tables.
                    AllReplicas backs up every replica; use it when the cluster holds non-replicated tables.
                  enum:
                    - FirstPerShard
                    - AllReplicas
                tables:
                  type: string
                  description: "Optional clickhouse-backup --tables pattern, e.g. db.table or db.*, comma-separated. Empty backs up every table"
                  maxLength: 1024
                  pattern: "^([A-Za-z0-9_.*?,][A-Za-z0-9_.*?,-]*)?$"
                partitions:
                  type: array
                  description: "Optional partition ids to back up (clickhouse-backup --partitions)"
                  nullable: true
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{1,128}$"
                activeDeadlineSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: "How long each backup Job may run before it is stopped and the run fails. Defaults to 24 hours"
                backupNamePrefix:
                  type: string
                  description: |
                    Prefix of the backup names; each run appends the time it was due, -YYYYMMDDHHMMSS.
                    Retention only ever prunes backups named with this prefix and such a time. Defaults to
                    "<namespace>-<installation>-<schedule>", shortened with a hash when longer. At most
                    112 characters, so the name with its suffix stays within 128.
                    Can be set once and is immutable after, as a changed prefix would leave the backups of the
                    former series unpruned. Set later, it replaces the default prefix the same way: meant for a
                    schedule that has not run yet, such as one held for a recovery
                  maxLength: 112
                  pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                retention:
                  type: object
                  description: |
                    What retention keeps beyond the entries: backups pinned by name, and the backups the schedule kept
                    before a change of its entries or time zone, held until released
                  properties:
                    onScheduleChange:
                      type: string
                      description: |
                        What retention does with the backups the entries kept before a change of the entries or of the
                        time zone: Hold (default) keeps them all until releaseHeld releases the change, and lists in
                        status.clusters[].heldBackups those the schedule as it is would delete; Prune applies the change at once
                      enum:
                        - ""
                        - Hold
                        - Prune
                    keepBackups:
                      type: array
                      nullable: true
                      maxItems: 512
                      description: |
                        Backups retention never deletes, as the Altinity Cloud Manager keeps the backups its dialog of a schedule
                        change pins: their names, or with a naming template the name of the backup of any shard, or the time alone
                        when the template holds no {prefix}
                      items:
                        type: string
                        maxLength: 128
                        pattern: '^[A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?$'
                    releaseHeld:
                      type: string
                      description: |
                        The changeID of status.retention.previous whose held backups, and those of every earlier change, are
                        released: the next run deletes those neither the entries nor keepBackups keep. A later change is never
                        released by it
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Phase of the schedule"
                  enum:
                    - Active
                    - Suspended
                    - Aborted
                reason:
                  type: string
                  description: "Why the schedule is in its phase, in one word"
                message:
                  type: string
                  description: "Why the schedule is in its phase, in a sentence"
                nextScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Next time a run of the CronJobs matches an entry of the schedule"
                entries:
                  type: array
                  description: "State of the runs of each entry of the schedule"
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - period
                  items:
                    type: object
                    required:
                      - period
                    properties:
                      period:
                        type: string
                        description: "Period of the entry"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a run matching the entry was scheduled, made for it or for a coarser entry that matched as well"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful run matching the entry made"
                clusters:
                  type: array
                  description: |
                    The clusters the schedule backs up, each by a CronJob of its own, and a cluster it no longer backs up
                    while retention leaves backups of it unpruned, with the state of the runs on each
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the cluster"
                      cronJobName:
                        type: string
                        description: "Name of the CronJob that runs the schedule on the cluster"
                      configSecret:
                        type: string
                        description: "Secret of the clickhouse-backup configuration the runs of the cluster keep their backups by, as its CronJob was last built: for a cluster that lost its CronJob, the storage its unpruned backups lie in"
                      lastScheduleTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a backup Job was scheduled on the cluster"
                      lastSuccessfulTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster completed successfully"
                      lastBackupName:
                        type: string
                        description: "Backup the last successful scheduled run of the cluster made"
                      lastFailureTime:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Last time a scheduled backup Job of the cluster failed"
                      lastFailureMessage:
                        type: string
                        description: "Why the last failed scheduled backup Job of the cluster failed"
                      retentionHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts of the cluster the schedule backs up that a scheduled run has backed up: those that hold its
                          backups, which retention, when on, prunes
                        items:
                          type: string
                      unprunedHosts:
                        type: array
                        nullable: true
                        description: |
                          Hosts that left retentionHosts while retention was on. No run reaches them any more, so retention
                          no longer prunes the backups they made, which stay until deleted by hand. A host that
                          rejoins retentionHosts is dropped from it.
                        items:
                          type: string
                      heldBackups:
                        type: array
                        nullable: true
                        description: |
                          Backups the last successful scheduled run of the cluster found held for a change of the schedule,
                          status.retention.previous, which the schedule as it is would delete: add those to keep to
                          spec.retention.keepBackups, then release the change with spec.retention.releaseHeld
                        items:
                          type: string
                lastScheduleTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a backup Job was scheduled on any cluster"
                lastSuccessfulTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Oldest of the last successful runs of the clusters the schedule backs up: by then every cluster had a backup. Unset while a cluster has none"
                lastBackupName:
                  type: string
                  description: "Newest backup a scheduled run made on every cluster the schedule backs up. While a cluster lags, the retention of the others may have pruned it already: the per-cluster names tell what each cluster still holds"
                lastFailureTime:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Last time a scheduled backup Job failed on any cluster"
                lastFailureMessage:
                  type: string
                  description: "Why the last failed scheduled backup Job failed"
                retention:
                  type: object
                  description: "The entries and time zone the CronJobs apply, and the changes of them whose backups retention holds"
                  properties:
                    appliedSchedules:
                      type: array
                      nullable: true
                      description: "The entries the CronJobs apply"
                      items:
                        type: object
                        properties:
                          period:
                            type: string
                          time:
                            type: string
                          day:
                            type: integer
                            format: int32
                          keep:
                            type: integer
                            format: int32
                          incremental:
                            type: string
                          configOverrides:
                            type: array
                            nullable: true
                            items:
                              type: string
                    appliedTimeZone:
                      type: string
                      description: "The time zone the CronJobs apply"
                    previous:
                      type: array
                      nullable: true
                      description: "The entries and time zones before each change not released yet, oldest first: retention keeps every backup they kept when the change was made"
                      items:
                        type: object
                        required:
                          - changeID
                        properties:
                          changeID:
                            type: string
                            description: "When the change was made, RFC 3339 in UTC, which identifies it"
                          schedules:
                            type: array
                            nullable: true
                            description: "The entries before the change"
                            items:
                              type: object
                              properties:
                                period:
                                  type: string
                                time:
                                  type: string
                                day:
                                  type: integer
                                  format: int32
                                keep:
                                  type: integer
                                  format: int32
                                incremental:
                                  type: string
                                configOverrides:
                                  type: array
                                  nullable: true
                                  items:
                                    type: string
                          timeZone:
                            type: string
                            description: "The time zone before the change"
                          keepAll:
                            type: boolean
                            description: "Holds every backup made before the change, whatever the entries: the oldest changes merged into one"
                    changeID:
                      type: string
                      description: "The changeID of the newest change of previous, which spec.retention.releaseHeld releases with every earlier one"
                conditions:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                        nullable: true
                      observedGeneration:
                        type: integer
                        format: int64
