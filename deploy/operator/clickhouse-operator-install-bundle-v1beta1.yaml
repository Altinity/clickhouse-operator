                              volumes of that replica's Pod and runs on the same node, by a nodeSelector on the node's hostname. A shard
                              with fewer replicas, or whose preferred replica is not ready, falls back to its next ready replica.
                              Empty means 0, the first replica
                          recovery:
                            type: object
                            description: |
