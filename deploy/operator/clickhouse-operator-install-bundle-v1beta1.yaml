                            # nullable: true
                            items:
                              type: object
                              #required:
                              #  - type
                              properties:
                                type:
                                  type: string
                                  description: "type of distribution, when `Unspecified` (default value) then all listen ports on clickhouse-server configuration in all Pods will have the same value, when `ClusterScopeIndex` then ports will increment to offset from base value depends on shard and replica index inside cluster with combination of `chi.spec.templates.podTemlates.spec.HostNetwork` it allows setup ClickHouse cluster inside Kubernetes and provide access via external network bypass Kubernetes internal network"
                                  enum:
                                    # List PortDistributionXXX constants (both humped and all-lowercase accepted)
                                    - ""
                                    - "Unspecified"
                                    - "unspecified"
                                    - "ClusterScopeIndex"
                                    - "clusterscopeindex"
                          spec:
                            # Host
                            type: object
                            properties:
                              name:
                                type: string
                                description: "by default, hostname will generate, but this allows define custom name for each `clickhouse-server`"
                                minLength: 1
                                # See namePartReplicaMaxLen const
                                maxLength: 15
                                pattern: "^[a-zA-Z0-9-]{0,15}$"
                              zkPort:
                                type: integer
                                minimum: 1
                                maximum: 65535
                              zkPortSecure:
                                type: integer
                                description: "optional, secure (TLS) Keeper client port; emitted alongside zkPort when the cluster opts into secure mode"
                                minimum: 1
                                maximum: 65535
                              raftPort:
                                type: integer
                                minimum: 1
                                maximum: 65535
                              settings:
                                !!merge <<: *TypeSettings
                                description: |
                                  optional, allows configure `clickhouse-server` settings inside <yandex>...</yandex> tag in each `Pod` where this template will apply during generate `ConfigMap` which will mount in `/etc/clickhouse-server/conf.d/`
                                  More details: https://clickhouse.tech/docs/en/operations/settings/settings/
                              files:
                                !!merge <<: *TypeFiles
                                description: |
