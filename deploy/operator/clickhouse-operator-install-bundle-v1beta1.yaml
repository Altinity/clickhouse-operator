                                description: "Backup to recover from. An explicit empty name on a cluster leaves the cluster out of a recovery the installation asks for"
                                maxLength: 128
                                pattern: '^([A-Za-z0-9](\.?[A-Za-z0-9_-])*\.?)?$'
                              sourceInstallation:
                                type: string
                                description: |
                                  ClickHouseInstallation that made the backup, when not this one: the recovery reads the backup from the
                                  storage paths the {installation} macro gives there. Empty, this installation
                                maxLength: 253
                                pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                              sourceNamespace:
                                type: string
                                description: |
                                  Namespace of the ClickHouseInstallation that made the backup, when not this one: the recovery reads the
                                  backup from the storage paths the {namespace} macro gives there. Empty, the namespace of this installation
                                maxLength: 63
                                pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$"
                              orchestratorConfigMapRef:
                                type: object
                                description: |
                                  ConfigMap in the installation's namespace whose key `backup-orchestrator.sh` the ClickHouseRestore of
                                  the recovery runs instead of the operator's orchestrator script: it is copied into that restore. An explicit
                                  `name: ""` on a cluster resets it to the operator's script
                                properties:
                                  name:
                                    description: |
                                      Name of the referent. More info:
                                      https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                      pdbManaged:
                        !!merge <<: *TypeStringBool
                        description: |
                          Specifies whether the Pod Disruption Budget (PDB) should be managed.
                          During the next installation, if PDB management is enabled, the operator will
                          attempt to retrieve any existing PDB. If none is found, it will create a new one
                          and initiate a reconciliation loop. If PDB management is disabled, the existing PDB
                          will remain intact, and the reconciliation loop will not be executed. By default,
                          PDB management is enabled.
                      pdbMaxUnavailable:
                        type: integer
                        description: |
                          Pod eviction is allowed if at most "pdbMaxUnavailable" pods are unavailable after the eviction,
                          i.e. even in absence of the evicted pod. For example, one can prevent all voluntary evictions
                          by specifying 0. This is a mutually exclusive setting with "minAvailable".
                        minimum: 0
                        maximum: 65535
                      reconcile:
                        type: object
                        description: "allow tuning reconciling process"
                        properties:
                          runtime:
                            !!merge <<: *TypeReconcileRuntime
                          host:
                            !!merge <<: *TypeReconcileHost
                          hooks:
                            # Per-cluster cluster-scope hooks. The schema (TypeClusterHookAction) is
                            # defined once at spec.reconcile.cluster.hooks above; this block just
                            # references it. Hooks defined here are merged with any inherited from
                            # CHI-level spec.reconcile.cluster.hooks via dedup'd MergeFrom.
                            type: object
                            description: "cluster-level hooks to execute before and after cluster reconcile"
                            properties:
                              pre:
                                type: array
                                description: "actions to execute before cluster reconcile"
                                nullable: true
                                items:
                                  !!merge <<: *TypeClusterHookAction
                              post:
                                type: array
                                description: "actions to execute after cluster reconcile"
                                nullable: true
                                items:
                                  !!merge <<: *TypeClusterHookAction
                      layout:
                        type: object
                        description: |
                          describe current cluster layout, how much shards in cluster, how much replica in shard
                          allows override settings on each shard and replica separatelly
                        # nullable: true
